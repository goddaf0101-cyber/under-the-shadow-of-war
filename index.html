<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#141412"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="เกมเอาชีวิตรอดแบบเล่าเรื่อง ประเทศไทยในสงครามโลกครั้งที่ 3"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><style>html,body{margin:0;background:#141412}</style><script>window.WW3_BUILD="d878ffdc8d";</script><title>WW3 Thailand Survival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: status ledger on the left, scene band + event card on the right; stacks to one column on phones (scene → card → ledger).
   Single dark look by choice (wartime night-shift console), so only bare :root carries the palette. */
:root{
  --bg:#141413; --panel:#1c1c1a; --panel-2:#232320; --line:#33322d; --line-2:#45433b;
  --fg:#ece8dd; --muted:#9d988a; --faint:#6d695e;
  --accent:#d6a63a; --accent-ink:#1b1606; --accent-soft:rgba(214,166,58,.12);
  --good:#7fb069; --bad:#d9644a; --warn:#d6a63a;
  --bar:#cfc8b6; --bar-track:#2c2b27;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- title screen ---------- */
.title{max-width:640px;margin:6vh auto 0;display:grid;gap:22px}
.title h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:.01em;margin:0;text-wrap:balance}
.title h1 small{display:block;font-size:.36em;letter-spacing:.32em;color:var(--accent);font-weight:600;margin-bottom:10px}
.title p{margin:0;color:var(--muted);max-width:60ch}
.stamp{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent);border:1px dashed var(--line-2);border-radius:999px;padding:3px 12px;width:fit-content}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.charcard{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.charcard dt{color:var(--muted)}
.charcard dd{margin:0;font-weight:500}
.board{width:100%;border-collapse:collapse;font-size:14px}
.board td,.board th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.board,.tbl table.board{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;font-size:13px}
table.board th:nth-child(1),table.board td:nth-child(1){width:26px;padding-inline:4px}
table.board th:nth-child(3),table.board td:nth-child(3){width:58px;text-align:right}
table.board th:nth-child(4),table.board td:nth-child(4){width:31%}
table.board td{overflow-wrap:anywhere;vertical-align:top}
.board th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.06em}

/* ---------- game layout ---------- */
.game{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:12px;display:grid;gap:16px}
.main{display:grid;gap:16px;min-width:0}
@media (max-width:860px){
  .game{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:2}
}
.who{display:flex;gap:12px;align-items:center}
.badge{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--accent);flex:none}
.who b{display:block;font-size:16px;line-height:1.3}
.who span{color:var(--muted);font-size:13px}
.facts{display:grid;gap:2px;font-size:13px;color:var(--muted);margin-top:10px}
.facts b{color:var(--fg);font-weight:500}
.stats{display:grid;gap:7px;margin-top:14px}
.stat{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 34px;align-items:center;gap:8px;font-size:13.5px}
.stat .ic{font-size:14px;text-align:center}
.track{height:7px;background:var(--bar-track);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:4px;transition:width .5s ease}
.stat.mid .fill{background:var(--warn)}
.stat.low .fill{background:var(--bad)}
.stat.low .v{color:var(--bad)}
.stat .v{text-align:right;font-size:13px}
.sec-h{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--muted);margin:0 0 8px}
.mem{display:grid;gap:8px;font-size:13px;max-height:260px;overflow:auto}
.mem div{border-left:2px solid var(--line-2);padding-left:10px;color:var(--muted)}
.mem b{color:var(--fg);font-weight:500}
.side .row .btn{padding:7px 12px;font-size:13px}

/* header */
.dayline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.dayline h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0}
.dayline .meta{color:var(--muted);font-size:14px}
.pips{display:flex;gap:6px;margin-left:auto}
.pip{width:26px;height:6px;border-radius:3px;background:var(--line-2)}
.pip.done{background:var(--muted)}
.pip.now{background:var(--accent)}

/* scene band */
.scene{position:relative;height:clamp(190px,30vw,300px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#0e0e0d}
.scene .bg{position:absolute;inset:0;background-repeat:no-repeat;background-size:auto 100%;filter:saturate(.62) brightness(.82) contrast(1.02);transition:background-position 1.2s ease}
.scene .bg.loc{background-size:cover}
.scene .tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;transition:background .8s}
.scene .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.scene .npc{position:absolute;bottom:9%;height:84%;width:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));transition:opacity .4s}
.scene .shadow{position:absolute;bottom:8%;height:14px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px)}
.scene .actor{position:absolute;bottom:9%;height:84%;width:0;z-index:1}
.scene .actor .spr{position:absolute;bottom:0;left:0;height:100%;width:auto;transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
/* NPC art cropped flat at the file edge: fade that edge so the cut is not a hard line (approved 27 Oct, option 2) */
.scene .actor .spr.fadeL{-webkit-mask-image:linear-gradient(to right,transparent 1%,#000 9%);mask-image:linear-gradient(to right,transparent 1%,#000 9%)}
.scene .actor .spr.fadeR{-webkit-mask-image:linear-gradient(to left,transparent 1%,#000 9%);mask-image:linear-gradient(to left,transparent 1%,#000 9%)}
.scene .actor .shadow{position:absolute;bottom:-1.5%;left:0;width:72px;max-width:14vw;height:12px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px)}
@media (prefers-reduced-motion:no-preference){
  .scene .actor .spr{animation:breathe 3.4s ease-in-out infinite alternate}
  .scene .actor.enter-left{animation:walkInL 1.3s cubic-bezier(.25,.7,.35,1) both}
  .scene .actor.enter-right{animation:walkInR 1.3s cubic-bezier(.25,.7,.35,1) .15s both}
  .scene .actor.enter-left .spr{animation:bob .32s ease-in-out 4,breathe 3.4s ease-in-out 1.3s infinite alternate}
  .scene .actor.enter-right .spr{animation:bob .32s ease-in-out .15s 4,breathe 3.4s ease-in-out 1.45s infinite alternate}
}
.sndbtn{font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-right:6px;cursor:pointer}
.sndbtn[aria-pressed="true"]{color:var(--accent);border-color:rgba(214,166,58,.45)}
table.board tr.me td{background:rgba(214,166,58,.12)}
.you{color:var(--accent);font-size:11px;font-weight:600}
.scene .actor .wsheet{position:absolute;bottom:0;left:0;height:100%;aspect-ratio:168/433;transform:translateX(-50%);background-repeat:no-repeat;background-size:400% 100%;background-position:0 0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.scene .actor .wsheet.walking{background-size:800% 100%}
@media (prefers-reduced-motion:no-preference){
  .scene .actor .wsheet.idle{animation:idle4 2.4s steps(4,end) infinite}
  .scene .actor .wsheet.walking{animation:walk8 1s steps(8,end) infinite}
}
@keyframes walk8{from{background-position:0 0}to{background-position:114.2857% 0}}
@keyframes idle4{from{background-position:0 0}to{background-position:133.3333% 0}}
@keyframes walkInL{from{transform:translateX(-46vw)}to{transform:translateX(0)}}
@keyframes walkInR{from{transform:translateX(46vw)}to{transform:translateX(0)}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3%)}}
@keyframes breathe{from{transform:translateX(-50%) scaleY(1)}to{transform:translateX(-50%) scaleY(1.012)}}
.scene .foot-band{position:absolute;left:0;right:0;bottom:0;height:17%;min-height:26px;background:linear-gradient(180deg,rgba(12,12,11,0),rgba(12,12,11,.78) 45%);z-index:2;pointer-events:none}
.scene .who-tag{position:absolute;bottom:5px;transform:translateX(-50%);font-size:11.5px;line-height:1.5;color:var(--fg);padding:1px 9px;border-radius:999px;background:rgba(12,12,11,.6);border:1px solid rgba(255,255,255,.12);white-space:nowrap;z-index:3;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.scene .who-tag.me{color:var(--accent);font-weight:600;border-color:rgba(214,166,58,.45)}
.scene .npc.player{z-index:1}
.scene .actor.pet{z-index:2}
.scene .actor.pet .shadow{width:48px;height:8px}
.scene .tag{position:absolute;right:10px;top:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;background:rgba(10,10,9,.66);color:var(--fg);padding:3px 9px;border-radius:999px}
.scene .props{position:absolute;right:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.scene .props img{width:40px;height:40px;background:rgba(10,10,9,.6);border-radius:8px;padding:3px;border:1px dashed var(--accent)}
@media (prefers-reduced-motion:no-preference){ .scene .bg{animation:drift 40s ease-in-out infinite alternate} }
@keyframes drift{from{transform:scale(1.04) translateX(-1%)}to{transform:scale(1.04) translateX(1%)}}

/* event card */
.event{border-left:3px solid var(--accent)}
.eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.16em;color:var(--accent);font-weight:600}
.event h3{font-family:var(--f-display);font-size:22px;font-weight:600;margin:2px 0 8px;text-wrap:balance}
.event p.scene-text{margin:0 0 14px;max-width:68ch}
.recall{font-size:13px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.recall b{color:var(--fg);font-weight:500}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:16px;line-height:1.5}
.choice .peek{display:block;margin-top:4px}
.result p{margin:0 0 12px;max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.up{color:var(--good);border-color:rgba(127,176,105,.4)}
.chip.down{color:var(--bad);border-color:rgba(217,100,74,.4)}
.chip.none{color:var(--faint)}
.foot{display:flex;justify-content:flex-end;margin-top:14px;gap:10px;flex-wrap:wrap}
/* chapters + night (27 Oct) */
.chap{font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:7px 11px;margin:10px 0 0}
.chap b{color:var(--accent)}
.chap{cursor:pointer}
.nopts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.nopt{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 6px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.25}
.nopt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:3px}
.nopt:hover{border-color:var(--accent)}
.place{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.place b{display:block;margin-bottom:4px}
/* stock + build (28 Oct) */
.stockbar{display:flex;flex-wrap:nowrap;align-items:center;gap:2px 8px;width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:5px 8px;margin:12px 0 8px;cursor:pointer;font-size:13px;overflow:hidden}
.stockbar .it{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.stockbar .it.zero{opacity:.4}
.stockbar img,.srow img,.ichip img{width:20px;height:20px;object-fit:contain}
.stockbar .more{margin-left:auto;color:var(--accent);white-space:nowrap}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow img{width:26px;height:26px}
.srow .sub{display:block;font-size:12px;color:var(--muted)}
.srow .btn{padding:6px 12px;font-size:13px}
.srow .lack{color:var(--bad)}
.ichip{display:inline-flex;align-items:center;gap:3px}
/* built things stand in the home scene (28 Oct) */
.scene .bitem{position:absolute;bottom:7%;height:21%;width:auto;transform:translateX(-50%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.55)) saturate(.8) brightness(.92);z-index:0;pointer-events:none}
.scene .bitem.wide{height:18%}
.scene .bitem.new{animation:bnew 1.6s ease-out 2}
@keyframes bnew{0%{filter:drop-shadow(0 0 0 rgba(212,168,67,0)) brightness(1.4)}50%{filter:drop-shadow(0 0 10px rgba(212,168,67,.9)) brightness(1.3)}100%{filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}}
.trader{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:rgba(127,176,105,.1);border:1px solid rgba(127,176,105,.55);border-radius:10px;padding:4px 10px;margin:8px 0 0;cursor:pointer}
.trader img{width:34px;height:34px;object-fit:cover;object-position:50% 12%;border-radius:8px}
.trader b{display:block;color:var(--good)}
.trader small{display:none}
.trader .go{color:var(--good);font-weight:600;white-space:nowrap}
.bigbuild{display:block;width:150px;height:96px;object-fit:contain;margin:4px auto 6px}
.nopt small.keep{display:block}
.tally{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:8px 0 0}
.log{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.log li{color:var(--muted)}
.log b{color:var(--fg);font-weight:500}
.travel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2);font-size:14px}
select{background:var(--panel-2);color:var(--fg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
.note{font-size:12.5px;color:var(--faint)}
.dead h3{color:var(--bad)}
/* explore prototype (28 Oct) */
.explore .noise{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin:4px 0 0;font-size:13px}
.explore .nbar{height:10px;border-radius:6px;background:var(--bar-track);overflow:hidden}
.explore .nbar i{display:block;height:100%;background:var(--good);transition:width .4s ease}
.explore .noise.warn .nbar i{background:var(--warn)}.explore .noise.bad .nbar i{background:var(--bad)}
.explore .noise.bad b{color:var(--bad)}
.exmsg{margin:0 0 6px;font-size:13px;color:var(--muted)}.exmsg.warn{color:var(--warn)}.exmsg.bad{color:var(--bad);font-weight:600}
.spots{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.spot{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:6px 9px;text-align:left;cursor:pointer;display:grid;gap:1px}
.spot b{font-size:14px}.spot small{font-size:12px;color:var(--muted)}
.spot:not([disabled]):hover{border-color:var(--accent)}
.spot.done{opacity:.7;border-style:dashed}.spot.done small{color:var(--good)}
.spot[disabled]:not(.done){opacity:.45}
.explore .foot{margin-top:6px}.explore .chips{margin-top:4px!important}
/* low energy (28 Oct): the sleep button stands out when energy < 30 */
.nopt.rec{border-color:var(--warn)!important;background:rgba(214,166,58,.16)!important;box-shadow:0 0 0 1px var(--warn) inset}
.nopt.rec small{color:var(--warn)!important;font-weight:600}
.skills{margin-top:10px;display:grid;gap:6px}
/* new-character screen fits 375x600 with skills (28 Oct) */
.newc{gap:10px;margin-top:0}.newc .card{padding:12px 14px}
.newc .charcard{display:grid;grid-template-columns:auto 1fr;gap:0 10px;margin:8px 0 8px!important;font-size:13px;line-height:1.5}
.newc .charcard dt,.newc .charcard dd{margin:0}
.newc .strip{margin-top:4px}
.skills .sec-h{margin:0}
.skrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;background:var(--accent-soft);border:1px solid rgba(214,166,58,.28);border-radius:9px;padding:6px 9px}
.skrow .sklbl{font-size:11px;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 7px;white-space:nowrap;margin-top:2px;font-weight:600}
.skrow b{font-size:13.5px}.skrow .sub{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.skills.compact{gap:4px;margin-top:8px}.skills.compact .skrow{padding:4px 8px}
/* death (28 Oct): the scene drains to black and white, a grave stands where you stood, one candle keeps its colour */
.scene.rip .bg,.scene.rip .actor .spr{filter:grayscale(1) brightness(.62) contrast(1.05);transition:filter 2.4s ease}
.scene.rip{max-height:min(56vh,330px);flex-grow:3}
.scene.rip .tint{background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.55))!important}
.scene .grave{position:absolute;left:24%;bottom:6%;height:70%;transform:translateX(-50%);z-index:2;animation:graveIn 1.8s cubic-bezier(.2,.7,.3,1) .4s both}
.scene .grave svg{height:100%;width:auto;display:block;overflow:visible}
.scene .candle{position:absolute;left:36%;bottom:8%;height:15%;z-index:3;animation:graveIn 1.2s ease 1.6s both}
.scene .candle .fl{transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
@keyframes graveIn{from{opacity:0;transform:translateX(-50%) translateY(14%)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.85,1.12) translateY(-3%)}}
.card.rip{text-align:center;border-color:#4a4843;background:linear-gradient(180deg,#1b1b1a,#141413)}
.card.rip .eyebrow{justify-content:center;letter-spacing:.2em}
.card.rip .rname{font-family:var(--f-display);font-size:30px;font-weight:700;margin:2px 0 0;color:#e9e4d8}
.card.rip .rdays{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.08em}
.card.rip .rcause{margin:8px 0 2px;font-size:15px}

      D: { t: "เอาน้ำที่เก็บไว้เข้าถังกลาง แลกกับเวรรองน้ำ", r: "น้ำของคุณกลายเป็นของส่วนรวม คุณได้ชื่อในเวรรองน้ำและได้ส่วนแบ่งประจำ" } } },
    P3: { title: "ชุมชนต้องแบ่งน้ำ", s: "ที่ประชุมแบ่งน้ำถังกลาง ทุกคนรู้ว่าคุณจดบันทึกเรื่องน้ำมาตลอด จึงขอให้คุณเสนอก่อน", choices: {
      A: { t: "เสนอให้บ้านที่มีคนป่วยได้ก่อน", r: "ที่ประชุมเห็นด้วยทันทีเพราะคุณมีตัวเลขยืนยัน บ้านคุณได้น้อยลงเล็กน้อย" },
      B: { t: "ขอส่วนแบ่งของบ้านคุณตามจริง แล้วถอยออกมา", r: "คุณได้ส่วนของตัวเองพอดี ที่ประชุมเถียงกันต่ออีกนาน" },
      C: { t: "เปิดบันทึกให้ทุกคนดูว่าน้ำเข้าออกเท่าไร", r: "ตัวเลขทำให้ทุกคนเห็นว่าต้องลดส่วนแบ่ง ไม่มีใครเถียง" },
      D: { t: "เสนอตั้งทีมดูแลน้ำ โดยคุณช่วยจดบัญชี", r: "ชุมชนมีระบบน้ำที่ทุกคนตรวจได้ คุณกลายเป็นคนที่ทุกคนเชื่อเรื่องน้ำ" } } }

/* ---- batch1: อาหาร ที่พัก เวชภัณฑ์ ครอบครัว ข่าวสาร ---- */
  "R014": {"P2": {"title": "คนรู้ว่าคุณตุนข้าว", "s": "คนเห็นคุณขนข้าวกลับบ้านหลายรอบ วันนี้เพื่อนบ้านถือผักมาขอแลกข้าว พร้อมพูดเหน็บว่าบ้านคุณคงไม่ขาด", "choices": {"A": {"t": "ให้ข้าวไปโดยไม่ต้องแลก", "r": "เขาเงียบไปครู่หนึ่งแล้วขอบคุณ คำเหน็บในซอยเบาลง ข้าวของคุณลดลงหนึ่งมื้อ"}, "B": {"t": "บอกว่าข้าวมีไว้สำหรับยามจำเป็น", "r": "เขาเดินกลับพร้อมผัก ข่าวว่าคุณตุนข้าวไปถึงปากซอยก่อนค่ำ"}, "C": {"t": "ชั่งข้าวให้ดูว่ามีจริงเท่าไร", "r": "ข้าวพอแค่สิบวัน ไม่ได้มากอย่างที่ลือ คุณแลกให้เขาครึ่งถ้วย"}, "D": {"t": "ตกลงแลกข้าวกับผักทุกสัปดาห์", "r": "เขาส่งผักให้ทุกวันอาทิตย์ คนในซอยเลิกพูดเรื่องข้าวของคุณ"}}}, "P3": {"title": "คนมาถามว่าของยังกินได้ไหม", "s": "หลังคุณคัดข้าวที่ร้านชำ เพื่อนบ้านเริ่มถืออาหารมาถามคุณว่ายังกินได้ไหม", "choices": {"A": {"t": "ช่วยดูให้ทุกคนที่มาถาม", "r": "คุณดูอาหารให้เกือบสิบบ้าน ทั้งวันไม่ได้ทำงานของตัวเองเลย"}, "B": {"t": "ดูให้เฉพาะคนที่คุณรู้จัก", "r": "งานของคุณไม่ค้าง แต่บางคนที่มาไกลต้องกลับไปมือเปล่า"}, "C": {"t": "จดวิธีดูอาหารเสียแต่ละแบบก่อนตอบ", "r": "คุณได้รายการสัญญาณอาหารเสียที่ใช้ตอบได้ทุกครั้ง ไม่ต้องเดา"}, "D": {"t": "สอนเพื่อนบ้านสองสามคนให้ช่วยกันดู", "r": "ในซอยมีคนดูอาหารเป็นสามคน ไม่มีใครต้องรอคุณคนเดียว"}}}},
  "R015": {"P2": {"title": "ราคาข้าวขึ้นทุกวัน", "s": "ร้านชำขึ้นราคาข้าวสารทุกเช้า คุณยังมีเงินเก็บก้อนหนึ่งที่ตั้งใจไว้ใช้ยามจำเป็น", "choices": {"A": {"t": "ซื้อข้าวฝากจุดช่วยเหลือ", "r": "อาสาสมัครได้ข้าวไปแจกคนที่ไม่มีเงิน เงินเก็บของคุณลดลง"}, "B": {"t": "ทุ่มเงินซื้อข้าวตุนก่อนแพงกว่านี้", "r": "คุณมีข้าวพอหลายเดือน เงินเก็บหมด และต้องหาที่วางถังข้าวเพิ่ม"}, "C": {"t": "จดราคาทุกวันดูว่าขึ้นจริงแค่ไหน", "r": "ราคาขึ้นเร็วแค่ร้านเดียว ร้านในตลาดขึ้นช้ากว่า คุณย้ายไปซื้อที่นั่น"}, "D": {"t": "ชวนบ้านใกล้กันลงขันซื้อข้าวทั้งกระสอบ", "r": "ซื้อเหมาได้ถูกลงเกือบหนึ่งในสาม แต่ละบ้านแบ่งข้าวตามเงินที่ลง"}}}, "P3": {"title": "ตาชั่งไม่ตรง", "s": "ที่ตลาดนัดลานวัด คุณสังเกตว่าตาชั่งร้านหนึ่งขาดเกือบขีด ทุกถุงที่ขายได้น้อยกว่าที่จ่าย", "choices": {"A": {"t": "ช่วยคนที่เพิ่งซื้อชั่งใหม่และทวงส่วนที่ขาด", "r": "หลายคนได้ของคืน คุณเสียเวลาครึ่งวันไปกับการเถียง"}, "B": {"t": "เลิกซื้อร้านนั้นเงียบ ๆ", "r": "คุณไม่โดนโกงอีก แต่คนอื่นยังซื้อต่อโดยไม่รู้"}, "C": {"t": "เอาตาชั่งของวัดมาเทียบให้เห็นชัด", "r": "ตาชั่งร้านนั้นขาดจริงหนึ่งขีด เจ้าของยอมรับและปรับตาชั่งใหม่"}, "D": {"t": "เสนอให้วัดตั้งตาชั่งกลางให้ชั่งซ้ำได้", "r": "มีตาชั่งกลางที่หน้าประตู การโกงน้ำหนักหายไปทั้งตลาด"}}}},
  "R016": {"P2": {"title": "มอดขึ้นถังข้าว", "s": "ข้าวที่ตุนไว้ในถังเริ่มมีมอด ถ้าไม่รีบจัดการ ข้าวทั้งถังจะกินไม่ได้", "choices": {"A": {"t": "แบ่งข้าวส่วนที่ยังดีให้บ้านที่ขาด", "r": "ข้าวไม่เสียเปล่า หลายบ้านได้ข้าวคนละถุง ถังของคุณเบาลงมาก"}, "B": {"t": "ร่อนข้าวแล้วตากแดดเก็บไว้เอง", "r": "ข้าวส่วนใหญ่รอด แต่คุณใช้เวลาทั้งวันจนหลังแข็ง"}, "C": {"t": "ตรวจว่ามอดมาจากถุงไหน", "r": "มอดมาจากถุงที่ซื้อร้านเดียว คุณแยกถุงนั้นออก ถังอื่นยังปลอดภัย"}, "D": {"t": "ชวนเพื่อนบ้านมาช่วยร่อนแล้วแบ่งกันกิน", "r": "ข้าวทั้งถังร่อนเสร็จในบ่ายเดียว บ้านที่มาช่วยได้ข้าวกลับไป"}}}, "P3": {"title": "ฉลากวันหมดอายุถูกแปะทับ", "s": "อาหารแห้งที่ร้านใกล้บ้านมีสติกเกอร์วันหมดอายุใหม่แปะทับของเดิม", "choices": {"A": {"t": "เตือนคนที่ถือของพวกนี้อยู่ในร้าน", "r": "หลายคนวางของคืนชั้น เจ้าของร้านมองคุณอย่างไม่พอใจ"}, "B": {"t": "ไม่ซื้อ แล้วไปซื้อที่อื่น", "r": "คุณไม่เสี่ยง แต่ร้านยังขายของพวกนี้อยู่"}, "C": {"t": "แกะสติกเกอร์ดูวันที่ข้างใต้", "r": "ของหมดอายุมาสองเดือนแต่ยังไม่เสีย คุณรู้ว่าอะไรพอกินได้และอะไรไม่ควร"}, "D": {"t": "ให้ผู้นำชุมชนไปคุยกับร้านพร้อมกัน", "r": "ร้านยอมแยกของเก่าขายถูกพร้อมป้ายบอกชัด คนเลือกเองได้"}}}},
  "R017": {"P2": {"title": "โกดังแจกเฉพาะบ้านที่ขาด", "s": "โกดังประกาศแจกอาหารเฉพาะบ้านที่ขาดแคลน เจ้าหน้าที่ถามว่าบ้านคุณยังมีอาหารเหลือเท่าไร", "choices": {"A": {"t": "บอกตามจริงและสละสิทธิ์", "r": "เจ้าหน้าที่ขีดชื่อบ้านคุณออก อาหารส่วนนั้นไปถึงบ้านที่ขาดกว่า"}, "B": {"t": "บอกว่าเหลือน้อย ขอรับส่วนแบ่ง", "r": "คุณได้อาหารเพิ่มอีกกล่อง มีคนในแถวมองหน้าเพราะรู้ว่าบ้านคุณยังมี"}, "C": {"t": "ถามเกณฑ์ว่าบ้านแบบไหนถึงได้", "r": "เกณฑ์คือมีอาหารไม่ถึงสามวัน บ้านคุณไม่เข้าเกณฑ์ คุณรู้ว่าต้องพึ่งตัวเองต่อ"}, "D": {"t": "อาสาช่วยแจก แลกกับของที่เหลือจากการแจก", "r": "คิวเดินเร็วขึ้น ตอนเย็นคุณได้ของที่ไม่มีคนรับกลับบ้านสองถุง"}}}, "P3": {"title": "รายชื่อแจกอาหารไม่ตรง", "s": "โกดังแจกอาหารตามรายชื่อเก่า คุณเห็นชื่อคนที่ย้ายออกไปแล้วหลายชื่อ ขณะที่บางบ้านไม่มีชื่อเลย", "choices": {"A": {"t": "ยกส่วนของคุณให้บ้านที่ตกหล่นจากรายชื่อ", "r": "บ้านที่ไม่มีชื่อได้อาหาร คุณต้องรอรอบหน้า"}, "B": {"t": "รับส่วนของคุณแล้วไม่ยุ่ง", "r": "คุณได้อาหารครบ รายชื่อยังผิดอยู่อย่างนั้น"}, "C": {"t": "เทียบรายชื่อกับบ้านที่อยู่จริงในซอย", "r": "พบชื่อคนที่ย้ายไปแล้วเจ็ดชื่อ เจ้าหน้าที่ตัดออกและเพิ่มบ้านที่ตกหล่นแทน"}, "D": {"t": "เสนอให้แต่ละซอยส่งรายชื่อที่ตรวจแล้วทุกสัปดาห์", "r": "โกดังได้รายชื่อที่เป็นปัจจุบัน ของถึงคนที่อยู่จริงทุกรอบ"}}}},
  "R018": {"P2": {"title": "หนูเข้าคลังของคุณ", "s": "ของที่ตุนไว้ในบ้านมีรอยหนูกัด เพราะวางไว้มากจนไม่เป็นที่", "choices": {"A": {"t": "แจกของที่หนูยังไม่ถึงให้เพื่อนบ้าน", "r": "ของออกจากบ้านไปครึ่งหนึ่ง หนูไม่มีอะไรกิน และเพื่อนบ้านได้ของดี"}, "B": {"t": "ซื้อถังปิดฝามาเก็บใหม่ทั้งหมด", "r": "ของที่เหลือปลอดภัย แต่คุณจ่ายค่าถังไปไม่น้อย"}, "C": {"t": "ไล่ดูว่าหนูเข้าทางไหน", "r": "หนูเข้าทางท่อน้ำทิ้งหลังบ้าน คุณอุดรูได้ภายในชั่วโมง"}, "D": {"t": "ชวนทั้งซอยวางกับดักพร้อมกัน", "r": "หนูลดลงทั้งซอยในสัปดาห์เดียว ไม่มีใครต้องเสียของอีก"}}}, "P3": {"title": "ของในคลังหายไม่ตรงบัญชี", "s": "คลังอาหารชุมชนบอกว่าหนูกัด แต่ของที่หายไปมากกว่ารอยกัดที่เห็นหลายเท่า", "choices": {"A": {"t": "ช่วยขนของที่เหลือไปแจกก่อนจะหายเพิ่ม", "r": "หลายบ้านได้ของทันที คลังว่างลงแต่ไม่มีอะไรหายอีก"}, "B": {"t": "เอาส่วนของคุณไปเก็บเองก่อน", "r": "ของของคุณปลอดภัย แต่ของในคลังกลางยังหายต่อ"}, "C": {"t": "นับของเทียบบัญชีย้อนหลังทีละสัปดาห์", "r": "ของหายเฉพาะคืนที่คนเฝ้าคนเดิมอยู่เวร คุณเก็บบัญชีไว้เป็นหลักฐาน"}, "D": {"t": "เสนอให้เฝ้าคลังเป็นคู่", "r": "ไม่มีใครเฝ้าคนเดียวอีก ของในคลังตรงบัญชีตั้งแต่สัปดาห์นั้น"}}}},
  "R019": {"P2": {"title": "แปลงผักที่คุณปลูกเอง", "s": "ผักที่คุณปลูกไว้หลังบ้านโตพร้อมกันทั้งแปลง กินเองไม่ทันก่อนผักจะแก่เกิน", "choices": {"A": {"t": "แจกผักให้บ้านข้าง ๆ", "r": "ผักไม่เสีย สามบ้านได้ผักสด และเริ่มทักทายคุณบ่อยขึ้น"}, "B": {"t": "ดองและตากแห้งเก็บไว้กินเอง", "r": "คุณมีผักดองพอกินทั้งเดือน แต่ใช้เกลือไปเกือบหมด"}, "C": {"t": "ดูว่าต้นไหนเก็บเมล็ดพันธุ์ต่อได้", "r": "คุณเก็บเมล็ดจากต้นที่ดีที่สุดไว้ รอบหน้าไม่ต้องหาเมล็ดใหม่"}, "D": {"t": "เอาผักไปแลกที่ตลาดแลกของ", "r": "ผักแลกได้ไข่และน้ำมัน คุณกินได้หลากหลายขึ้น"}}}, "P3": {"title": "เมล็ดพันธุ์ไม่งอก", "s": "เมล็ดพันธุ์ที่ชุมชนแจกไปปลูกแล้วไม่งอกเกือบทุกแปลง คนเริ่มโทษกันว่าดูแลไม่ดี", "choices": {"A": {"t": "แบ่งเมล็ดสำรองของคุณให้แปลงที่ไม่งอก", "r": "หลายแปลงได้ปลูกใหม่ทันฤดู เมล็ดสำรองของคุณหมด"}, "B": {"t": "ปลูกซ่อมเฉพาะแปลงของคุณ", "r": "แปลงคุณได้ผักตามกำหนด แปลงอื่นยังว่าง"}, "C": {"t": "ลองเพาะเมล็ดที่เหลือในผ้าชุบน้ำ", "r": "สามวันงอกแค่สองในสิบ ปัญหาอยู่ที่เมล็ด ไม่ใช่คนปลูก"}, "D": {"t": "ชวนคนปลูกเก็บเมล็ดจากต้นที่รอดมาแลกกัน", "r": "ชุมชนมีเมล็ดที่งอกดีจากแปลงของตัวเอง ไม่ต้องพึ่งเมล็ดแจกอีก"}}}},
  "R020": {"P2": {"title": "คนมาขอซื้อผลผลิต", "s": "ฝนมาไม่ตรงฤดู แปลงของหลายบ้านเสีย แต่แปลงของคุณรอด คนเริ่มมาขอซื้อผักถึงหน้าบ้าน", "choices": {"A": {"t": "แบ่งให้บ้านที่ขาดจริงโดยไม่คิดเงิน", "r": "ผักออกไปถึงหลายบ้าน คุณเหลือพอกินแค่สัปดาห์เดียว"}, "B": {"t": "ขายราคาตลาด เก็บส่วนที่ต้องกินไว้", "r": "คุณได้เงินพอซื้อของจำเป็น บางคนบ่นว่าแพงแต่ก็ซื้อ"}, "C": {"t": "ถามว่าแปลงของเขาเสียเพราะอะไร", "r": "แปลงที่เสียอยู่ที่ลุ่มน้ำขัง คุณบอกวิธียกร่องที่ทำให้แปลงคุณรอด"}, "D": {"t": "ชวนบ้านที่แปลงเสียมาปลูกร่วมในแปลงคุณ", "r": "แปลงของคุณมีคนช่วยดูแลเพิ่มสามคน ผลผลิตรอบหน้าแบ่งกันตามแรง"}}}, "P3": {"title": "ปฏิทินเก็บเกี่ยว", "s": "ฝนมาไม่ตรงฤดู ชาวสวนมาขอดูบันทึกแปลงผักที่คุณจดมาตลอด เพื่อตัดสินว่าจะเก็บเกี่ยวเมื่อไร", "choices": {"A": {"t": "ให้ยืมสมุดบันทึกไปทั้งเล่ม", "r": "ชาวสวนวางแผนเก็บเกี่ยวได้ทั้งตำบล สมุดกลับมาเปื้อนดินทั้งเล่ม"}, "B": {"t": "ให้ดูเฉพาะหน้าที่เกี่ยวกับแปลงของเขา", "r": "เขาได้ข้อมูลพอสำหรับแปลงตัวเอง แปลงอื่นยังเดากันต่อ"}, "C": {"t": "เทียบบันทึกกับสภาพแปลงจริงอีกครั้ง", "r": "แปลงแรกเก็บได้พรุ่งนี้ แปลงที่สองต้องรออีกสิบวัน คุณบอกได้แน่นอน"}, "D": {"t": "ทำปฏิทินเก็บเกี่ยวติดไว้ที่ศาลา", "r": "ทุกแปลงมีวันเก็บที่ชัดเจน ผลผลิตเสียน้อยกว่าทุกปี"}}}},
  "R024": {"P2": {"title": "เสริมบ้านให้แข็งแรง", "s": "คุณตัดสินใจเสริมบ้านตัวเองแทนการพึ่งที่พักรวม แต่ไม้และตะปูที่มีเหลือไม่มาก", "choices": {"A": {"t": "แบ่งไม้ให้บ้านข้าง ๆ ที่หลังคารั่วก่อน", "r": "บ้านข้าง ๆ กันฝนได้ บ้านคุณเสริมได้แค่ประตูหน้า"}, "B": {"t": "ใช้ไม้ทั้งหมดเสริมประตูและหน้าต่าง", "r": "บ้านคุณปิดได้แน่นหนา แต่ห้องมืดและอับทั้งวัน"}, "C": {"t": "ดูก่อนว่าจุดไหนอ่อนที่สุด", "r": "จุดอ่อนจริงคือประตูหลัง คุณใช้ไม้แค่ครึ่งเดียวก็ปิดได้แน่น"}, "D": {"t": "แลกไม้กับเพื่อนบ้านให้ได้ขนาดที่ต้องใช้", "r": "ทั้งสองบ้านได้ไม้ขนาดที่ใช้ได้จริง ไม่มีชิ้นไหนเหลือทิ้ง"}}}, "P3": {"title": "ประกาศย้ายอาคารฉบับใหม่", "s": "มีประกาศให้ย้ายออกฉบับใหม่ติดหน้าตึก คราวนี้มีตราประทับ แต่เลขหนังสือดูแปลก", "choices": {"A": {"t": "ช่วยคนแก่เก็บของเผื่อต้องย้ายจริง", "r": "ยายชั้นล่างเก็บกระเป๋าไว้พร้อม เธอใจเย็นลง"}, "B": {"t": "รอดูไปก่อน ไม่เก็บของ", "r": "ไม่มีใครมาจริง คุณไม่เสียแรง แต่นอนไม่ค่อยหลับ"}, "C": {"t": "เทียบเลขหนังสือกับประกาศจริงของอำเภอ", "r": "รูปแบบเลขไม่ตรงกับของอำเภอ คุณบอกทุกห้องว่าเป็นประกาศปลอม"}, "D": {"t": "ชวนผู้อยู่อาศัยไปถามอำเภอพร้อมกัน", "r": "อำเภอยืนยันว่าไม่ได้ออกประกาศนี้ และส่งคนมาดึงประกาศออก"}}}},
  "R025": {"P2": {"title": "มีคนมาขอพักในบ้านคุณ", "s": "ครอบครัวหนึ่งที่บ้านพังมายืนหน้าประตู ขอพักในบ้านคุณสักสองสามคืน", "choices": {"A": {"t": "ให้เข้ามาพัก", "r": "ครอบครัวนั้นได้นอนในที่แห้ง บ้านคุณแคบลงและเสียงดังทั้งคืน"}, "B": {"t": "บอกว่าไม่มีที่ แนะนำให้ไปศาลา", "r": "เขาเดินไปศาลา คุณยังมีพื้นที่ของตัวเอง แต่รู้สึกหนักใจ"}, "C": {"t": "ถามว่าบ้านเขาพังแค่ไหน ซ่อมได้ไหม", "r": "หลังคาพังแค่ครึ่งเดียว อีกห้องยังนอนได้ เขากลับไปนอนบ้านตัวเอง"}, "D": {"t": "พาไปหาที่พักที่ชุมชนจัดไว้", "r": "ชุมชนมีห้องว่างที่อาคารเรียน ครอบครัวนั้นได้ที่พักที่มีคนดูแล"}}}, "P3": {"title": "อาคารเรียนมีรอยร้าว", "s": "ชุมชนอยากใช้อาคารเรียนว่างเป็นที่พัก แต่คุณเห็นรอยร้าวยาวที่ผนังชั้นสอง", "choices": {"A": {"t": "ช่วยย้ายคนที่รออยู่ไปพักชั้นล่างก่อน", "r": "สองครอบครัวได้หลังคากันฝน แต่ยังไม่มีใครรู้ว่าชั้นบนปลอดภัยไหม"}, "B": {"t": "ไม่เข้าไปยุ่ง ให้คนอื่นตัดสินใจ", "r": "คุณไม่ต้องรับผิดชอบ แต่มีคนขึ้นไปนอนชั้นสองคืนนั้น"}, "C": {"t": "ดูว่ารอยร้าวถึงโครงสร้างหรือแค่ผิวปูน", "r": "รอยร้าวอยู่แค่ผิวปูน ไม่ถึงคาน อาคารใช้ได้ทั้งสองชั้น"}, "D": {"t": "ขอให้ช่างก่อสร้างตรวจก่อนให้คนเข้าพัก", "r": "ช่างยืนยันว่าใช้ได้ และติดป้ายห้ามเข้าเฉพาะห้องที่น่าห่วง"}}}},
  "R026": {"P2": {"title": "เพื่อนบ้านล้ำเขตบ้านคุณ", "s": "เพื่อนบ้านตั้งเพิงเก็บของล้ำเข้ามาในเขตบ้านคุณครึ่งเมตร โดยไม่ได้บอกก่อน", "choices": {"A": {"t": "ปล่อยไว้ เพราะเขาไม่มีที่อื่น", "r": "เพิงตั้งอยู่ต่อ เขามาขอบคุณภายหลัง ลานบ้านคุณแคบลง"}, "B": {"t": "บอกให้รื้อออกจากเขตบ้านคุณ", "r": "เขารื้อออกตามที่ขอ แต่เลิกทักทายคุณ"}, "C": {"t": "ดูหลักเขตว่าเส้นแบ่งอยู่ตรงไหนจริง", "r": "หลักเขตอยู่ลึกกว่าที่คุณคิด เพิงล้ำแค่นิดเดียว ไม่ต้องรื้อ"}, "D": {"t": "คุยกันว่าจะใช้ตรงนั้นร่วมกันอย่างไร", "r": "ตกลงให้เพิงอยู่ได้ โดยแบ่งที่ให้คุณวางของด้วย"}}}, "P3": {"title": "ผังที่พักสองฉบับ", "s": "สองครอบครัวเถียงกันเรื่องมุมนอน ทั้งคู่ถือผังที่พักคนละฉบับมายืนยัน", "choices": {"A": {"t": "ยกพื้นที่ของคุณให้ครอบครัวหนึ่ง", "r": "การเถียงจบทันที ที่นอนของคุณแคบลง"}, "B": {"t": "ไม่เข้าไปยุ่ง", "r": "ทั้งสองบ้านเถียงกันต่ออีกชั่วโมง ก่อนจะเงียบไปเอง"}, "C": {"t": "เทียบผังทั้งสองฉบับกับพื้นจริง", "r": "ฉบับหนึ่งเขียนก่อนย้ายเสา ฉบับที่ถูกชี้ว่าทั้งคู่ต้องขยับคนละนิด"}, "D": {"t": "วัดพื้นที่ใหม่ทั้งห้องแล้วทำผังเดียว", "r": "ทุกบ้านได้พื้นที่ตามจำนวนคน มีผังเดียวติดไว้ที่ประตู"}}}},
  "R027": {"P2": {"title": "มีคนลองงัดประตู", "s": "ตื่นมาเจอรอยงัดที่ประตูหน้าบ้าน กลอนยังอยู่ แต่บานพับเริ่มหลวม", "choices": {"A": {"t": "ถามบ้านข้าง ๆ แล้วช่วยกันซ่อม", "r": "บ้านข้าง ๆ โดนงัดเหมือนกัน คุณช่วยเขาซ่อมก่อน แล้วซ่อมของตัวเองตอนค่ำ"}, "B": {"t": "ดันตู้ปิดประตูแล้วนอนห้องหน้า", "r": "ไม่มีใครเข้ามาได้ แต่คุณตื่นทุกครั้งที่มีเสียง"}, "C": {"t": "ดูรอยงัดว่าใช้เครื่องมืออะไร", "r": "รอยเป็นไขควงเล็ก น่าจะเป็นมือสมัครเล่น คุณเปลี่ยนน็อตบานพับให้ยาวขึ้น"}, "D": {"t": "แจ้งเวรยามของชุมชนให้เดินผ่านบ่อยขึ้น", "r": "เวรยามเดินผ่านซอยคุณทุกชั่วโมง ไม่มีรอยงัดใหม่อีก"}}}, "P3": {"title": "ประตูหนีไฟถูกล็อก", "s": "คุณเดินสำรวจที่พักแล้วพบว่าประตูหนีไฟด้านหลังถูกล็อกโซ่ ไม่มีใครรู้ว่ากุญแจอยู่กับใคร", "choices": {"A": {"t": "ช่วยย้ายของที่กองขวางทางหนีไฟออก", "r": "ทางเดินไปประตูโล่งแล้ว แต่ประตูยังล็อกอยู่"}, "B": {"t": "จำไว้ว่าต้องหนีทางหน้า แล้วนอนใกล้ประตู", "r": "คุณมีทางหนีของตัวเอง คนอื่นยังไม่รู้เรื่องนี้"}, "C": {"t": "ไล่ถามว่าใครล็อกและกุญแจอยู่ไหน", "r": "ภารโรงล็อกไว้กันขโมย คุณขอให้แขวนกุญแจไว้ข้างประตู"}, "D": {"t": "เสนอให้ซ้อมหนีไฟทั้งที่พัก", "r": "ทุกคนรู้ทางหนีสองทาง ประตูหลังเปิดได้ตลอดเวลา"}}}},
  "R028": {"P2": {"title": "ห้องหลบภัยใต้บ้าน", "s": "คุณพบว่าใต้บ้านขุดเป็นห้องหลบภัยเล็ก ๆ ได้ แต่ต้องใช้แรงและเวลาหลายวัน", "choices": {"A": {"t": "ขุดให้กว้างพอรับบ้านข้าง ๆ ด้วย", "r": "ห้องใหญ่ขึ้นแต่เสร็จช้ากว่าเดิมสามวัน บ้านข้าง ๆ มาช่วยขุดทุกเย็น"}, "B": {"t": "ขุดให้พอสำหรับตัวเองแล้วเก็บเงียบ", "r": "คุณมีที่หลบภัยของตัวเอง ไม่มีใครรู้ว่ามีอยู่"}, "C": {"t": "ดูก่อนว่าขุดแล้วบ้านจะทรุดไหม", "r": "เสาบ้านลงลึกพอ ขุดได้ถ้าเว้นระยะจากเสาหนึ่งเมตร"}, "D": {"t": "ถามช่างก่อสร้างว่าจะค้ำยันอย่างไร", "r": "ช่างสอนวิธีค้ำยันด้วยไม้ที่มี ห้องแข็งแรงกว่าที่คุณจะทำเอง"}}}, "P3": {"title": "แผนผังหลุมหลบภัยสองฉบับ", "s": "แผนผังหลุมหลบภัยที่เจอมีสองฉบับ ทางเข้าอยู่คนละจุด คนเริ่มมาถามคุณว่าฉบับไหนถูก", "choices": {"A": {"t": "พาคนไปดูทั้งสองจุดด้วยกัน", "r": "เดินทั้งบ่ายจนเจอทางเข้าจริง ทุกคนที่ไปด้วยรู้ทาง แต่คุณหมดแรง"}, "B": {"t": "เก็บข้อมูลไว้ก่อนจนกว่าจะแน่ใจ", "r": "ไม่มีใครเข้าใจผิด แต่ก็ยังไม่มีใครรู้ทางเข้าจริง"}, "C": {"t": "เทียบวันที่และผู้ทำแผนผังทั้งสองฉบับ", "r": "ฉบับใหม่ทำหลังย้ายทางเข้า คุณยืนยันทางเข้าจริงได้โดยไม่ต้องเดินหา"}, "D": {"t": "ส่งให้ชุมชนตรวจแล้วทำป้ายบอกทาง", "r": "ชุมชนติดป้ายบอกทางไปหลุมหลบภัยทุกหัวมุม"}}}},
  "R029": {"P2": {"title": "คนมองว่าบ้านคุณดีเกินไป", "s": "บ้านคุณเสริมจนแข็งแรงที่สุดในซอย มีคนพูดว่าถ้าเกิดเหตุ ทุกคนควรได้เข้ามาหลบในบ้านคุณ", "choices": {"A": {"t": "รับปากว่าเปิดให้หลบถ้ามีเหตุจริง", "r": "คนในซอยเลิกพูดลับหลัง และเริ่มช่วยดูแลบ้านคุณด้วย"}, "B": {"t": "ไม่รับปาก บ้านใครก็ดูแลกันเอง", "r": "ไม่มีใครพูดต่อหน้า แต่คุณรู้สึกได้ว่าคนเริ่มห่างออกไป"}, "C": {"t": "นับว่าบ้านคุณรับคนได้จริงกี่คน", "r": "บ้านคุณรับได้แค่แปดคน คุณบอกตัวเลขนี้ตรง ๆ คนเข้าใจมากขึ้น"}, "D": {"t": "เสนอให้ทุกบ้านช่วยเสริมจุดหลบภัยกลาง", "r": "ชุมชนเริ่มเสริมห้องใต้ศาลา บ้านคุณไม่ต้องเป็นที่หลบของทุกคน"}}}, "P3": {"title": "ที่พักรับคนเกินกำลัง", "s": "ที่พักรวมรับคนเพิ่มทุกวัน คุณคำนวณแล้วว่าอีกไม่นานห้องน้ำและน้ำจะไม่พอ", "choices": {"A": {"t": "ยกที่นอนของคุณให้ครอบครัวที่มาใหม่", "r": "ครอบครัวที่มาใหม่ได้นอน คุณนอนตรงทางเดินและตื่นบ่อย"}, "B": {"t": "กันที่ของคุณไว้ก่อนจะแน่นกว่านี้", "r": "คุณมีที่ส่วนตัว แต่คนที่มาใหม่ต้องนอนชิดกันมากขึ้น"}, "C": {"t": "นับคน ห้องน้ำ และน้ำที่ใช้ต่อวัน", "r": "ตัวเลขบอกว่ารับได้อีกสิบคน คุณเขียนติดไว้หน้าประตู"}, "D": {"t": "เสนอเปิดที่พักแห่งที่สองก่อนจะเต็ม", "r": "ชุมชนเปิดอาคารวัดเป็นที่พักที่สอง ไม่มีที่ไหนแน่นเกิน"}}}},
  "R030": {"P2": {"title": "ชุมชนอยากใช้บ้านคุณ", "s": "ชุมชนจะรวมบ้านเพื่อประหยัดไฟและน้ำ และอยากใช้บ้านคุณเพราะแข็งแรงที่สุด", "choices": {"A": {"t": "ยอมให้ใช้บ้านคุณเป็นที่พักรวม", "r": "บ้านคุณเต็มไปด้วยคน ประหยัดของได้มาก แต่ไม่มีมุมส่วนตัวอีกแล้ว"}, "B": {"t": "ขออยู่บ้านตัวเองตามเดิม", "r": "คุณยังมีพื้นที่ของตัวเอง แต่ต้องจ่ายไฟและน้ำเต็มส่วน"}, "C": {"t": "ดูว่ามีบ้านอื่นที่รับคนได้มากกว่าไหม", "r": "บ้านท้ายซอยกว้างกว่าแต่หลังคาไม่ดี คุณเสนอช่วยซ่อมแทนการให้ใช้บ้านคุณ"}, "D": {"t": "ตั้งกติกาการอยู่ร่วมก่อนตอบรับ", "r": "ตกลงเรื่องเวลา ห้องน้ำ และมุมส่วนตัวไว้ชัด คุณรับคนเข้ามาโดยยังมีห้องของตัวเอง"}}}, "P3": {"title": "เลือกบ้านสำหรับที่พักรวม", "s": "ชุมชนจะรวมบ้านหลายหลังเป็นที่พักเดียว และขอให้คุณช่วยดูว่าหลังไหนเหมาะที่สุด", "choices": {"A": {"t": "ช่วยขนของให้ทุกบ้านที่ย้าย", "r": "ทุกบ้านย้ายเสร็จในวันเดียว คุณปวดหลังไปหลายวัน"}, "B": {"t": "ให้ความเห็นแล้วกลับไปอยู่บ้านตัวเอง", "r": "ชุมชนเลือกตามที่คุณบอก คุณยังมีพื้นที่ของตัวเอง"}, "C": {"t": "ตรวจหลังคา ห้องน้ำ และทางหนีของทุกหลัง", "r": "หลังที่ดูดีที่สุดมีทางหนีทางเดียว คุณเสนอหลังที่สองแทน ทุกคนเห็นด้วย"}, "D": {"t": "ตั้งกติกาการอยู่ร่วมจากสิ่งที่ตรวจพบ", "r": "กติกาเรื่องห้องน้ำ น้ำ และทางหนีถูกเขียนไว้ชัด การอยู่ร่วมเริ่มโดยไม่มีปัญหา"}}}},
  "R034": {"P2": {"title": "กล่องยาของคุณ", "s": "คุณรวบรวมยาสามัญไว้เต็มกล่อง อาสาสมัครรู้เข้าจึงมาขอยืมผ้าพันแผลไปจุดปฐมพยาบาล", "choices": {"A": {"t": "ให้ผ้าพันแผลทั้งม้วน", "r": "จุดปฐมพยาบาลได้ใช้ทันที กล่องยาของคุณไม่มีผ้าพันแผลเหลือ"}, "B": {"t": "ให้ครึ่งหนึ่ง เก็บไว้เองครึ่งหนึ่ง", "r": "อาสาสมัครได้ของบางส่วน คุณยังมีสำรอง"}, "C": {"t": "ถามว่าต้องใช้เท่าไรจริง", "r": "ต้องใช้แค่สามแผ่น คุณให้พอดี ไม่เสียของเกิน"}, "D": {"t": "บอกว่าจะเปิดกล่องยาให้ใช้ยามฉุกเฉินของซอย", "r": "กล่องยาของคุณกลายเป็นที่พึ่งของซอย อาสาสมัครจดไว้ว่ามีอะไรบ้าง"}}}, "P3": {"title": "ผ้าพันแผลหมดเร็วผิดปกติ", "s": "อาสาสมัครมาขอยืมผ้าพันแผลอีกครั้ง คุณสงสัยว่าทำไมจุดปฐมพยาบาลใช้หมดเร็วขนาดนี้", "choices": {"A": {"t": "ให้ทั้งม้วนไปก่อน ค่อยถามทีหลัง", "r": "จุดปฐมพยาบาลได้ใช้ทันที ผ้าพันแผลของคุณหมด"}, "B": {"t": "ให้ครึ่งหนึ่ง เก็บไว้เองครึ่งหนึ่ง", "r": "อาสาสมัครได้ของบางส่วน คุณยังมีสำรอง"}, "C": {"t": "ไปดูวิธีทำแผลที่จุดปฐมพยาบาล", "r": "อาสาสมัครพันแผลหนาเกินจำเป็นสามเท่า คุณสอนวิธีที่ใช้ผ้าน้อยลง"}, "D": {"t": "ช่วยทำบัญชีเบิกผ้าพันแผล", "r": "ของถูกจดทุกครั้งที่เบิก ผ้าพันแผลอยู่ได้นานขึ้นเท่าตัว"}}}},
  "R035": {"P2": {"title": "หมอถามถึงยาที่บ้านคุณ", "s": "มีโต๊ะตรวจโรคมาตั้งที่ศาลา หมอได้ยินว่าคุณเก็บยาไว้มาก จึงถามว่าแบ่งให้คลินิกได้ไหม", "choices": {"A": {"t": "ยกยาที่เกินจำเป็นให้คลินิก", "r": "คลินิกมียาพอจ่ายอีกหลายวัน กล่องยาของคุณเหลือแค่ของจำเป็น"}, "B": {"t": "บอกว่ายาที่บ้านมีไว้ใช้เอง", "r": "หมอพยักหน้าแล้วกลับไปตรวจต่อ คนที่รอคิวได้ยินบทสนทนา"}, "C": {"t": "ถามว่าคลินิกขาดยาอะไรบ้าง", "r": "คลินิกขาดแค่ยาลดไข้เด็กกับเกลือแร่ คุณไม่มีทั้งสองอย่าง จึงไม่ต้องแบ่งอะไร"}, "D": {"t": "ให้คลินิกยืมยาโดยจดไว้คืนเมื่อของมาถึง", "r": "คลินิกยืมยาไปพร้อมใบจด สองสัปดาห์ต่อมาได้ยาคืนครบ"}}}, "P3": {"title": "หมอที่ไม่ติดป้ายชื่อ", "s": "มีโต๊ะตรวจโรคมาตั้งที่ศาลา คนในซอยบอกคุณว่าหมอคนนี้ไม่ติดป้ายชื่อและเก็บเงินค่ายา", "choices": {"A": {"t": "พาคนแก่ที่เดินไม่สะดวกไปตรวจอยู่ดี", "r": "ยายได้ตรวจความดันและรับยา คุณจ่ายค่ายาแทนให้"}, "B": {"t": "ไม่ไปตรวจ รอคลินิกของรัฐ", "r": "คุณไม่เสียเงิน แต่ยังไม่ได้ตรวจ"}, "C": {"t": "ขอดูบัตรและใบอนุญาตของเขา", "r": "เขาเป็นพยาบาลเกษียณ มีบัตรจริง เก็บแค่ค่ายาตามทุน คุณบอกต่อทั้งซอย"}, "D": {"t": "ขอให้อนามัยส่งคนมาตรวจร่วมกัน", "r": "อนามัยส่งเจ้าหน้าที่มาช่วย คลินิกเปิดฟรีและมีคนรับรอง"}}}},
  "R036": {"P2": {"title": "ยาที่บ้านใกล้หมดอายุ", "s": "ยาหลายแผงในกล่องของคุณหมดอายุเดือนนี้ ถ้าเก็บไว้ต่ออาจใช้ไม่ได้", "choices": {"A": {"t": "แจกยาใกล้หมดอายุให้คนที่ต้องใช้ตอนนี้", "r": "หลายคนได้ยาทันใช้ ยาไม่เสียเปล่า กล่องของคุณเบาลง"}, "B": {"t": "เก็บไว้ทั้งหมด เผื่อยังพอใช้ได้", "r": "กล่องยาเต็มเหมือนเดิม แต่คุณไม่แน่ใจว่ายาไหนยังได้ผล"}, "C": {"t": "ถามพยาบาลว่ายาไหนใช้ต่อได้", "r": "ยาเม็ดส่วนใหญ่ยังใช้ได้ ยาน้ำต้องทิ้ง คุณจัดกล่องใหม่"}, "D": {"t": "เอายาใกล้หมดอายุไปแลกที่คลังกลาง", "r": "คลังรับยาไปจ่ายทันที คุณได้ยาล็อตใหม่กลับมาบางส่วน"}}}, "P3": {"title": "ยาแบ่งขายในตลาด", "s": "มีคนแบ่งยาขายเป็นเม็ดในตลาดนัด ใส่ถุงพลาสติกโดยไม่มีชื่อยา", "choices": {"A": {"t": "ซื้อไว้ให้คนที่ไม่มียาเลย", "r": "มีคนกินแล้วอาเจียน โชคดีที่อาการไม่หนัก"}, "B": {"t": "ไม่ซื้อ ใช้แต่ยาที่รู้จัก", "r": "ไม่มีใครเสี่ยง แต่ยาในชุมชนก็ไม่ได้เพิ่ม"}, "C": {"t": "ขอดูแผงยาเดิมที่เขาแกะมาขาย", "r": "แผงบอกชื่อและวันหมดอายุชัด ยาครึ่งหนึ่งใช้ได้ อีกครึ่งหมดอายุ คุณบอกคนซื้อ"}, "D": {"t": "ขอให้เขาเขียนชื่อยาและวันหมดอายุทุกถุง", "r": "ผู้ขายยอมเขียนชื่อยาบนถุง คนซื้อรู้ว่ากำลังกินอะไร"}}}},
  "R037": {"P2": {"title": "เพื่อนบ้านขอยาแก้ไอ", "s": "ผู้สูงอายุบ้านข้าง ๆ ไอหนักมาหลายวัน คนดูแลมาขอยืมยาแก้ไอจากกล่องของคุณ", "choices": {"A": {"t": "เอายาไปให้และช่วยดูอาการ", "r": "คนป่วยได้ยาและน้ำอุ่น คุณใส่หน้ากากอยู่ทั้งบ่าย"}, "B": {"t": "วางยาไว้หน้าประตูแล้วกลับ", "r": "เขาได้ยา คุณไม่ต้องเข้าใกล้คนป่วย"}, "C": {"t": "ถามอาการก่อนว่าต้องใช้ยาอะไร", "r": "อาการเหมือนขาดน้ำมากกว่าเป็นหวัด คุณให้เกลือแร่แทนยาแก้ไอ"}, "D": {"t": "ตามอาสาสมัครสาธารณสุขมาดูแลต่อ", "r": "อาสาสมัครมาตรวจและนัดเยี่ยมทุกวัน คนดูแลไม่ต้องพึ่งยาของคุณ"}}}, "P3": {"title": "ยายกินยาซ้ำ", "s": "ผู้สูงอายุบ้านข้าง ๆ อาการแย่ลง คุณเห็นยาความดันสองยี่ห้อวางอยู่ด้วยกันในบ้าน", "choices": {"A": {"t": "ช่วยดูแลที่บ้านเขาทั้งบ่าย", "r": "อาการทรงตัว คนดูแลได้พักบ้าง แต่ยังไม่รู้สาเหตุ"}, "B": {"t": "บอกคนดูแลให้ระวัง แล้วกลับบ้าน", "r": "คนดูแลรับฟัง แต่ไม่แน่ใจว่าต้องทำอย่างไร"}, "C": {"t": "เทียบชื่อยาทั้งสองแผง", "r": "ยาสองยี่ห้อเป็นยาตัวเดียวกัน ยายกินซ้ำมาหลายวัน คุณแยกแผงหนึ่งออก"}, "D": {"t": "พาพยาบาลมาดูยาในบ้านทั้งหมด", "r": "พยาบาลจัดยาใส่กล่องแยกมื้อให้ อาการดีขึ้นในสองวัน"}}}},
  "R038": {"P2": {"title": "ท้องเสียหลังกินน้ำแข็ง", "s": "คุณท้องเสียหลังกินน้ำแข็งจากร้านปากซอย ยาในกล่องพอสำหรับตัวเอง แต่ได้ยินว่าบ้านอื่นก็เป็น", "choices": {"A": {"t": "แบ่งเกลือแร่ให้บ้านที่มีคนป่วยด้วย", "r": "คนป่วยหลายบ้านดีขึ้นเร็ว เกลือแร่ของคุณเหลือไม่ถึงครึ่ง"}, "B": {"t": "กินยาแล้วพักอยู่บ้านจนหาย", "r": "คุณหายในสองวัน แต่ไม่รู้ว่าบ้านอื่นเป็นอย่างไร"}, "C": {"t": "ถามบ้านอื่นว่ากินอะไรเหมือนกัน", "r": "ทุกคนที่ป่วยใช้น้ำแข็งร้านเดียวกัน คุณบอกให้เลิกใช้ร้านนั้น"}, "D": {"t": "แจ้งพยาบาลให้มาดูทั้งซอย", "r": "พยาบาลให้ต้มน้ำและงดน้ำแข็งทั้งซอย คนป่วยลดลงในสองวัน"}}}, "P3": {"title": "แผนที่บ้านคนป่วย", "s": "หลายบ้านท้องเสียพร้อมกันอีกรอบ คนมาถามคุณว่าครั้งนี้มาจากอะไร", "choices": {"A": {"t": "แบ่งเกลือแร่ให้บ้านที่มีคนป่วย", "r": "คนป่วยดีขึ้นเร็ว เกลือแร่ของคุณหมด"}, "B": {"t": "ต้มน้ำและทำอาหารเองทุกมื้อ", "r": "คุณไม่ป่วย แต่ใช้แก๊สมากขึ้น"}, "C": {"t": "จุดบ้านที่ป่วยลงบนแผนที่ซอย", "r": "บ้านที่ป่วยอยู่ตามแนวท่อน้ำเส้นเดียว คุณบอกให้ต้มน้ำเฉพาะแนวนั้น"}, "D": {"t": "ส่งแผนที่ให้พยาบาลกับการประปา", "r": "การประปาพบท่อรั่วซึมใกล้บ่อขยะ ซ่อมเสร็จ คนป่วยลดลงในสามวัน"}}}},
  "R039": {"P2": {"title": "คุณบาดเจ็บเอง", "s": "คุณถูกตะปูตำเท้าตอนซ่อมบ้าน แผลลึกและเริ่มบวม ยาในกล่องมีแค่ยาทาภายนอก", "choices": {"A": {"t": "ไปจุดปฐมพยาบาลและช่วยงานระหว่างรอ", "r": "แผลได้ล้างและฉีดยากันบาดทะยัก คุณช่วยจดชื่อคนไข้จนถึงคิวตัวเอง"}, "B": {"t": "ทำแผลเองที่บ้าน", "r": "แผลไม่ติดเชื้อ แต่หายช้าและเดินกะเผลกหลายวัน"}, "C": {"t": "ถามพยาบาลว่าต้องฉีดยากันบาดทะยักไหม", "r": "ต้องฉีด และยังมีวัคซีนเหลือ คุณได้ฉีดทันเวลา"}, "D": {"t": "ให้เพื่อนบ้านพาไป และช่วยเฝ้าบ้านให้", "r": "เพื่อนบ้านพาไปจุดปฐมพยาบาลและเฝ้าบ้านให้ คุณได้พักเต็มที่"}}}, "P3": {"title": "ขอผู้ช่วยจดบันทึกคนไข้", "s": "จุดปฐมพยาบาลขอให้คุณช่วยจดบันทึกคนไข้ เพราะรู้ว่าคุณจดละเอียด", "choices": {"A": {"t": "อาสาจดทั้งวัน", "r": "บันทึกครบทุกคน คุณได้เรียนวิธีดูอาการเบื้องต้น แต่หมดแรงตอนเย็น"}, "B": {"t": "ช่วยได้แค่ชั่วโมงเดียว", "r": "บันทึกช่วงเช้าครบ ช่วงบ่ายยังเขียนกันไม่เป็นระเบียบ"}, "C": {"t": "ทำแบบฟอร์มให้กรอกเหมือนกันทุกคน", "r": "บันทึกอ่านง่ายขึ้นมาก หมอเห็นอาการซ้ำของคนซอยเดียวกันได้ทันที"}, "D": {"t": "สอนอาสาสมัครอีกสองคนให้จดแบบเดียวกัน", "r": "มีคนจดบันทึกพอทุกวัน คุณไม่ต้องอยู่ประจำ"}}}},
  "R040": {"P2": {"title": "คลังกลางขอยาจากบ้านคุณ", "s": "คลังเวชภัณฑ์กลางเหลือน้อย ผู้ดูแลมาเคาะประตูขอยาจากกล่องของคุณโดยตรง", "choices": {"A": {"t": "บริจาคยาสามัญเข้าคลัง", "r": "คลังมีของเพิ่มอีกหลายวัน กล่องยาของคุณเหลือน้อยลง"}, "B": {"t": "ปฏิเสธ บอกว่าเตรียมไว้เองตั้งแต่แรก", "r": "ผู้ดูแลเดินกลับมือเปล่า คนในซอยรู้เรื่องนี้ภายในวันเดียว"}, "C": {"t": "ขอดูรายการว่าคลังขาดอะไรจริง", "r": "คลังขาดแค่ยาลดไข้กับผ้าก๊อซ คุณให้เฉพาะสองอย่างนั้น"}, "D": {"t": "ตกลงเป็นคลังสำรองที่สองของซอย", "r": "กล่องยาของคุณถูกจดในบัญชีชุมชน ใช้เมื่อคลังกลางหมด และมีคนช่วยเติม"}}}, "P3": {"title": "ใครควรได้ยาก่อน", "s": "คลังเวชภัณฑ์เหลือน้อย ผู้ดูแลขอให้คุณช่วยตัดสินว่าจะให้ใครก่อน เพราะคุณมีบันทึกอาการของทุกคน", "choices": {"A": {"t": "บริจาคยาจากบ้านคุณเข้าคลังก่อน", "r": "คลังมีของเพิ่มอีกหลายวัน ยาของคุณเหลือน้อยลง"}, "B": {"t": "รับส่วนของคุณแล้วไม่รับหน้าที่ตัดสิน", "r": "คุณได้ยาครบ ผู้ดูแลต้องตัดสินใจคนเดียวต่อ"}, "C": {"t": "ใช้บันทึกอาการจัดลำดับความจำเป็น", "r": "ลำดับชัดเจนจนไม่มีใครเถียง ยาไปถึงคนที่อาการหนักก่อน"}, "D": {"t": "ตั้งเกณฑ์กับพยาบาลแล้วประกาศให้ทุกคนรู้", "r": "ทุกคนรู้เกณฑ์ล่วงหน้า การแย่งยาที่คลังหายไป"}}}},
  "R044": {"P2": {"title": "ญาติขอมาอยู่ด้วย", "s": "ญาติจากอีกอำเภอส่งข้อความขอมาอยู่ด้วย แต่เสบียงในบ้านเพิ่งพอสำหรับคนที่มีอยู่", "choices": {"A": {"t": "รับมาอยู่ด้วย", "r": "ญาติได้ที่ปลอดภัย เสบียงในบ้านต้องแบ่งบางลง"}, "B": {"t": "บอกให้ญาติรอที่เดิมไปก่อน", "r": "ญาติเข้าใจแต่ฟังดูผิดหวัง เสบียงในบ้านยังพอตามแผน"}, "C": {"t": "ถามว่าที่นั่นขาดอะไรจริง", "r": "ที่นั่นขาดแค่น้ำดื่ม ไม่ได้ไม่ปลอดภัย คุณส่งวิธีกรองน้ำไปให้แทน"}, "D": {"t": "หาคนในซอยที่มีห้องว่างให้ญาติพัก", "r": "บ้านท้ายซอยมีห้องว่าง ญาติมาอยู่ใกล้ ๆ โดยไม่ต้องแบ่งเสบียงบ้านคุณ"}}}, "P3": {"title": "ข้อความจากญาติดูแปลก", "s": "มีข้อความจากเบอร์ญาติขอให้โอนเงินด่วนเพื่อจ้างรถออกจากอำเภอ แต่ภาษาที่ใช้ไม่เหมือนเขา", "choices": {"A": {"t": "โอนเงินไปก่อน เผื่อเป็นเรื่องจริง", "r": "เงินออกไปแล้ว สองวันต่อมาญาติโทรมาบอกว่าไม่ได้ส่งข้อความนั้น"}, "B": {"t": "ไม่ตอบ รอให้เขาติดต่อมาเอง", "r": "เงินยังอยู่ แต่คนในบ้านกังวลทั้งคืน"}, "C": {"t": "ถามเรื่องที่มีแต่ญาติตัวจริงรู้", "r": "อีกฝ่ายตอบไม่ได้และเงียบไป คุณรู้ว่าเป็นมิจฉาชีพ"}, "D": {"t": "ให้คนที่รู้จักญาติช่วยยืนยัน", "r": "เพื่อนบ้านของญาติบอกว่าเขาอยู่ดี แค่โทรศัพท์หายไปตั้งแต่สัปดาห์ก่อน"}}}},
  "R045": {"P2": {"title": "บ้านปิดประตูทั้งวัน", "s": "คนในบ้านเริ่มไม่ออกไปไหน ปิดประตูหน้าต่างทั้งวัน ข่าวจากข้างนอกแทบไม่เข้ามา", "choices": {"A": {"t": "ชวนคนในบ้านออกไปนั่งหน้าบ้านตอนเย็น", "r": "เพื่อนบ้านแวะมาคุย ทุกคนได้ยินข่าวใหม่และยิ้มได้บ้าง"}, "B": {"t": "ปิดบ้านต่อไป ปลอดภัยไว้ก่อน", "r": "ไม่มีอะไรมารบกวน แต่ในบ้านเงียบและอึดอัดขึ้นทุกวัน"}, "C": {"t": "ให้คนหนึ่งออกไปฟังข่าวแล้วกลับมาเล่า", "r": "คุณรู้ว่าข้างนอกไม่อันตรายอย่างที่คิด ประตูเปิดได้ตอนกลางวัน"}, "D": {"t": "แบ่งเวรออกไปทำธุระคนละวัน", "r": "ทุกคนได้ออกไปข้างนอกบ้าง และมีข่าวมาเล่ากันทุกเย็น"}}}, "P3": {"title": "บันทึกการติดต่อญาติ", "s": "คุณจดทุกครั้งที่ติดต่อญาติได้หรือไม่ได้ วันนี้เห็นว่าญาติคนหนึ่งเงียบไปนานผิดปกติ", "choices": {"A": {"t": "นั่งคุยกับคนในบ้านที่สนิทกับเขาที่สุด", "r": "เขาเล่าความทรงจำกับญาติคนนั้น ทุกคนตกลงจะตามหาด้วยกัน"}, "B": {"t": "เก็บความกังวลไว้คนเดียวก่อน", "r": "คนในบ้านไม่ต้องกังวลตาม แต่คุณนอนไม่ค่อยหลับ"}, "C": {"t": "ดูว่าครั้งล่าสุดเขาอยู่ที่ไหน", "r": "ครั้งล่าสุดเขาบอกว่าจะไปศูนย์พักพิง คุณรู้แล้วว่าต้องถามต่อที่ไหน"}, "D": {"t": "ฝากชื่อเขาไว้กับวิทยุชุมชนและศูนย์พักพิง", "r": "สามวันต่อมาศูนย์พักพิงตอบว่าเขาอยู่ที่นั่นและปลอดภัย"}}}},
  "R046": {"P2": {"title": "มีคนอยากไปอยู่ที่พักรวม", "s": "คนในบ้านคนหนึ่งบอกว่าอยากย้ายไปอยู่ที่พักรวมของชุมชน เพราะเบื่อการอยู่แต่ในบ้าน", "choices": {"A": {"t": "ให้เขาไป และช่วยขนของ", "r": "เขาย้ายไปอย่างมีความสุข และแวะมาเยี่ยมพร้อมข่าวจากข้างนอก"}, "B": {"t": "ขอให้อยู่ด้วยกันต่อ", "r": "เขาวางกระเป๋าลงแต่ไม่ค่อยพูดกับใคร"}, "C": {"t": "ถามว่าที่พักรวมเป็นอย่างไร", "r": "ที่นั่นแออัดแต่มีคนคุยด้วย คุณเข้าใจว่าเขาต้องการเพื่อน ไม่ใช่ที่พัก"}, "D": {"t": "ให้ไปช่วยงานที่พักรวมตอนกลางวัน แล้วกลับมานอนบ้าน", "r": "เขาได้เจอคนตอนกลางวัน และกลับมาพร้อมเรื่องเล่าทุกเย็น"}}}, "P3": {"title": "มีคนจะไปทำงานต่างจังหวัด", "s": "คนในบ้านคนหนึ่งจะย้ายไปอยู่กับเพื่อนอีกจังหวัด เพราะได้ยินว่าที่นั่นมีงานและอาหาร", "choices": {"A": {"t": "ฟังเหตุผลของเขาก่อน", "r": "เขาอยากหาเงินส่งกลับมาช่วยบ้าน ทุกคนเข้าใจเขามากขึ้น"}, "B": {"t": "ขอให้อยู่ด้วยกันต่อ", "r": "เขาวางกระเป๋าลงแต่ยังไม่พูดกับใคร"}, "C": {"t": "ตรวจข่าวว่าที่นั่นมีงานจริงไหม", "r": "งานที่ได้ยินมาปิดรับไปแล้ว เขาจึงตัดสินใจรอข้อมูลใหม่"}, "D": {"t": "ตกลงกันว่าถ้าไปจะติดต่อกลับเมื่อไร", "r": "เขาไปพร้อมวันนัดติดต่อทุกวันอาทิตย์ ทุกคนสบายใจขึ้น"}}}},
  "R047": {"P2": {"title": "เสบียงลับของบ้าน", "s": "คนในบ้านเสนอให้แบ่งเสบียงไปซ่อนอีกที่ เผื่อมีคนมาขอหรือมาขโมย", "choices": {"A": {"t": "บอกว่าถ้ามีคนขาดจริงก็ควรแบ่ง", "r": "ทุกคนเงียบไปครู่หนึ่ง แล้วตกลงเก็บไว้ที่เดียว แบ่งได้ถ้าจำเป็น"}, "B": {"t": "ตกลงซ่อนเสบียงไว้อีกที่", "r": "เสบียงปลอดภัยขึ้น แต่ทุกคนเริ่มระแวงว่าใครรู้ที่ซ่อนบ้าง"}, "C": {"t": "นับก่อนว่าเสบียงพอกี่วันจริง", "r": "เสบียงพอสามสัปดาห์ ไม่จำเป็นต้องซ่อน ทุกคนสบายใจขึ้น"}, "D": {"t": "ทำรายการเสบียงที่ทุกคนเห็นได้", "r": "ทุกคนรู้ว่ามีอะไรอยู่ที่ไหน ไม่มีใครต้องซ่อนอะไรอีก"}}}, "P3": {"title": "บัญชีเสบียงไม่ตรง", "s": "บัญชีเสบียงที่คุณจดไว้ไม่ตรงกับของจริง ข้าวหายไปสองถ้วยโดยไม่มีใครบอก", "choices": {"A": {"t": "คุยกับทุกคนอย่างใจเย็น", "r": "มีคนหยิบไปให้เพื่อนบ้านที่ขาด เขาขอโทษที่ไม่ได้บอก"}, "B": {"t": "ล็อกตู้เสบียงแล้วถือกุญแจเอง", "r": "ไม่มีอะไรหายอีก แต่คนในบ้านรู้สึกว่าไม่มีใครไว้ใจกัน"}, "C": {"t": "ตรวจบัญชีย้อนหลังทีละวัน", "r": "ข้าวไม่ได้หาย คุณจดซ้ำไปสองวัน บัญชีกลับมาตรงกัน"}, "D": {"t": "ให้ทุกคนจดเองทุกครั้งที่หยิบ", "r": "บัญชีตรงทุกวัน และทุกคนรู้ว่าเสบียงเหลือเท่าไร"}}}},
  "R048": {"P2": {"title": "เด็กอยากออกไปเล่นกับเพื่อน", "s": "เด็กในบ้านไม่ได้ออกไปไหนมาหลายสัปดาห์ วันนี้ขอไปเล่นกับเพื่อนที่ลานวัด", "choices": {"A": {"t": "พาไปเล่นและนั่งเฝ้าอยู่ด้วย", "r": "เด็กวิ่งเล่นจนเหนื่อยและหัวเราะทั้งบ่าย คุณเสียเวลาไปครึ่งวัน"}, "B": {"t": "ไม่ให้ไป ให้เล่นในบ้าน", "r": "เด็กปลอดภัยในบ้าน แต่เงียบและงอนไปทั้งวัน"}, "C": {"t": "ถามว่าที่ลานวัดตอนนี้มีใครดูแล", "r": "มีครูอาสาดูแลเด็กทุกบ่าย คุณให้ไปได้โดยไม่ต้องห่วง"}, "D": {"t": "นัดพ่อแม่บ้านอื่นผลัดกันเฝ้าเด็ก", "r": "มีผู้ใหญ่เฝ้าเด็กทุกวัน เด็กได้เล่นกับเพื่อนเป็นประจำ"}}}, "P3": {"title": "เด็กได้ยินข่าวลือ", "s": "เด็กในบ้านได้ยินจากเพื่อนว่าโรงเรียนจะถูกทิ้งระเบิด และไม่ยอมออกจากบ้าน", "choices": {"A": {"t": "อยู่เป็นเพื่อนเด็กทั้งวัน", "r": "เด็กสงบลงแต่ยังกลัวอยู่ คุณไม่ได้ทำงานทั้งวัน"}, "B": {"t": "บอกว่าไม่ต้องสนใจ แล้วให้อยู่บ้าน", "r": "เด็กอยู่บ้านตามที่บอก แต่ยังกลัวและฝันร้าย"}, "C": {"t": "พาเด็กไปถามครูด้วยกัน", "r": "ครูยืนยันว่าไม่มีเรื่องนี้ เด็กได้ยินกับหูตัวเองและกลับไปเรียนได้"}, "D": {"t": "นัดพ่อแม่ในซอยคุยเรื่องข่าวลือนี้", "r": "พ่อแม่ตกลงอธิบายเรื่องเดียวกัน ข่าวลือในกลุ่มเด็กเงียบลง"}}}},
  "R049": {"P2": {"title": "บ้านเงียบเกินไป", "s": "อยู่แต่ในบ้านมานาน คนในบ้านเริ่มไม่คุยกัน ต่างคนต่างนั่งอยู่มุมของตัวเอง", "choices": {"A": {"t": "นั่งคุยกับคนที่เงียบที่สุด", "r": "เขาเล่าว่าคิดถึงเพื่อน คืนนั้นทุกคนนั่งกินข้าวด้วยกัน"}, "B": {"t": "ปล่อยให้แต่ละคนอยู่กับตัวเอง", "r": "บ้านสงบ แต่ไม่มีใครรู้ว่าอีกคนคิดอะไรอยู่"}, "C": {"t": "ถามทีละคนว่าต้องการอะไร", "r": "ทุกคนตอบตรงกันว่าอยากออกไปข้างนอกบ้าง คุณเริ่มวางแผนให้ได้ออกไป"}, "D": {"t": "ชวนเพื่อนบ้านมากินข้าวเย็นด้วยกัน", "r": "บ้านมีเสียงหัวเราะอีกครั้ง และเพื่อนบ้านชวนไปกินที่บ้านเขาบ้าง"}}}, "P3": {"title": "คนในบ้านกินน้อยลง", "s": "คนในบ้านคนหนึ่งเริ่มนอนทั้งวัน คุณสังเกตว่าเขากินน้อยลงมาตั้งแต่สัปดาห์ก่อน", "choices": {"A": {"t": "นั่งอยู่เป็นเพื่อนโดยไม่เร่งให้ลุก", "r": "เขาเริ่มพูดถึงความกลัว ตอนเย็นออกมากินข้าวด้วยกัน"}, "B": {"t": "แบ่งงานของเขาไปทำแทน", "r": "งานบ้านไม่ค้าง แต่คุณเหนื่อยขึ้นมาก"}, "C": {"t": "ดูว่ามีอะไรเปลี่ยนไปตั้งแต่สัปดาห์ก่อน", "r": "สัปดาห์ก่อนเขาได้ข่าวร้ายของเพื่อนสนิท คุณรู้ว่าเขาต้องการเวลา"}, "D": {"t": "ชวนอาสาสมัครที่คุยเรื่องความเครียดมาเยี่ยม", "r": "อาสาสมัครนัดคุยกับเขาทุกสัปดาห์ เขาเริ่มกลับมาช่วยงานบ้าน"}}}},
  "R050": {"P2": {"title": "อยู่เองหรือเข้าร่วมชุมชน", "s": "ครอบครัวต้องตัดสินใจว่าจะพึ่งตัวเองต่อ หรือเข้าร่วมระบบแบ่งปันของชุมชน", "choices": {"A": {"t": "ให้ทุกคนพูดจนจบแล้วค่อยตัดสิน", "r": "ทุกคนรู้สึกว่าได้รับฟัง ตกลงลองเข้าร่วมหนึ่งเดือนแล้วค่อยคุยใหม่"}, "B": {"t": "ยืนยันว่าบ้านเราดูแลตัวเองได้", "r": "การตัดสินจบเร็ว บ้านพึ่งตัวเองต่อ แต่บางคนยังไม่เห็นด้วย"}, "C": {"t": "เทียบว่าเข้าร่วมแล้วได้อะไรเสียอะไร", "r": "ต้องแบ่งเสบียงหนึ่งในสี่ แต่ได้น้ำและยาประจำ ทุกคนเห็นภาพชัดก่อนตัดสิน"}, "D": {"t": "โหวต แล้วแบ่งหน้าที่ตามผล", "r": "ผลโหวตคือเข้าร่วม แต่ละคนรับหน้าที่ประสานกับชุมชนคนละเรื่อง"}}}, "P3": {"title": "ตัดสินจากข้อมูลที่รวบรวม", "s": "ครอบครัวต้องตัดสินใจว่าจะอยู่ต่อหรือย้าย ทุกคนขอดูข้อมูลที่คุณรวบรวมมาก่อนตัดสิน", "choices": {"A": {"t": "ให้ทุกคนพูดจนจบก่อนดูข้อมูล", "r": "ทุกคนรู้สึกว่าได้รับฟัง ข้อมูลช่วยให้ตกลงอยู่ต่ออีกหนึ่งเดือน"}, "B": {"t": "สรุปเองว่าข้อมูลบอกให้อยู่ต่อ", "r": "การตัดสินจบเร็ว แต่บางคนรู้สึกว่าไม่ได้มีส่วนร่วม"}, "C": {"t": "เปิดข้อมูลทั้งหมดให้ทุกคนดูด้วยกัน", "r": "บ้านญาติมีน้ำแต่ไกลโรงพยาบาล ทุกคนเห็นภาพเดียวกันก่อนตัดสิน"}, "D": {"t": "โหวต และวางแผนสำรองจากข้อมูล", "r": "ผลโหวตคืออยู่ต่อ พร้อมแผนย้ายที่ทุกคนรู้ว่าจะใช้เมื่อไร"}}}},
  "R054": {"P2": {"title": "ข่าวมาถึงคุณช้า", "s": "คุณรู้ข่าวลือว่าจะเรียกผู้ชายอายุ 18–40 ไปรายงานตัวช้ากว่าคนอื่นสองวัน เพราะไม่ได้คุยกับใครในซอย", "choices": {"A": {"t": "ไปถามเพื่อนบ้านว่ารู้อะไรมาบ้าง", "r": "เพื่อนบ้านเล่าทุกอย่างที่รู้ คุณได้รายการเอกสารที่ต้องเตรียม และได้คนคุยด้วย"}, "B": {"t": "ฟังวิทยุของตัวเองจนกว่าจะมีประกาศ", "r": "วิทยุไม่พูดถึงเรื่องนี้เลย คุณยังไม่รู้ว่าข่าวจริงหรือไม่"}, "C": {"t": "ไปถามที่อำเภอเอง", "r": "อำเภอบอกว่ายังไม่มีคำสั่ง คุณรู้ข่าวจริงก่อนหลายบ้านที่ยังตื่นตกใจ"}, "D": {"t": "ขอเข้ากลุ่มข่าวของซอย", "r": "คุณได้ข่าวพร้อมคนอื่นตั้งแต่วันนั้น และรู้ว่าเรื่องนี้ยังไม่ยืนยัน"}}}, "P3": {"title": "ข่าวลือมีเอกสารแนบ", "s": "ข่าวลือเรียกผู้ชายไปรายงานตัวกลับมาอีกครั้ง คราวนี้มีภาพเอกสารแนบมา คนเริ่มเชื่อมากขึ้น", "choices": {"A": {"t": "ช่วยคนที่ตกใจดูว่าถ้าจริงต้องเตรียมอะไร", "r": "หลายบ้านได้รายการเอกสารที่ต้องเตรียมและใจเย็นลง แม้ข่าวยังไม่ยืนยัน"}, "B": {"t": "ไม่ส่งต่อและไม่ยุ่ง", "r": "คุณไม่ได้ทำให้ข่าวแพร่ แต่ข่าวยังไปทั่วซอยอยู่ดี"}, "C": {"t": "ดูตราและเลขหนังสือในภาพ", "r": "ตราเป็นของหน่วยงานที่ยุบไปแล้ว เอกสารเก่าถูกแก้วันที่ คุณบอกต่อพร้อมเหตุผล"}, "D": {"t": "ขอให้อำเภอออกประกาศตอบเรื่องนี้", "r": "อำเภอติดประกาศว่าไม่มีคำสั่งเรียกตัว ข่าวลือหยุดภายในวันเดียว"}}}},
  "R055": {"P2": {"title": "ถ่านวิทยุคู่สุดท้าย", "s": "ถ่านวิทยุของคุณเหลือคู่สุดท้าย และร้านในซอยไม่มีขายแล้ว", "choices": {"A": {"t": "ให้เพื่อนบ้านยืมวิทยุไปฟังผลัดกัน", "r": "ถ่านหมดเร็วขึ้น แต่สามบ้านได้ฟังข่าวเดียวกัน"}, "B": {"t": "เปิดฟังแค่ข่าวเที่ยงวันละครั้ง", "r": "ถ่านอยู่ได้อีกสองสัปดาห์ แต่คุณพลาดประกาศช่วงเย็น"}, "C": {"t": "ดูว่าวิทยุใช้ไฟจากที่อื่นได้ไหม", "r": "วิทยุต่อไฟจากแบตสำรองได้ คุณต่อสายใหม่และเก็บถ่านไว้ยามฉุกเฉิน"}, "D": {"t": "ตกลงกับเพื่อนบ้านผลัดกันหาถ่าน", "r": "สองบ้านผลัดกันหาถ่าน วิทยุเปิดได้ทุกวันโดยไม่ต้องห่วง"}}}, "P3": {"title": "ประกาศจุดพักพิงสองฉบับ", "s": "ที่ศาลามีประกาศจุดพักพิงสองฉบับ ฉบับหนึ่งบอกโรงเรียน อีกฉบับบอกวัด ไม่มีใครรู้ว่าต้องไปไหน", "choices": {"A": {"t": "พาคนที่ต้องการที่พักไปดูทั้งสองที่", "r": "คนที่ไปด้วยได้ที่พักคืนนั้น คุณเดินทั้งบ่ายจนเท้าพอง"}, "B": {"t": "จดไว้ทั้งสองที่ แล้วกลับบ้าน", "r": "คุณรู้ทางเลือกของตัวเอง คนอื่นยังสับสนอยู่"}, "C": {"t": "ดูวันที่และผู้ออกประกาศทั้งสองฉบับ", "r": "ฉบับวัดใหม่กว่าและอำเภอเป็นผู้ออก คุณเขียนกำกับไว้ว่าใช้ฉบับนี้"}, "D": {"t": "ขอให้อำเภอติดประกาศฉบับเดียวที่ถูกต้อง", "r": "อำเภอเก็บฉบับเก่าออก ศาลาเหลือประกาศเดียวที่ทุกคนเชื่อได้"}}}},
  "R056": {"P2": {"title": "วิทยุเงียบกลางดึก", "s": "เสียงวิทยุที่คุณฟังคนเดียวทุกคืนขาดหายกลางประโยค ไม่มีใครให้ถามว่าเกิดอะไรขึ้น", "choices": {"A": {"t": "ออกไปเคาะถามบ้านข้าง ๆ", "r": "บ้านข้าง ๆ ก็ตกใจเหมือนกัน นั่งคุยกันจนดึก ไม่มีใครเก็บของหนี"}, "B": {"t": "ปิดวิทยุ รอฟังใหม่พรุ่งนี้", "r": "ประหยัดถ่านได้ แต่คุณนอนไม่หลับทั้งคืน"}, "C": {"t": "หมุนหาคลื่นอื่นว่าดับหมดหรือไม่", "r": "คลื่นจังหวัดข้างเคียงยังปกติ แปลว่าเสียแค่สถานีเดียว คุณหลับได้"}, "D": {"t": "ชวนบ้านข้าง ๆ ผลัดกันเฝ้าฟัง", "r": "ตีสามสถานีกลับมา บ้านข้าง ๆ มาปลุกคุณให้ฟังด้วย"}}}, "P3": {"title": "สถานีที่รายงานข่าวผิด", "s": "คุณสังเกตว่าสถานีวิทยุที่คนในซอยฟังประจำรายงานข่าวผิดซ้ำหลายครั้งในสัปดาห์นี้", "choices": {"A": {"t": "เล่าให้คนที่ฟังประจำรู้ทีละคน", "r": "หลายบ้านเริ่มฟังอย่างระวัง คุณพูดเรื่องเดียวกันจนเหนื่อย"}, "B": {"t": "เลิกฟังสถานีนั้น หันไปฟังคลื่นอื่น", "r": "คุณได้ข่าวที่แม่นกว่า แต่คนในซอยยังฟังสถานีเดิม"}, "C": {"t": "จดข่าวที่ผิดพร้อมวันเวลาไว้เทียบ", "r": "ข่าวผิดทั้งหมดมาจากรายการเดียวที่อ่านจากโซเชียล ข่าวช่วงอื่นยังเชื่อได้"}, "D": {"t": "ส่งรายการข่าวผิดไปให้สถานี", "r": "สถานีประกาศแก้ข่าว และเลิกอ่านข่าวจากโซเชียล"}}}},
  "R057": {"P2": {"title": "เส้นทางลับขายให้คุณคนเดียว", "s": "ชายคนหนึ่งแอบบอกว่ามีเส้นทางลับออกนอกจังหวัด จะขายให้คุณคนเดียวแลกกับข้าวสารห้ากิโล", "choices": {"A": {"t": "บอกให้เขาไปขายให้บ้านที่ต้องไปจริง", "r": "เขาไปขายบ้านอื่น คุณไม่ได้อะไร แต่บ้านที่ต้องไปได้ข้อมูล"}, "B": {"t": "ซื้อเก็บไว้ เผื่อวันหนึ่งต้องใช้", "r": "คุณได้แผนที่หนึ่งแผ่น ไม่รู้ว่าใช้ได้จริงไหม ข้าวลดลงห้ากิโล"}, "C": {"t": "ขอดูแผนที่ก่อนตัดสินใจ", "r": "เส้นทางผ่านสะพานที่ปิดซ่อม คุณไม่ซื้อ"}, "D": {"t": "บอกชุมชนให้ตรวจเส้นทางนี้ร่วมกัน", "r": "คนที่ไปลองกลับมาบอกว่าผ่านได้สองในสามช่วง ชุมชนได้ข้อมูลโดยไม่ต้องจ่าย"}}}, "P3": {"title": "แผนที่ที่ขายเป็นของคุณ", "s": "ชายคนหนึ่งขายแผนที่ทางออกนอกจังหวัด คุณจำได้ว่าเป็นแผนที่ที่คุณวาดแจกฟรีเมื่อเดือนก่อน แต่ข้อมูลเก่าแล้ว", "choices": {"A": {"t": "บอกคนที่ซื้อไปว่าข้อมูลเก่า และแก้ให้ฟรี", "r": "คนที่ซื้อไปได้เส้นทางที่ถูก คุณใช้เวลาทั้งบ่ายแก้แผนที่ทีละแผ่น"}, "B": {"t": "ไม่ยุ่ง แผนที่หลุดไปแล้ว", "r": "คุณไม่เสียเวลา แต่มีคนเดินทางด้วยข้อมูลเก่า"}, "C": {"t": "ตรวจว่าจุดไหนเปลี่ยนไปแล้ว", "r": "สะพานหนึ่งแห่งปิดซ่อม และด่านย้ายที่ คุณเขียนฉบับแก้ไขพร้อมวันที่"}, "D": {"t": "ติดแผนที่ฉบับล่าสุดที่ศาลาให้ดูฟรี", "r": "ไม่มีใครซื้อแผนที่จากเขาอีก ทุกคนใช้ฉบับที่มีวันที่กำกับ"}}}},
  "R058": {"P2": {"title": "รถอพยพที่คุณไม่รู้ข่าว", "s": "เช้านี้ซอยเงียบผิดปกติ หลายบ้านไปขึ้นรถอพยพที่หน้าอำเภอตั้งแต่ตีห้า คุณเพิ่งรู้ข่าว", "choices": {"A": {"t": "ช่วยคนแก่ที่ตกรถเตรียมตัวรอบหน้า", "r": "ยายท้ายซอยได้ลงชื่อรอบหน้า คุณได้รู้ว่ารถจะมาอีกวันศุกร์"}, "B": {"t": "อยู่บ้านต่อ ไม่ไปไหน", "r": "บ้านคุณยังอยู่ แต่ซอยเหลือคนไม่กี่หลัง"}, "C": {"t": "ไปถามที่อำเภอว่ารถไปไหน มีรอบอีกไหม", "r": "รถไปศูนย์พักพิงจังหวัดข้างเคียง มีรอบสุดท้ายวันศุกร์ คุณรู้ทางเลือกของตัวเอง"}, "D": {"t": "รวบรวมบ้านที่เหลือในซอยมาคุยกัน", "r": "บ้านที่เหลือห้าหลังตกลงดูแลกัน และแบ่งกันเฝ้าบ้านที่ว่าง"}}}, "P3": {"title": "ข่าวรถอพยพสองข่าว", "s": "มีข่าวรถอพยพสองข่าว ข่าวหนึ่งว่ามาวันมะรืน อีกข่าวว่ายกเลิกแล้ว คนมาถามคุณว่าเชื่อข่าวไหน", "choices": {"A": {"t": "ช่วยทำรายชื่อคนแก่และคนป่วยไว้ก่อน", "r": "รถมาจริงสองคัน คนที่เปราะบางที่สุดได้ขึ้นรอบแรก"}, "B": {"t": "บอกว่าคุณเองก็ไม่แน่ใจ", "r": "คนแยกกันเชื่อคนละข่าว บางบ้านไปรอเก้อ บางบ้านพลาดรถ"}, "C": {"t": "โทรถามศูนย์พักพิงปลายทางโดยตรง", "r": "ศูนย์ยืนยันว่ารถมาวันมะรืนแต่มีแค่สองคัน คุณบอกตัวเลขนี้ให้ทุกคน"}, "D": {"t": "ทำกระดานข่าวรถที่บอกที่มาของทุกข่าว", "r": "คนอ่านกระดานแล้วตัดสินใจเองได้ ไม่มีใครไปรอเก้อ"}}}},
  "R059": {"P2": {"title": "สถานีชุมชนขอยืมวิทยุ", "s": "มีคนตั้งวิทยุชุมชนหลังศาลา เขามาขอยืมวิทยุและเสาอากาศของคุณ เพราะรู้ว่าคุณมีของดี", "choices": {"A": {"t": "ให้ยืมทั้งชุด", "r": "สถานีส่งได้ไกลขึ้นทั้งตำบล คุณไม่มีวิทยุฟังเองจนกว่าจะได้คืน"}, "B": {"t": "ไม่ให้ยืม บอกว่ายังต้องใช้เอง", "r": "คุณยังมีวิทยุฟังทุกคืน สถานีชุมชนส่งได้ไม่ไกลเท่าที่ควร"}, "C": {"t": "ถามว่าต้องใช้ชิ้นไหนจริง", "r": "เขาต้องการแค่เสาอากาศ คุณให้ยืมเสา และยังฟังวิทยุเองได้ด้วยเสาสำรอง"}, "D": {"t": "ให้ยืม แลกกับให้สถานีแจ้งข่าวสำคัญคุณก่อน", "r": "สถานีได้ของดี คุณได้ข่าวสำคัญเป็นคนแรกทุกเช้า"}}}, "P3": {"title": "คนตรวจข่าวของสถานี", "s": "มีคนตั้งวิทยุชุมชนหลังศาลา เขาขอให้คุณตรวจข่าวก่อนออกอากาศ เพราะรู้ว่าคุณตรวจที่มาเสมอ", "choices": {"A": {"t": "รับตรวจทุกข่าวทุกวัน", "r": "สถานีส่งข่าวที่ตรวจแล้วทุกคืน คุณแทบไม่มีเวลาทำอย่างอื่น"}, "B": {"t": "ตรวจให้เฉพาะข่าวใหญ่", "r": "ข่าวสำคัญแม่นยำ ข่าวเล็กยังผิดบ้าง"}, "C": {"t": "ตั้งกติกาว่าข่าวต้องบอกที่มาและความแน่ใจ", "r": "ทุกข่าวบอกที่มา คนฟังเชื่อสถานีนี้มากขึ้น"}, "D": {"t": "สอนอีกสามคนให้ตรวจข่าวเป็น", "r": "สถานีมีคนตรวจข่าวพอทุกวัน คุณไม่ต้องอยู่ประจำ"}}}},
  "R060": {"P2": {"title": "แผนที่ของคุณเก่าแล้ว", "s": "คุณต้องไปอำเภอข้างเคียง แต่แผนที่ของคุณเก่ากว่าเดือน ขณะที่ชุมชนมีแผนที่กลางที่ทุกคนช่วยกันแก้", "choices": {"A": {"t": "ไปขอดูแผนที่กลาง และเล่าทางที่คุณรู้ให้ด้วย", "r": "คุณได้เส้นทางล่าสุด และแผนที่กลางได้ข้อมูลจากคุณเพิ่ม"}, "B": {"t": "ใช้แผนที่ของคุณ ไปตามทางเดิม", "r": "ไปถึงได้ แต่ต้องวนกลับสองครั้งเพราะถนนปิด เสียเวลาครึ่งวัน"}, "C": {"t": "ถามคนที่เพิ่งกลับมาจากที่นั่น", "r": "เขาบอกจุดที่ปิดสองจุด คุณแก้แผนที่ของตัวเองแล้วไปได้ตรงทาง"}, "D": {"t": "อาสาเป็นคนอัปเดตแผนที่ให้ซอยคุณ", "r": "คุณได้ชื่อในกลุ่มแผนที่ ได้ข้อมูลทุกสัปดาห์ และคนในซอยมาถามคุณ"}}}, "P3": {"title": "แผนที่ที่ทั้งตำบลใช้", "s": "แผนที่ที่คุณตรวจแก้มาตลอดกลายเป็นฉบับที่ทั้งตำบลใช้ วันนี้มีคนเดินทางมาบอกว่าบางจุดผิด", "choices": {"A": {"t": "พาเขาไปชี้จุดที่ผิดด้วยกัน", "r": "คุณเห็นจุดที่เปลี่ยนจริงและแก้ทันที แต่ใช้เวลาทั้งวัน"}, "B": {"t": "จดไว้แล้วแก้รอบหน้า", "r": "แผนที่ยังผิดอีกสัปดาห์ บางคนต้องวนกลับ"}, "C": {"t": "ถามคนเดินทางอีกสองกลุ่มเพื่อยืนยัน", "r": "สองกลุ่มยืนยันตรงกัน คุณแก้แผนที่โดยมั่นใจว่าถูก"}, "D": {"t": "ให้ทุกคนแจ้งจุดผิดพร้อมวันที่", "r": "แผนที่ถูกแก้ทุกวันจากหลายคน แม่นกว่าที่คุณจะทำคนเดียว"}}}},
