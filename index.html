  "R064": {"P2": {"title": "คนรู้ว่าบ้านคุณมีไฟ", "s": "บ้านคุณเป็นหลังเดียวในซอยที่มีไฟจากโซลาร์ เย็นนี้มีคนถือโทรศัพท์มายืนรอหน้าบ้านสามคน", "choices": {"A": {"t": "ให้ทุกคนชาร์จจนเต็ม", "r": "ทั้งสามคนได้ติดต่อครอบครัว แบตสำรองของคุณเหลือไม่ถึงครึ่ง"}, "B": {"t": "บอกว่าไฟต้องเก็บไว้ใช้เอง", "r": "ทั้งสามคนเดินกลับ ไฟของคุณพอใช้ทั้งคืน แต่คุณรู้สึกถึงสายตาตอนปิดประตู"}, "C": {"t": "ดูก่อนว่าไฟที่เหลือแบ่งได้เท่าไร", "r": "แบ่งได้คนละสิบห้านาที ทุกคนได้ชาร์จพอโทรออก บ้านคุณไม่ขาด"}, "D": {"t": "ตั้งเวลาชาร์จหน้าบ้านวันละรอบ", "r": "คนมาชาร์จตามเวลา บางคนเอาน้ำแข็งหรือผักมาแลก"}}}, "P3": {"title": "ปลั๊กพ่วงร้อนจัด", "s": "คุณสังเกตว่าปลั๊กพ่วงที่จุดชาร์จหน้าบ้านร้อนจนจับไม่ได้ เพราะมีคนเสียบพร้อมกันหลายเครื่อง", "choices": {"A": {"t": "ถอดเครื่องตัวเองออกให้คนอื่นชาร์จต่อ", "r": "ปลั๊กเย็นลงเล็กน้อย คุณไม่ได้ชาร์จจนกว่าจะค่ำ"}, "B": {"t": "ปิดจุดชาร์จไปก่อน", "r": "ไม่มีอะไรไหม้ แต่หลายคนกลับไปโดยแบตยังไม่เต็ม"}, "C": {"t": "ดูว่าปลั๊กรับได้กี่เครื่อง", "r": "ปลั๊กรับได้สี่เครื่อง แต่เสียบอยู่เก้า คุณจำกัดจำนวนแล้วปลั๊กเย็นลง"}, "D": {"t": "ทำป้ายจำกัดจำนวนพร้อมตารางเวลา", "r": "คนชาร์จตามรอบ รอบละสี่เครื่อง ไม่มีปลั๊กร้อนอีก"}}}},
  "R065": {"P2": {"title": "แผงโซลาร์ของคุณสกปรก", "s": "แผงโซลาร์บนหลังคาคุณถูกฝุ่นและใบไม้ปิด ไฟที่ได้ลดลงเกือบครึ่ง", "choices": {"A": {"t": "ล้างแผงให้บ้านข้าง ๆ ด้วยขณะขึ้นไป", "r": "บ้านข้าง ๆ ได้ไฟเพิ่มขึ้น คุณอยู่บนหลังคาจนแดดจัดและหมดแรง"}, "B": {"t": "ล้างเฉพาะแผงของคุณ", "r": "ไฟกลับมาเต็มที่ คุณใช้น้ำไปสองถังกับการล้าง"}, "C": {"t": "ดูว่าแผงไหนได้ไฟน้อยที่สุด", "r": "มีแค่แผงเดียวที่โดนเงาต้นไม้ คุณตัดกิ่งเดียว ไฟกลับมาโดยไม่ต้องล้างทั้งหมด"}, "D": {"t": "ชวนบ้านที่มีแผงตั้งวันล้างแผงพร้อมกัน", "r": "สามบ้านผลัดกันปีนและส่งน้ำ ล้างเสร็จในชั่วโมงเดียว"}}}, "P3": {"title": "แผงโซลาร์ที่ขายในตลาด", "s": "มีคนขายแผงโซลาร์มือสองในตลาด บอกว่าจ่ายไฟได้เต็ม แต่ไม่มีใครทดสอบ", "choices": {"A": {"t": "ช่วยคนที่ต้องใช้ไฟต่อรองราคา", "r": "คนซื้อได้ราคาถูกลง แต่ยังไม่รู้ว่าแผงใช้ได้จริงแค่ไหน"}, "B": {"t": "ไม่ซื้อ ใช้ของที่มีอยู่", "r": "คุณไม่เสี่ยง แต่บ้านคุณยังได้ไฟเท่าเดิม"}, "C": {"t": "ขอต่อมิเตอร์วัดก่อนซื้อ", "r": "แผงจ่ายไฟได้ไม่ถึงครึ่งของที่บอก คุณบอกคนซื้อตามจริง"}, "D": {"t": "เสนอให้มีจุดทดสอบแผงก่อนขายในตลาด", "r": "ทุกแผงต้องวัดไฟก่อนขาย ราคาจึงตรงกับของจริง"}}}},
  "R066": {"P2": {"title": "แบตเตอรี่ของคุณเสื่อม", "s": "แบตเตอรี่ที่เก็บไฟไว้ใช้กลางคืนเริ่มเก็บไฟได้ไม่นาน ไฟดับตั้งแต่สามทุ่ม", "choices": {"A": {"t": "ยกแบตลูกที่ยังดีให้ศาลาใช้กับวิทยุ", "r": "ศาลามีไฟเปิดวิทยุตอนค่ำ บ้านคุณต้องเข้านอนเร็วขึ้น"}, "B": {"t": "ปิดทุกอย่างยกเว้นไฟดวงเดียว", "r": "ไฟอยู่ได้ถึงเที่ยงคืน แต่บ้านมืดและเงียบตั้งแต่หัวค่ำ"}, "C": {"t": "วัดว่าแบตลูกไหนเสื่อม", "r": "เสื่อมแค่ลูกเดียวจากสาม คุณถอดออก ที่เหลือเก็บไฟได้ตามปกติ"}, "D": {"t": "แลกแบตเก่ากับช่างไฟที่ซ่อมได้", "r": "ช่างฟื้นแบตได้หนึ่งลูกแลกกับข้าวสาร คุณมีไฟถึงตีสอง"}}}, "P3": {"title": "เครื่องปั่นไฟดับซ้ำทุกบ่าย", "s": "เครื่องปั่นไฟชุมชนดับตอนบ่ายสามวันติด ผู้ดูแลคิดว่าเครื่องเสีย จะขนไปซ่อมในเมือง", "choices": {"A": {"t": "ช่วยเข็นเครื่องไปให้ช่าง", "r": "ช่างไม่เจออะไรเสีย คุณเหนื่อยเปล่าและชุมชนไม่มีไฟสองวัน"}, "B": {"t": "กลับบ้านไปรอ", "r": "คุณไม่เสียแรง แต่ชุมชนอาจขนเครื่องไปซ่อมโดยไม่จำเป็น"}, "C": {"t": "จดเวลาและอุณหภูมิทุกครั้งที่ดับ", "r": "ดับเฉพาะตอนแดดส่องโดนเครื่อง เครื่องไม่ได้เสีย แค่ร้อนเกิน"}, "D": {"t": "ย้ายเครื่องเข้าร่มกับผู้ดูแล", "r": "เครื่องย้ายเข้าใต้หลังคา ไม่ดับอีก ไม่ต้องขนไปซ่อม"}}}},
  "R067": {"P2": {"title": "น้ำมันของคุณเหลือน้อย", "s": "น้ำมันสำหรับเครื่องปั่นไฟส่วนตัวของคุณเหลือสองแกลลอน และปั๊มในตำบลปิดแล้ว", "choices": {"A": {"t": "ให้บ้านที่มีคนป่วยยืมเครื่องคืนหนึ่ง", "r": "บ้านนั้นได้ไฟเปิดเครื่องพ่นยา น้ำมันของคุณเหลือแกลลอนเดียว"}, "B": {"t": "เปิดเครื่องเฉพาะตอนจำเป็นจริง", "r": "น้ำมันอยู่ได้อีกสองสัปดาห์ บ้านคุณมืดเกือบทุกคืน"}, "C": {"t": "คำนวณว่าใช้อะไรได้กี่ชั่วโมง", "r": "ตู้เย็นกินน้ำมันมากที่สุด คุณปิดตู้เย็น น้ำมันอยู่ได้นานขึ้นเท่าตัว"}, "D": {"t": "ลงขันซื้อน้ำมันกับบ้านที่ใช้เครื่องแบบเดียวกัน", "r": "ได้น้ำมันมาหนึ่งถังจากอำเภอข้างเคียง แบ่งกันตามที่ลงเงิน"}}}, "P3": {"title": "น้ำมันหายจากถัง", "s": "ระดับน้ำมันในถังเครื่องปั่นไฟลดลงเร็วกว่าที่ใช้จริง ผู้ดูแลเริ่มสงสัยว่ามีคนแอบเอาไป", "choices": {"A": {"t": "ยกคิวของคุณให้บ้านที่มีคนป่วยระหว่างรอ", "r": "บ้านนั้นได้ไฟพอเปิดเครื่องมือแพทย์ คุณอยู่ในความมืดคืนนี้"}, "B": {"t": "ใช้คิวของคุณตามปกติ ไม่ยุ่ง", "r": "คุณได้ไฟครบเวลา น้ำมันยังหายต่อ"}, "C": {"t": "วัดระดับน้ำมันก่อนและหลังเปิดเครื่องทุกรอบ", "r": "น้ำมันไม่ได้ถูกขโมย ท่อน้ำมันรั่วซึมใต้เครื่อง คุณชี้จุดรั่วให้ช่าง"}, "D": {"t": "เสนอให้ล็อกถังและจดการเติมทุกครั้ง", "r": "ถังมีกุญแจและสมุดจด ทุกคนเห็นว่าน้ำมันไปไหน"}}}},
  "R068": {"P2": {"title": "สายพ่วงจากบ้านคุณ", "s": "สายไฟที่คุณพ่วงไปเก็บของหลังบ้านห้อยต่ำหลังฝนตก มีประกายไฟแลบใกล้ทางเดินของซอย", "choices": {"A": {"t": "กั้นทางเดินและยืนบอกทางให้คนอ้อม", "r": "ไม่มีใครเดินใกล้สาย คุณยืนอยู่จนเย็นกว่าจะซ่อมได้"}, "B": {"t": "ถอดปลั๊กแล้วเก็บสายเข้าบ้านเงียบ ๆ", "r": "ไฟแลบหยุด แต่หลังบ้านไม่มีไฟใช้ไปหลายวัน"}, "C": {"t": "ไล่ดูว่าสายชำรุดตรงไหน", "r": "ฉนวนแตกช่วงเดียว คุณพันเทปและยกสายขึ้นสูง ใช้ต่อได้"}, "D": {"t": "ขอช่างไฟในซอยมาเดินสายใหม่ให้ถูก", "r": "ช่างเดินสายใหม่ใต้ชายคา ทางเดินปลอดภัย คุณจ่ายค่าแรงเป็นข้าวสาร"}}}, "P3": {"title": "สายไฟถูกต่อพ่วงเถื่อน", "s": "คุณเดินตามสายไฟที่ห้อยต่ำ พบว่ามีคนต่อพ่วงจากเสาไฟหลักเข้าบ้านตัวเองแบบไม่ปลอดภัย", "choices": {"A": {"t": "กั้นทางและพาคนเดินอ้อมก่อน", "r": "ไม่มีใครเดินใกล้สาย คุณยืนบอกทางอยู่จนเย็น"}, "B": {"t": "เลี่ยงทางนั้นเอง ไม่ยุ่ง", "r": "คุณปลอดภัย แต่สายยังห้อยอยู่ใกล้ทางเดิน"}, "C": {"t": "ไปบอกเจ้าของบ้านว่าสายเสี่ยงตรงไหน", "r": "เขาไม่รู้ว่าอันตราย พอเห็นจุดที่ฉนวนแตก เขายอมถอดสายเอง"}, "D": {"t": "ตามช่างไฟและผู้นำชุมชนมาพร้อมกัน", "r": "ช่างเดินสายให้ใหม่อย่างถูกวิธี บ้านนั้นยังมีไฟ และทางเดินปลอดภัย"}}}},
  "R069": {"P2": {"title": "คนขอใช้ไฟคุณเปิดเครื่องมือแพทย์", "s": "บ้านท้ายซอยมีคนใช้เครื่องพ่นยา เขามาขอพ่วงไฟจากบ้านคุณทุกคืนจนกว่าไฟจะกลับมา", "choices": {"A": {"t": "ให้พ่วงไฟทุกคืน", "r": "คนป่วยหายใจสะดวกขึ้น แบตของคุณหมดก่อนเช้าทุกคืน"}, "B": {"t": "ให้แค่คืนนี้ ไม่รับปากต่อ", "r": "เขาได้ใช้คืนนี้ คืนต่อไปต้องหาที่อื่นเอง"}, "C": {"t": "ดูว่าเครื่องพ่นยากินไฟเท่าไร", "r": "เครื่องกินไฟน้อยกว่าที่คิด คุณให้พ่วงได้ทุกคืนโดยไม่ต้องปิดของตัวเอง"}, "D": {"t": "พาไปลงชื่อขอไฟจากจุดกลางของชุมชน", "r": "จุดกลางจัดคิวให้อุปกรณ์การแพทย์ก่อน เขาไม่ต้องพึ่งบ้านใดบ้านหนึ่ง"}}}, "P3": {"title": "ไฟสำรองโรงเรียนใกล้หมด", "s": "คุณจดเวลาไฟของโรงเรียนมาหลายวัน เห็นว่าแบตสำรองเก็บไฟได้น้อยลงทุกคืน", "choices": {"A": {"t": "ช่วยครูย้ายเด็กที่อ่านหนังสือไปนั่งห้องเดียว", "r": "ใช้ไฟห้องเดียวแทนสามห้อง แบตอยู่ได้นานขึ้น เด็กยังได้อ่านหนังสือ"}, "B": {"t": "ไม่ยุ่ง ปล่อยให้โรงเรียนจัดการเอง", "r": "ไฟโรงเรียนดับเร็วขึ้นทุกคืน จนเด็กต้องกลับไปอ่านในบ้านมืด"}, "C": {"t": "วัดว่าแบตลูกไหนเสื่อม", "r": "มีแบตเสื่อมสองลูกที่ดึงไฟลูกอื่น ภารโรงถอดออก ไฟอยู่ได้ตามเดิม"}, "D": {"t": "เสนอเอาแผงโซลาร์ชุมชนมาช่วยชาร์จแบตโรงเรียน", "r": "โรงเรียนได้ไฟชาร์จตอนกลางวัน และมีไฟพอทุกคืน"}}}},
  "R070": {"P2": {"title": "ชุมชนขอให้คุณเข้าคิวไฟ", "s": "ชุมชนจะรวมไฟทุกบ้านเข้าระบบคิวกลาง และขอให้บ้านคุณต่อโซลาร์เข้าระบบด้วย", "choices": {"A": {"t": "ต่อเข้าระบบทั้งหมด", "r": "ไฟของคุณกลายเป็นของส่วนรวม คิวสั้นลงมาก บ้านคุณได้ใช้ตามคิวเหมือนคนอื่น"}, "B": {"t": "ขอใช้ไฟของคุณเองต่อไป", "r": "บ้านคุณยังมีไฟเต็มที่ แต่ไม่มีชื่อในคิวกลางถ้าแผงเสีย"}, "C": {"t": "ถามว่าระบบจะคืนไฟให้คุณเท่าไร", "r": "ระบบให้ไฟคืนตามที่ต่อเข้า คุณได้น้อยลงนิดหน่อยแต่มีสำรองเมื่อแผงเสีย"}, "D": {"t": "ตกลงต่อครึ่งหนึ่ง เก็บไว้ใช้เองครึ่งหนึ่ง", "r": "คิวกลางได้ไฟเพิ่ม คุณยังมีไฟของตัวเองตอนกลางคืน"}}}, "P3": {"title": "คิวไฟที่ไม่มีใครเชื่อ", "s": "คิวใช้ไฟยาวขึ้นทุกวัน คนเริ่มกล่าวหากันว่าแซงคิว ผู้ดูแลขอให้คุณช่วยดูเพราะคุณจดทุกอย่าง", "choices": {"A": {"t": "ยกคิวให้คนที่จำเป็นที่สุดก่อน", "r": "เขาได้ชาร์จเครื่องวัดน้ำตาล คุณต้องรอวันพรุ่งนี้"}, "B": {"t": "ใช้ตามคิวของคุณ แล้วไม่รับหน้าที่", "r": "คุณได้ใช้ตามสิทธิ์ ผู้ดูแลต้องรับมือเสียงบ่นคนเดียว"}, "C": {"t": "เปิดบันทึกให้ดูว่าใครใช้เกินเวลา", "r": "มีสองบ้านใช้เกินทุกวัน พอทุกคนเห็นตัวเลข คิวก็สั้นลงเอง"}, "D": {"t": "ทำตารางคิวที่ทุกคนตรวจได้", "r": "อุปกรณ์การแพทย์ได้ก่อน ที่เหลือหมุนเวียน ทุกคนดูตารางเดียวกัน"}}}},
  "R074": {"P2": {"title": "คนเดินทางขอติดรถ", "s": "คุณออกเดินทางคนเดียวตามที่ตั้งใจ ระหว่างทางมีคนถือกระเป๋าโบกขอติดรถ", "choices": {"A": {"t": "ให้ติดรถไปด้วย", "r": "เขาลงที่ตลาดและเล่าว่าอำเภอข้างเคียงมีน้ำแจก"}, "B": {"t": "ไม่จอด ขับต่อ", "r": "คุณถึงที่หมายเร็ว ไม่ต้องห่วงเรื่องคนแปลกหน้า"}, "C": {"t": "จอดถามก่อนว่าจะไปไหน", "r": "เขาไปหาแม่ที่โรงพยาบาล คุณสบายใจขึ้นและให้ติดรถไป"}, "D": {"t": "บอกจุดนัดรถรวมของอำเภอให้", "r": "เขาเดินไปจุดนัดรถรวม คุณไม่ต้องรับใคร แต่เขาก็ไม่ติดค้าง"}}}, "P3": {"title": "คนขอติดรถพูดไม่ตรงกัน", "s": "คนถือกระเป๋าขอติดรถ บอกว่าจะไปโรงพยาบาล แต่กระเป๋าเขียนชื่อคนละคนกับที่เขาบอก", "choices": {"A": {"t": "ให้ติดรถไปอยู่ดี", "r": "เขาลงที่ตลาดแล้วรีบเดินหายไป ไม่มีอะไรเสียหาย แต่คุณยังสงสัย"}, "B": {"t": "ปฏิเสธอย่างสุภาพ", "r": "คุณขับต่อคนเดียวอย่างสบายใจ เขาโบกรถคันถัดไป"}, "C": {"t": "ถามเรื่องชื่อบนกระเป๋าตรง ๆ", "r": "เป็นกระเป๋าของพี่ชายที่เขาจะเอาไปให้ คุณสบายใจขึ้นและให้ติดรถไป"}, "D": {"t": "ชี้ให้ไปจุดนัดรถรวมที่มีคนดูแล", "r": "ที่จุดนัดมีคนจดชื่อผู้โดยสาร เขาได้รถไปอย่างเป็นระบบ"}}}},
  "R075": {"P2": {"title": "ทางลัดที่คุณรู้คนเดียว", "s": "คุณเจอทางลัดผ่านทุ่งที่เลี่ยงรถติดได้ ยังไม่มีใครในซอยรู้", "choices": {"A": {"t": "บอกเพื่อนบ้านที่ต้องเดินทางบ่อย", "r": "สามบ้านใช้ทางนี้ด้วย ทางเริ่มเป็นร่องลึกเร็วขึ้น"}, "B": {"t": "เก็บไว้ใช้เอง", "r": "คุณเดินทางได้เร็วกว่าคนอื่นครึ่งชั่วโมงทุกครั้ง"}, "C": {"t": "ขับลองช่วงที่ไม่แน่ใจก่อน", "r": "มีช่วงหนึ่งน้ำขังหลังฝน คุณรู้ว่าวันไหนห้ามใช้ทางนี้"}, "D": {"t": "แลกทางลัดกับข้อมูลทางอื่นของเพื่อนบ้าน", "r": "คุณได้รู้ทางเลี่ยงด่านอีกสองทาง โดยบอกทางของคุณแลกไป"}}}, "P3": {"title": "ทางลัดที่ไม่มีในแผนที่", "s": "คนแปลกหน้าชี้ทางลัดผ่านทุ่งให้ บอกว่าเลี่ยงด่านได้ แต่ทางนี้ไม่มีในแผนที่ฉบับไหนเลย", "choices": {"A": {"t": "พาคนที่ติดอยู่บนทางหลักไปทางนี้ด้วย", "r": "สามคันออกจากทางหลักได้ แต่ทางลูกรังทำให้รถคุณเป็นรอย"}, "B": {"t": "ไม่เสี่ยง ใช้ทางหลักต่อ", "r": "ช้ากว่าแต่รู้ว่าปลายทางคือที่ไหน"}, "C": {"t": "เดินไปดูทางก่อนสักช่วง", "r": "ทางไปจบที่สะพานไม้ผุ รถผ่านไม่ได้ คุณกลับมาเตือนคนที่จะตามไป"}, "D": {"t": "จดทางไว้พร้อมหมายเหตุให้ชุมชนตรวจ", "r": "ชุมชนส่งคนไปดู ทางนี้ใช้ได้เฉพาะมอเตอร์ไซค์ แผนที่ศาลาบอกไว้ชัด"}}}},
  "R076": {"P2": {"title": "ด่านขอดูเอกสารที่คุณไม่มี", "s": "ด่านตรวจใหม่ขอดูใบผ่านทางของชุมชน คุณไม่มีเพราะไม่เคยไปลงทะเบียน", "choices": {"A": {"t": "ช่วยคนในแถวที่ไม่มีเอกสารเหมือนกันถามทางออก", "r": "เจ้าหน้าที่บอกวิธีขอใบผ่านทางชั่วคราว หลายคนในแถวได้ผ่าน"}, "B": {"t": "กลับรถ ไปทางอื่นเอง", "r": "คุณเลี่ยงด่านได้ แต่ทางอ้อมไกลขึ้นเกือบชั่วโมง"}, "C": {"t": "ถามว่าใบผ่านทางต้องใช้อะไรบ้าง", "r": "ใช้แค่บัตรประชาชนกับรายชื่อจากผู้นำชุมชน คุณรู้ว่าต้องไปขอที่ไหน"}, "D": {"t": "กลับไปลงทะเบียนกับชุมชน", "r": "คุณได้ใบผ่านทางและชื่ออยู่ในรายชื่อชุมชนตั้งแต่วันนั้น"}}}, "P3": {"title": "เอกสารที่ด่านขอเปลี่ยนทุกวัน", "s": "ด่านตรวจขอเอกสารไม่เหมือนกันในแต่ละวัน คนที่ผ่านมาเล่าไม่ตรงกันจนไม่มีใครรู้ว่าต้องเตรียมอะไร", "choices": {"A": {"t": "บอกให้ทุกคนพกเอกสารทุกอย่างไว้ก่อน", "r": "ไม่มีใครถูกตีกลับ แต่ทุกคนต้องแบกแฟ้มเอกสารไปมา"}, "B": {"t": "เลื่อนการเข้าเมืองไปก่อน", "r": "คุณไม่ต้องเจอด่าน แต่ธุระในเมืองยังไม่เสร็จ"}, "C": {"t": "ถามเจ้าหน้าที่ที่ด่านโดยตรง", "r": "ด่านเปลี่ยนชุดเจ้าหน้าที่ทุกวัน แต่ระเบียบจริงขอแค่บัตรประชาชน คุณขอให้เขียนไว้หน้าด่าน"}, "D": {"t": "ทำกระดานที่ศาลาจดว่าด่านขออะไรแต่ละวัน", "r": "คนอ่านก่อนออกเดินทาง ไม่มีใครเตรียมผิดอีก"}}}},
  "R077": {"P2": {"title": "รถของคุณต้องการอะไหล่", "s": "รถของคุณเริ่มมีเสียงดังที่ล้อหน้า ร้านอะไหล่ในตำบลปิด และคุณไม่อยากพึ่งใคร", "choices": {"A": {"t": "ถามคนในซอยว่าใครมีอะไหล่เหลือ", "r": "บ้านท้ายซอยมีลูกปืนล้อที่ถอดเก็บไว้ เขาให้ฟรีเพราะคุณเคยช่วยเขา"}, "B": {"t": "ซ่อมเองด้วยของที่มี", "r": "รถกลับมาใช้ได้ แต่คุณใช้เวลาสองวันและมือเต็มไปด้วยแผล"}, "C": {"t": "ฟังให้แน่ว่าเสียงมาจากตรงไหน", "r": "เสียงมาจากน็อตหลวม ไม่ใช่ลูกปืน คุณขันใหม่ก็หาย"}, "D": {"t": "ตั้งกลุ่มแลกอะไหล่กับคนที่มีรถในซอย", "r": "สี่บ้านจดอะไหล่ที่มีไว้แลกกัน ไม่มีรถคันไหนต้องจอดทิ้ง"}}}, "P3": {"title": "ยางรั่วซ้ำจุดเดิม", "s": "ยางรถคุณรั่วเป็นครั้งที่สามในสัปดาห์ ทุกครั้งเกิดบนถนนช่วงเดียวกัน", "choices": {"A": {"t": "ช่วยคนอื่นที่ยางรั่วตรงนั้นด้วย", "r": "คุณช่วยปะยางให้อีกสองคัน มือดำทั้งวันแต่ทุกคันกลับบ้านได้"}, "B": {"t": "เปลี่ยนเส้นทาง ไม่ใช้ถนนช่วงนั้นอีก", "r": "ยางคุณไม่รั่วอีก แต่ทางอ้อมไกลขึ้น"}, "C": {"t": "เดินดูถนนช่วงนั้นทีละเมตร", "r": "เจอตะปูเกลื่อนจากรถขนวัสดุที่ทำตกไว้ คุณกวาดออกได้เกือบหมด"}, "D": {"t": "แจ้งชุมชนให้ช่วยกันเก็บตะปูทั้งเส้น", "r": "อาสาสมัครกวาดถนนทั้งเส้นในเช้าเดียว ไม่มีรถยางรั่วอีก"}}}},
  "R078": {"P2": {"title": "ถนนเส้นเดียวที่ออกจากซอยขาด", "s": "ฝนกัดถนนเส้นที่คุณใช้ประจำจนขาด ทางออกอีกทางต้องผ่านศาลาที่ชุมชนตั้งด่านดูแล", "choices": {"A": {"t": "ช่วยเพื่อนบ้านถมดินซ่อมทาง", "r": "ทางกลับมาใช้ได้ในสามวัน คุณได้รู้จักคนที่มาช่วยอีกหลายคน"}, "B": {"t": "รอให้ทางแห้ง แล้วขับผ่านเอง", "r": "คุณไม่ต้องผ่านด่านชุมชน แต่ติดอยู่ในซอยสามวัน"}, "C": {"t": "ลงไปดูว่าดินทรุดลึกแค่ไหน", "r": "ขอบดินยังรับรถเล็กได้ถ้าชิดฝั่งใน คุณขับผ่านช้า ๆ ได้"}, "D": {"t": "ใช้ทางผ่านศาลาและลงชื่อตามด่าน", "r": "คุณผ่านด่านได้ทุกวัน และเริ่มรู้ข่าวจากคนเฝ้าด่าน"}}}, "P3": {"title": "รอยร้าวบนถนนกว้างขึ้น", "s": "คุณจดรอยร้าวริมถนนไว้ตั้งแต่สัปดาห์ก่อน วันนี้รอยกว้างขึ้นเกือบเท่าตัวหลังฝนตก", "choices": {"A": {"t": "ยืนโบกให้รถผ่านทีละคันห่างจากขอบ", "r": "รถผ่านได้ปลอดภัย คุณเปียกฝนอยู่ครึ่งชั่วโมง"}, "B": {"t": "ไม่ใช้ถนนนี้อีกจนกว่าจะซ่อม", "r": "คุณไม่ต้องเสี่ยง แต่ต้องอ้อมไกลทุกครั้ง"}, "C": {"t": "วัดว่ารอยร้าวกว้างขึ้นวันละเท่าไร", "r": "ถ้าฝนตกต่อ ขอบถนนจะทรุดภายในสามวัน คุณรู้ว่าต้องรีบแจ้ง"}, "D": {"t": "ส่งบันทึกรอยร้าวให้อำเภอ", "r": "อำเภอส่งรถมาเสริมขอบถนนก่อนที่ดินจะทรุด"}}}},
  "R079": {"P2": {"title": "รถอพยพขอเติมน้ำมันจากคุณ", "s": "รถบรรทุกคนอพยพจอดหน้าบ้าน คนขับขอซื้อน้ำมันจากแกลลอนที่คุณเก็บไว้ บอกว่าจะไปไม่ถึงศูนย์", "choices": {"A": {"t": "ให้น้ำมันโดยไม่คิดเงิน", "r": "รถไปถึงศูนย์พักพิง น้ำมันสำรองของคุณเหลือครึ่งเดียว"}, "B": {"t": "ขายให้ในราคาที่คุณต้องใช้ซื้อใหม่", "r": "เขาจ่ายและไปต่อ คุณได้เงินพอซื้อน้ำมันคืน"}, "C": {"t": "ถามว่าต้องใช้อีกกี่ลิตรถึงศูนย์", "r": "ต้องใช้แค่ห้าลิตร คุณให้พอดี ไม่ต้องแบ่งมากเกินไป"}, "D": {"t": "พาไปจุดเติมน้ำมันของชุมชน", "r": "ชุมชนมีน้ำมันสำรองสำหรับรถอพยพ เขาได้เติมโดยไม่ต้องพึ่งบ้านคุณ"}}}, "P3": {"title": "รถอพยพหลงทาง", "s": "รถบรรทุกคนอพยพจอดถามทาง คนขับใช้แผนที่เก่าที่ยังชี้ไปศูนย์พักพิงที่ปิดแล้ว", "choices": {"A": {"t": "แบ่งน้ำให้คนบนรถระหว่างคุย", "r": "เด็กบนรถได้ดื่มน้ำ น้ำของคุณเหลือครึ่งขวด"}, "B": {"t": "บอกทางเท่าที่รู้แล้วไปต่อ", "r": "พวกเขาได้ทาง แต่ไม่รู้ว่าศูนย์ที่จะไปยังเปิดอยู่ไหม"}, "C": {"t": "เทียบแผนที่ของเขากับประกาศล่าสุด", "r": "ศูนย์ที่เขาจะไปปิดตั้งแต่สัปดาห์ก่อน คุณชี้ศูนย์ใหม่ที่ยังรับคน"}, "D": {"t": "นำทางไปศูนย์ที่ยังเปิดด้วยกัน", "r": "รถบรรทุกตามคุณไปถึงศูนย์ เจ้าหน้าที่รับเรื่องต่อทันที"}}}},
  "R080": {"P2": {"title": "ของที่ต้องไปหาเองไกล", "s": "ของจำเป็นในบ้านหมด ร้านใกล้ ๆ ไม่มี คุณต้องเลือกว่าจะขับไปอำเภอข้างเคียงคนเดียวหรือไม่", "choices": {"A": {"t": "รับฝากซื้อของให้บ้านข้าง ๆ ด้วย", "r": "ได้ของครบสองบ้าน กลับถึงตอนค่ำและเหนื่อยมาก"}, "B": {"t": "ไปคนเดียว ซื้อเฉพาะของคุณ", "r": "คุณได้ของครบและกลับเร็ว แต่น้ำมันหมดไปหนึ่งเที่ยวเต็ม"}, "C": {"t": "ถามร้านใกล้ ๆ ว่าจะมีของเข้าเมื่อไร", "r": "ของจะเข้าพรุ่งนี้ คุณรอได้โดยไม่ต้องเสียน้ำมัน"}, "D": {"t": "ติดรถรวมของชุมชนไปแทน", "r": "คุณได้ของครบ จ่ายแค่ค่าน้ำมันส่วนของตัวเอง"}}}, "P3": {"title": "ร้านอำเภอข้างเคียงมีของจริงไหม", "s": "มีข่าวว่าร้านในอำเภอข้างเคียงมีของจำเป็นครบ หลายบ้านอยากให้คุณไปดูเพราะคุณตรวจข่าวเก่ง", "choices": {"A": {"t": "ไปและรับฝากซื้อให้ทุกบ้าน", "r": "ได้ของครบหลายบ้าน กลับถึงตอนค่ำและเหนื่อยมาก"}, "B": {"t": "ไม่ไป รอจนกว่าจะมีคนยืนยัน", "r": "คุณไม่เสียน้ำมัน แต่ของที่ขาดยังขาดอยู่"}, "C": {"t": "โทรถามร้านก่อนออกเดินทาง", "r": "ร้านมีของแค่ครึ่งหนึ่งของที่ลือ คุณบอกทุกบ้านว่าควรฝากซื้ออะไร"}, "D": {"t": "รวมรายการจากหลายบ้านแล้วไปทีเดียว", "r": "เที่ยวเดียวได้ของให้สี่บ้าน คุ้มกับน้ำมันที่ใช้"}}}},
  "R084": {"P2": {"title": "อาสาสมัครมาเคาะประตู", "s": "คุณไม่ได้ไปประชุมหลายครั้ง อาสาสมัครจึงเอารายการงานส่วนรวมมาให้ถึงหน้าบ้าน", "choices": {"A": {"t": "รับงานที่หนักที่สุด", "r": "คุณขนน้ำทั้งเช้า งานสำคัญเสร็จ แต่คุณหมดแรง"}, "B": {"t": "บอกว่ายังมีงานของตัวเองต้องทำ", "r": "อาสาสมัครจดว่าบ้านคุณไม่รับงาน งานส่วนรวมยังค้างอยู่"}, "C": {"t": "ถามว่างานไหนเร่งด่วนที่สุด", "r": "รั้วที่ศาลาพังและต้องเสร็จก่อนฝน คุณช่วยตรงนั้นได้พอดี"}, "D": {"t": "รับงานที่ทำจากบ้านได้", "r": "คุณรับซ่อมเครื่องมือของชุมชนที่บ้าน งานเสร็จโดยไม่ต้องไปศาลา"}}}, "P3": {"title": "รายการงานซ้ำซ้อน", "s": "อาสาสมัครเอารายการงานมาให้ดู คุณสังเกตว่างานหลายอย่างซ้ำกัน และบางงานมีคนทำไปแล้ว", "choices": {"A": {"t": "รับงานที่หนักที่สุด", "r": "คุณขนน้ำทั้งเช้า แต่บ่ายถึงรู้ว่ามีอีกกลุ่มขนไปแล้ว"}, "B": {"t": "ไม่รับงาน รอให้รายการชัดก่อน", "r": "บ้านคุณเรียบร้อย งานส่วนรวมยังค้างอยู่"}, "C": {"t": "เทียบรายการกับงานที่ทำไปแล้ว", "r": "งานจริงเหลือครึ่งเดียว คุณขีดรายการซ้ำออก อาสาสมัครไม่ต้องทำซ้ำ"}, "D": {"t": "ทำกระดานงานที่ทุกคนขีดเมื่อเสร็จ", "r": "ทุกคนเห็นว่างานไหนเสร็จแล้ว ไม่มีใครทำซ้ำอีก"}}}},
  "R085": {"P2": {"title": "ครัวกลางขอเสบียงจากคุณ", "s": "ชุมชนตั้งครัวกลาง และรู้ว่าบ้านคุณมีเสบียงมาก ผู้ดูแลครัวมาขอข้าวกับผักถึงบ้าน", "choices": {"A": {"t": "บริจาคข้าวและผักให้ครัวกลาง", "r": "ครัวกลางเริ่มได้ทันที ผู้ดูแลชวนคุณมากินด้วยทุกวัน"}, "B": {"t": "บอกว่าบ้านคุณทำกินเอง", "r": "ผู้ดูแลกลับไปมือเปล่า ครัวกลางเริ่มช้าไปหนึ่งวัน"}, "C": {"t": "ถามว่าครัวขาดอะไรจริง", "r": "ครัวขาดแค่น้ำมันพืชกับเกลือ คุณให้สองอย่างนั้น ข้าวยังเก็บไว้เอง"}, "D": {"t": "แลกเสบียงกับการได้กินที่ครัวกลางวันละมื้อ", "r": "คุณประหยัดแก๊สได้มาก และได้กินร่วมกับคนในซอย"}}}, "P3": {"title": "ครัวกลางใช้ของเกินจริง", "s": "ครัวกลางเปิดมาสัปดาห์หนึ่ง เสบียงที่ใช้มากกว่าจำนวนคนที่มากินเกือบเท่าตัว", "choices": {"A": {"t": "บริจาคข้าวเพิ่มให้ครัวไปก่อน", "r": "ครัวทำอาหารต่อได้ ข้าวในบ้านคุณลดลง"}, "B": {"t": "เลิกส่งของเข้าครัวจนกว่าจะชัด", "r": "ของของคุณยังอยู่ แต่ครัวอาจต้องหยุดก่อนกำหนด"}, "C": {"t": "นับคนกินกับปริมาณที่หุงจริง", "r": "ครัวหุงเผื่อทุกมื้อแล้วเททิ้งที่เหลือ คุณเสนอให้หุงตามคนลงชื่อ"}, "D": {"t": "ทำใบลงชื่อกินล่วงหน้าทุกวัน", "r": "ครัวหุงพอดีกับคนกิน เสบียงอยู่ได้นานขึ้นเกือบเท่าตัว"}}}},
  "R086": {"P2": {"title": "กติกาน้ำที่คุณไม่ได้ร่วมตั้ง", "s": "ชุมชนออกกติกาจำกัดการใช้น้ำทุกบ้าน รวมถึงบ้านคุณที่มีบ่อน้ำของตัวเอง", "choices": {"A": {"t": "ทำตามกติกาเหมือนทุกบ้าน", "r": "คุณใช้น้ำน้อยลง แต่คนในซอยเริ่มทักทายคุณมากขึ้น"}, "B": {"t": "ใช้น้ำจากบ่อของคุณตามเดิม", "r": "คุณมีน้ำพอ แต่มีคนพูดว่าบ้านคุณไม่ทำตามกติกา"}, "C": {"t": "ถามว่ากติกาครอบคลุมบ่อส่วนตัวไหม", "r": "กติกาใช้กับน้ำประปาเท่านั้น บ่อของคุณไม่เกี่ยว คุณได้คำตอบชัด"}, "D": {"t": "ไปเสนอที่ประชุมให้แยกบ่อส่วนตัวออก", "r": "ที่ประชุมปรับกติกาให้ชัด คุณได้ร่วมตั้งกติกาเป็นครั้งแรก"}}}, "P3": {"title": "คนละเมิดกติกามีเหตุผล", "s": "มีคนไม่ทำตามกติกาการใช้น้ำ เขาบอกว่าตัวเลขที่ใช้ตั้งกติกาผิดตั้งแต่ต้น", "choices": {"A": {"t": "ฟังเขาจนจบอย่างใจเย็น", "r": "เขามีคนป่วยในบ้านที่ต้องใช้น้ำมาก ทุกคนเข้าใจและให้ข้อยกเว้น"}, "B": {"t": "ยืนยันว่ากติกาต้องใช้กับทุกคน", "r": "กติกายังศักดิ์สิทธิ์ แต่เขาไม่พอใจและเริ่มไม่ร่วมมือ"}, "C": {"t": "ตรวจตัวเลขที่ใช้ตั้งกติกาใหม่", "r": "ตัวเลขนับจำนวนคนผิดไปหลายบ้าน เขาพูดถูก กติกาต้องแก้"}, "D": {"t": "ให้ที่ประชุมแก้กติกาจากตัวเลขที่ถูก", "r": "กติกาใหม่ใช้ตัวเลขที่ตรวจแล้ว คนที่เคยไม่ยอมกลับมาทำตาม"}}}},
  "R087": {"P2": {"title": "ของในบ้านคุณถูกสงสัย", "s": "ของในคลังส่วนกลางหาย มีคนพูดว่าบ้านคุณเก็บของไว้มาก อาจเกี่ยวข้อง", "choices": {"A": {"t": "เปิดบ้านให้ผู้ดูแลดูของทั้งหมด", "r": "ผู้ดูแลเห็นว่าไม่มีของจากคลัง เขาขอโทษ และข่าวลือหยุด"}, "B": {"t": "ไม่ยอมให้ใครเข้าบ้าน", "r": "ไม่มีใครเข้ามา แต่ข่าวลือเรื่องบ้านคุณยังไม่หายไป"}, "C": {"t": "ขอดูบัญชีคลังว่าอะไรหาย", "r": "ของที่หายเป็นยาที่บ้านคุณไม่เคยมี คุณชี้ให้เห็นตรงนั้น"}, "D": {"t": "ช่วยผู้ดูแลตั้งระบบเบิกที่มีคนเซ็น", "r": "ทุกการเบิกมีลายเซ็นสองคน ไม่มีใครถูกสงสัยลอย ๆ อีก"}}}, "P3": {"title": "บัญชีคลังถูกแก้", "s": "ของในคลังไม่ตรงบัญชี คุณเห็นว่าบัญชีบางหน้ามีรอยลบแล้วเขียนตัวเลขใหม่", "choices": {"A": {"t": "อาสาช่วยนับของทั้งคลังใหม่", "r": "คุณนับจนดึก ได้ตัวเลขจริงที่ทุกคนเชื่อได้"}, "B": {"t": "ไม่ยุ่ง ให้ผู้ดูแลจัดการเอง", "r": "ผู้ดูแลต้องจัดการคนเดียว รอยลบยังไม่มีใครอธิบาย"}, "C": {"t": "เทียบลายมือกับวันที่ที่ถูกแก้", "r": "แก้ทุกครั้งในวันที่คนเดียวกันเป็นเวร คุณเก็บหน้านั้นไว้ให้ที่ประชุมดู"}, "D": {"t": "เสนอให้บัญชีมีสองฉบับเก็บคนละที่", "r": "บัญชีสองฉบับต้องตรงกันทุกวัน แก้ฉบับเดียวไม่ได้อีก"}}}},
  "R088": {"P2": {"title": "มีคนเสนอชื่อคุณเป็นตัวแทน", "s": "ชุมชนจะเลือกตัวแทน มีคนเสนอชื่อคุณ เพราะเห็นว่าบ้านคุณจัดการตัวเองได้ดี", "choices": {"A": {"t": "รับเป็นผู้สมัคร", "r": "คุณได้รับเลือกเป็นตัวแทนฝ่ายเสบียง งานเพิ่มขึ้นมาก"}, "B": {"t": "ปฏิเสธ ขอดูแลบ้านตัวเองต่อ", "r": "คนเสนอชื่อเสียดาย คุณยังมีเวลาของตัวเองเต็มที่"}, "C": {"t": "ถามว่าตัวแทนต้องทำอะไรบ้าง", "r": "ต้องประชุมทุกสัปดาห์และจัดคิวของแจก คุณรู้ว่าเกินเวลาที่มี จึงขอเป็นที่ปรึกษาแทน"}, "D": {"t": "เสนอให้มีตัวแทนหลายคนแบ่งงานกัน", "r": "ชุมชนเลือกตัวแทนสามคน คุณรับเฉพาะงานที่ถนัด"}}}, "P3": {"title": "ผู้สมัครพูดตัวเลขไม่ตรง", "s": "ชุมชนจะเลือกตัวแทน ผู้สมัครคนหนึ่งบอกว่าเคยหาข้าวมาให้ชุมชนสิบกระสอบ แต่บัญชีที่คุณจดมีแค่สาม", "choices": {"A": {"t": "ช่วยจัดการเลือกตั้งให้เรียบร้อย", "r": "การเลือกเสร็จในบ่ายเดียว แต่ยังมีคนเชื่อตัวเลขสิบกระสอบ"}, "B": {"t": "ไม่ลงคะแนน ไม่ยุ่ง", "r": "คุณไม่ต้องเลือกข้าง แต่ก็ไม่มีเสียงในเรื่องนี้"}, "C": {"t": "ถามผู้สมัครถึงตัวเลขนั้นต่อหน้าทุกคน", "r": "เขายอมรับว่าจำผิด ที่ประชุมได้เห็นว่าใครตอบตรงไปตรงมา"}, "D": {"t": "เสนอให้ผู้สมัครทุกคนแสดงผลงานจากบัญชี", "r": "ทุกคนพูดจากบัญชีเดียวกัน การเลือกตัดสินจากสิ่งที่เกิดขึ้นจริง"}}}},
  "R089": {"P2": {"title": "ผู้มาใหม่ขอพักบ้านคุณ", "s": "ผู้มาใหม่ที่ยังไม่มีที่อยู่มาขอพักบ้านคุณ เพราะได้ยินว่าบ้านคุณกว้างและมีของพอ", "choices": {"A": {"t": "ให้พักสองสามคืน", "r": "เขาช่วยงานบ้านตอบแทน และเล่าเรื่องการจัดการน้ำที่อำเภอเขา"}, "B": {"t": "ปฏิเสธ แนะนำให้ไปศาลา", "r": "เขาไปศาลา บ้านคุณยังเป็นของคุณ แต่คุณรู้สึกหนักใจ"}, "C": {"t": "ถามว่าเขาจะอยู่ยาวไหม ทำอะไรได้", "r": "เขาเป็นช่างไฟและจะอยู่ยาว คุณให้เช่าห้องแลกกับซ่อมไฟบ้าน"}, "D": {"t": "พาไปหาที่พักที่ชุมชนจัดไว้", "r": "ชุมชนมีห้องว่างให้ เขาได้ที่อยู่ที่มีคนดูแล"}}}, "P3": {"title": "ผู้มาใหม่ไม่มีเอกสาร", "s": "ผู้มาใหม่ขอเข้าร่วมชุมชน แต่ไม่มีบัตรหรือเอกสารใดเลย บางคนเริ่มไม่ไว้ใจ", "choices": {"A": {"t": "เชิญเขาเข้ามานั่งในวงก่อน", "r": "เขาเล่าเรื่องที่อำเภอเขาจัดการน้ำ คนเริ่มฟังเขามากขึ้น"}, "B": {"t": "บอกให้รอจนมีเอกสารก่อน", "r": "ที่ประชุมยังเป็นคนเดิม ผู้มาใหม่รู้สึกเหมือนคนนอก"}, "C": {"t": "ถามคนที่มาจากอำเภอเดียวกับเขา", "r": "มีคนจำเขาได้ว่าเป็นช่างไฟที่ตลาด บัตรหายตอนหนีมา"}, "D": {"t": "ให้ผู้นำชุมชนออกบัตรชั่วคราวพร้อมผู้รับรอง", "r": "เขาได้บัตรชั่วคราวมีคนรับรองสองคน และเริ่มช่วยงานได้ทันที"}}}},
  "R090": {"P2": {"title": "กติกาใหม่ให้ทุกบ้านแบ่งของ", "s": "ชุมชนร่างกติกาใหม่ให้ทุกบ้านแบ่งเสบียงเข้าคลังกลางหนึ่งในสิบ บ้านคุณต้องให้มากที่สุด", "choices": {"A": {"t": "ยอมรับและให้ตามกติกา", "r": "คลังกลางมีของพอทั้งเดือน คุณกลายเป็นบ้านที่ทุกคนขอบคุณ"}, "B": {"t": "คัดค้าน บอกว่าของคุณหามาเอง", "r": "กติกาผ่านโดยไม่มีเสียงคุณ และบ้านคุณถูกจับตามองมากขึ้น"}, "C": {"t": "ขอดูว่าคลังขาดอะไรจริงก่อน", "r": "คลังขาดแค่ข้าวกับน้ำมัน คุณเสนอให้เฉพาะสองอย่างนั้น ที่ประชุมรับได้"}, "D": {"t": "เสนอให้แบ่งตามที่แต่ละบ้านพอให้ได้", "r": "กติกาปรับให้แต่ละบ้านให้ตามกำลัง คุณได้ร่วมร่างเป็นครั้งแรก"}}}, "P3": {"title": "กติกาใหม่จากบันทึก", "s": "ชุมชนจะทำกติการะยะยาว และขอดูบันทึกปัญหาที่คุณจดมาตลอดหลายเดือน", "choices": {"A": {"t": "รับเป็นคนร่างกติกาฉบับใหม่", "r": "คุณใช้เวลาหลายคืนร่างจนเสร็จ ทุกคนมีของให้อ่านและแก้"}, "B": {"t": "ให้ดูบันทึกแต่ไม่ร่วมร่าง", "r": "ที่ประชุมได้ข้อมูล แต่ตีความบันทึกของคุณผิดไปบางข้อ"}, "C": {"t": "สรุปว่าปัญหาไหนเกิดบ่อยที่สุด", "r": "มีสามเรื่องที่เกิดซ้ำ กติกาใหม่แก้ตรงจุด"}, "D": {"t": "แบ่งกลุ่มร่างตามเรื่องในบันทึก", "r": "แต่ละกลุ่มร่างเรื่องที่ถนัด กติกาใหม่เสร็จในหนึ่งสัปดาห์"}}}},
  "R094": {"P2": {"title": "คนขอยืมของจากบ้านคุณ", "s": "บ้านคุณมีของใช้ครบกว่าบ้านอื่น เพื่อนบ้านมาขอยืมเครื่องมือและสัญญาว่าจะคืนพร้อมข้าวหนึ่งถ้วย", "choices": {"A": {"t": "ให้ยืมโดยไม่ต้องตอบแทน", "r": "เขาคืนเครื่องมือตรงเวลา และเริ่มชวนคุณไปกินข้าวบ้านเขา"}, "B": {"t": "ไม่ให้ยืม กลัวไม่ได้คืน", "r": "เครื่องมืออยู่ครบ แต่เขาไปยืมบ้านอื่นและเล่าว่าบ้านคุณไม่ให้"}, "C": {"t": "ถามว่าจะใช้ทำอะไร นานแค่ไหน", "r": "เขาใช้แค่ครึ่งวัน คุณให้ยืมและได้คืนก่อนค่ำ"}, "D": {"t": "เขียนรายการของที่ให้ยืมไว้หน้าบ้าน", "r": "คนยืมจดชื่อเองแล้วคืนตามรายการ ไม่มีของหาย"}}}, "P3": {"title": "ใบสั่งของดูไม่ชอบมาพากล", "s": "แม่ค้าขอให้จ่ายล่วงหน้าพร้อมโชว์ใบสั่งของ แต่ชื่อผู้ส่งในใบไม่ตรงกับที่เธอเล่า", "choices": {"A": {"t": "ยอมจ่ายก่อนเพื่อช่วยร้าน", "r": "สัปดาห์ต่อมาของมาครบ ผู้ส่งแค่เปลี่ยนชื่อร้าน คุณโชคดีที่ไม่มีอะไรผิด"}, "B": {"t": "ไม่จ่ายจนกว่าของจะมา", "r": "คุณไม่เสี่ยง แต่แม่ค้าอาจไม่มีทุนไปซื้อของ"}, "C": {"t": "โทรถามผู้ส่งตามเบอร์ในใบ", "r": "ผู้ส่งเปลี่ยนชื่อร้านใหม่และยืนยันคำสั่งของ คุณจ่ายครึ่งหนึ่งอย่างมั่นใจ"}, "D": {"t": "ให้จดสัญญาต่อหน้าพยาน", "r": "มีสัญญาเขียนชัดพร้อมพยาน ทั้งสองฝ่ายสบายใจ"}}}},
  "R095": {"P2": {"title": "มีคนขอซื้อของในบ้านคุณ", "s": "ตลาดแลกของเกิดขึ้นที่ลาน มีคนมาถามว่าบ้านคุณมีของที่ไม่ใช้อยากแลกบ้างไหม", "choices": {"A": {"t": "เอาของที่ไม่ใช้ไปให้คนที่ขาด", "r": "ของที่เก็บไว้เฉย ๆ ได้ไปอยู่กับบ้านที่ต้องใช้ คุณได้ผักกลับมา"}, "B": {"t": "ไม่แลก เก็บไว้เผื่อวันหน้า", "r": "ของของคุณยังอยู่ครบ แต่ไม่ได้อะไรใหม่เข้าบ้าน"}, "C": {"t": "นับก่อนว่าของอะไรเหลือใช้จริง", "r": "มีของเกินห้าอย่าง คุณแลกเฉพาะที่ไม่จำเป็น ได้ของที่ขาดกลับมา"}, "D": {"t": "ตั้งแผงเล็ก ๆ ในตลาดทุกเสาร์", "r": "คุณแลกของประจำทุกสัปดาห์ และเริ่มรู้จักคนจากซอยอื่น"}}}, "P3": {"title": "ของในตลาดแลกไม่มีที่มา", "s": "ตลาดแลกของเริ่มใหญ่ขึ้น มีของหลายชิ้นที่ไม่มีใครรู้ว่ามาจากไหน รวมถึงของจากบ้านร้าง", "choices": {"A": {"t": "แลกเฉพาะของที่ช่วยคนขาดได้ทันที", "r": "ยายข้างบ้านได้หม้อหุงข้าวที่ต้องใช้ คุณได้ผักกลับมา"}, "B": {"t": "แค่เดินดู ไม่แลก", "r": "คุณรู้ว่ามีของอะไรในตลาด แต่ไม่ได้อะไรกลับบ้าน"}, "C": {"t": "ถามคนขายว่าของแต่ละชิ้นได้มาอย่างไร", "r": "ของส่วนใหญ่มาจากบ้านที่ย้ายออกและฝากขาย มีสองชิ้นที่ตอบไม่ได้ คุณไม่แลกสองชิ้นนั้น"}, "D": {"t": "เสนอให้จดที่มาของทุกชิ้นที่วางขาย", "r": "ตลาดมีสมุดจดที่มา ของจากบ้านร้างถูกเก็บไว้รอเจ้าของ"}}}},
  "R096": {"P2": {"title": "คุณได้ของปลอมมา", "s": "แบตเตอรี่ที่คุณแลกมาเมื่อวานใช้ได้ไม่ถึงชั่วโมง กล่องดูเหมือนของแท้ทุกอย่าง", "choices": {"A": {"t": "เตือนคนอื่นที่แลกจากคนเดียวกัน", "r": "สามบ้านเช็กแบตของตัวเองทัน คนขายของปลอมไม่กล้าตั้งแผงอีก"}, "B": {"t": "เลิกแลกของในตลาดนี้", "r": "คุณไม่โดนหลอกอีก แต่ต้องหาของเองที่อื่น"}, "C": {"t": "เทียบกล่องกับของแท้ที่บ้าน", "r": "ตัวหนังสือบนกล่องเอียงผิดแบบ คุณรู้จุดสังเกตไว้ใช้ครั้งหน้า"}, "D": {"t": "พาผู้ดูแลตลาดไปหาคนขาย", "r": "คนขายยอมคืนข้าวที่แลกไป และถูกห้ามตั้งแผงในตลาด"}}}, "P3": {"title": "ลายแบตปลอมกับแบตแท้", "s": "คุณเก็บแบตปลอมที่เจอในตลาดไว้หลายก้อน และเริ่มเห็นจุดต่างจากของแท้ชัดขึ้น", "choices": {"A": {"t": "เดินเตือนคนในตลาดทีละแผง", "r": "หลายคนเช็กของตัวเองทัน คุณเดินจนเย็นและเสียงแหบ"}, "B": {"t": "ใช้ความรู้นี้แลกเฉพาะของตัวเอง", "r": "คุณไม่โดนหลอกอีก แต่คนอื่นยังโดนอยู่"}, "C": {"t": "ทำภาพเทียบแท้กับปลอมให้ชัด", "r": "ภาพเทียบสามจุดทำให้ใครก็แยกได้ในไม่กี่วินาที"}, "D": {"t": "ติดภาพเทียบไว้ที่จุดตรวจของตลาด", "r": "ทุกคนเช็กของก่อนแลก ของปลอมหายไปจากตลาด"}}}},
  "R097": {"P2": {"title": "คนค้างส่งของให้คุณ", "s": "คนที่สัญญาจะส่งข้าวมาแลกกับเครื่องมือของคุณยังไม่มาตามนัด เลยมาสามวันแล้ว", "choices": {"A": {"t": "ไปเยี่ยมดูว่าเขาเป็นอะไร", "r": "เขาป่วยอยู่ที่บ้าน คุณให้เลื่อนส่งได้ และเขาขอบคุณมาก"}, "B": {"t": "ไปทวงเครื่องมือคืน", "r": "คุณได้เครื่องมือคืน การแลกยกเลิก และเขาไม่ทักคุณอีก"}, "C": {"t": "ดูว่าสัญญาตกลงวันส่งไว้อย่างไร", "r": "สัญญาไม่ได้เขียนวันส่ง ทั้งคู่เข้าใจผิดกัน ไม่มีใครโกง"}, "D": {"t": "ให้ตัวแทนชุมชนช่วยไกล่เกลี่ย", "r": "ตกลงส่งครึ่งหนึ่งก่อน ที่เหลือส่งสัปดาห์หน้า"}}}, "P3": {"title": "สัญญาสองฉบับไม่ตรงกัน", "s": "สองคนที่แลกกันมาหาคุณ ต่างถือสัญญาของตัวเอง แต่จำนวนข้าวในสองฉบับไม่เท่ากัน", "choices": {"A": {"t": "ไปช่วยตามหาคนที่เขียนสัญญาให้", "r": "คนเขียนจำได้ว่าแก้จำนวนทีหลัง แต่ลืมแก้อีกฉบับ ทั้งคู่ยอมใช้ตัวเลขใหม่"}, "B": {"t": "บอกว่าไม่ใช่เรื่องของคุณ", "r": "คุณไม่เสียเวลา แต่เรื่องยังค้างและเริ่มมีคำพูดไม่ดี"}, "C": {"t": "เทียบลายมือและรอยแก้ในสองฉบับ", "r": "ฉบับหนึ่งถูกแก้โดยไม่มีลายเซ็นกำกับ ฉบับที่ไม่ถูกแก้จึงใช้ได้"}, "D": {"t": "เสนอให้ทุกสัญญามีสำเนาเก็บที่ศาลา", "r": "สัญญาทุกฉบับมีสำเนากลาง ไม่มีใครถือคนละฉบับอีก"}}}},
  "R098": {"P2": {"title": "คุณถูกกล่าวว่าให้ของไม่ครบ", "s": "คนที่แลกของกับคุณกลับมาบอกว่าน้ำมันที่คุณให้ไปขาดไปเกือบครึ่งลิตร", "choices": {"A": {"t": "เติมให้ไปเลยไม่เถียง", "r": "การเถียงจบทันที คุณเสียน้ำมันเพิ่ม แต่เขาจะกลับมาแลกอีก"}, "B": {"t": "ยืนยันว่าให้ครบแล้ว", "r": "คุณไม่เสียของเพิ่ม แต่เขาเลิกแลกกับคุณ"}, "C": {"t": "ตวงน้ำมันที่เหลือต่อหน้าเขา", "r": "ขวดของเขารั่วที่ฝา น้ำมันซึมออกระหว่างทาง ไม่มีใครโกง"}, "D": {"t": "เสนอให้ตวงต่อหน้ากันทุกครั้ง", "r": "ทั้งคู่ตวงต่อหน้ากันจากนี้ ไม่มีเรื่องแบบนี้อีก"}}}, "P3": {"title": "ตาชั่งกลางเพี้ยน", "s": "ตาชั่งกลางของตลาดแลกเริ่มเพี้ยน คนแลกกันเถียงทุกวันว่าของไม่ครบ", "choices": {"A": {"t": "เอาของคุณมาเติมให้คนที่ขาดไปก่อน", "r": "การเถียงจบทันที แต่คุณเสียของไปเปล่า ๆ"}, "B": {"t": "ไม่ใช้ตาชั่งกลาง ชั่งเองที่บ้าน", "r": "คุณมั่นใจในของตัวเอง แต่คนอื่นยังเถียงกันต่อ"}, "C": {"t": "เทียบตาชั่งกับน้ำหนักที่รู้ค่าแน่นอน", "r": "ตาชั่งขาดไปสองขีด คุณปรับสปริงจนตรง"}, "D": {"t": "เสนอตรวจตาชั่งทุกเช้าก่อนเปิดตลาด", "r": "มีคนตรวจตาชั่งทุกเช้า เรื่องของไม่ครบหายไป"}}}},
  "R099": {"P2": {"title": "บัญชีกลางอยากรู้ว่าคุณมีอะไร", "s": "ชุมชนตั้งบัญชีกลางจดการแลกของ และอยากให้ทุกบ้านจดของที่มีไว้ด้วย รวมถึงบ้านคุณ", "choices": {"A": {"t": "จดของทั้งหมดที่มี", "r": "บัญชีครบขึ้น คนรู้ว่าจะมาแลกอะไรกับคุณได้ และมีคนมาแลกบ่อยขึ้น"}, "B": {"t": "ไม่จด ของในบ้านเป็นเรื่องส่วนตัว", "r": "ของของคุณเป็นความลับ แต่ถ้ามีปัญหาก็ไม่มีหลักฐาน"}, "C": {"t": "ถามว่าใครจะเห็นบัญชีได้บ้าง", "r": "บัญชีเปิดให้ดูเฉพาะคู่แลก คุณสบายใจพอจะจดบางส่วน"}, "D": {"t": "จดเฉพาะของที่พร้อมแลก", "r": "คนรู้ว่าบ้านคุณมีอะไรให้แลก ของที่เหลือยังเป็นเรื่องของคุณ"}}}, "P3": {"title": "บัญชีกลางที่ทุกคนตรวจได้", "s": "คนเสนอให้ทำบัญชีกลาง และขอให้คุณช่วยออกแบบ เพราะรู้ว่าคุณจดบันทึกเป็นระบบ", "choices": {"A": {"t": "อาสาจดบัญชีเองทุกวัน", "r": "คุณจดทุกการแลกทุกวัน งานหนักแต่ทุกคนรู้ว่าใครติดค้างใคร"}, "B": {"t": "ออกแบบให้ แต่ไม่รับจด", "r": "บัญชีมีแบบที่ดี แต่ไม่มีใครจดสม่ำเสมอ"}, "C": {"t": "ทดลองใช้บัญชีกับตลาดหนึ่งสัปดาห์ก่อน", "r": "เจอช่องที่ไม่มีใครกรอกสองช่อง คุณตัดออก บัญชีใช้ง่ายขึ้น"}, "D": {"t": "สอนคู่แลกให้จดและเซ็นเองทุกครั้ง", "r": "ทุกการแลกมีลายเซ็นสองฝ่าย บัญชีเดินได้โดยไม่ต้องมีคนจดประจำ"}}}},
  "R100": {"P2": {"title": "อัตราแลกกลางไม่เข้าข้างคุณ", "s": "ชุมชนเสนออัตราแลกกลาง ของที่บ้านคุณมีมากกลายเป็นของที่มีค่าน้อยลงตามอัตรานี้", "choices": {"A": {"t": "ยอมใช้อัตรากลาง", "r": "การตกลงเดินหน้าได้ คุณได้น้อยกว่าที่ควรนิดหน่อย"}, "B": {"t": "ไม่ใช้อัตรากลาง แลกเองตามตกลง", "r": "คุณได้ราคาที่ต้องการ แต่ต้องต่อรองทุกครั้ง"}, "C": {"t": "ดูว่าตลาดแลกกันจริงที่อัตราเท่าไร", "r": "อัตราจริงสูงกว่าที่เสนอ คุณยื่นตัวเลข อัตรากลางถูกปรับให้สมเหตุสมผล"}, "D": {"t": "เสนอทบทวนอัตราทุกสองสัปดาห์", "r": "อัตรากลางปรับตามของที่มี ไม่มีใครเสียเปรียบนาน"}}}, "P3": {"title": "อัตราแลกจากตัวเลขจริง", "s": "ชุมชนจะกำหนดอัตราแลกกลาง และขอใช้บันทึกการแลกที่คุณจดมาเป็นฐาน", "choices": {"A": {"t": "ยอมให้ใช้บันทึกทั้งหมด แม้บ้านคุณจะเสียเปรียบ", "r": "อัตรากลางยุติธรรม บ้านคุณได้น้อยลงนิดหน่อย"}, "B": {"t": "ให้ใช้บันทึก แต่ขอไม่ร่วมตัดสิน", "r": "ที่ประชุมได้ตัวเลข แต่ตั้งอัตราผิดไปบางอย่าง"}, "C": {"t": "คำนวณอัตราเฉลี่ยจากการแลกจริง", "r": "อัตรากลางตรงกับที่ตลาดแลกกันจริง ไม่มีใครเถียง"}, "D": {"t": "เสนอทบทวนอัตราจากบันทึกทุกสองสัปดาห์", "r": "อัตรากลางปรับตามของที่มี ไม่มีใครเสียเปรียบนาน"}}}},
  "R104": {"P2": {"title": "ไม่ได้คุยกับใครมาหลายวัน", "s": "คุณอยู่แต่ในบ้านมาหลายวัน วันนี้เพื่อนบ้านมานั่งที่บันไดหน้าบ้าน ถามว่าพอมีเวลาคุยไหม", "choices": {"A": {"t": "นั่งคุยกับเขาจนจบ", "r": "เขาเล่าเรื่องของเขา คุณได้เล่าเรื่องของตัวเองบ้าง ทั้งคู่รู้สึกเบาลง"}, "B": {"t": "ขอตัว บอกว่ายังมีงาน", "r": "เขาเข้าใจและกลับไป บ้านคุณเงียบเหมือนเดิม"}, "C": {"t": "ถามว่าเขามีอะไรให้ช่วย", "r": "เขาอยากรู้วิธีฝากข้อความทางวิทยุ คุณบอกได้ และได้คุยต่ออีกนาน"}, "D": {"t": "ชวนเขาไปวงคุยที่ศาลาตอนเย็นด้วยกัน", "r": "คุณออกจากบ้านครั้งแรกในรอบสัปดาห์ และได้เจอคนอีกหลายคน"}}}, "P3": {"title": "เพื่อนบ้านพูดซ้ำเรื่องเดิม", "s": "เพื่อนบ้านมานั่งที่บันไดหน้าบ้านเป็นวันที่สาม และเล่าเรื่องลูกที่ติดต่อไม่ได้ซ้ำเหมือนเดิมทุกครั้ง", "choices": {"A": {"t": "นั่งฟังเขาจนจบอีกครั้ง", "r": "เขากลับบ้านด้วยท่าทางเบาลง คุณรู้ว่าพรุ่งนี้เขาจะมาอีก"}, "B": {"t": "ขอเวลา เพราะงานยังไม่เสร็จ", "r": "เขาเข้าใจและกลับไป งานของคุณเสร็จทันเวลา"}, "C": {"t": "ถามรายละเอียดว่าติดต่อครั้งสุดท้ายเมื่อไร", "r": "ลูกเขาลงทะเบียนที่ศูนย์พักพิงแห่งหนึ่ง คุณได้ชื่อศูนย์ไปถามต่อ"}, "D": {"t": "พาเขาไปฝากชื่อลูกที่วิทยุชุมชน", "r": "สามวันต่อมาวิทยุได้ข่าวว่าลูกเขาปลอดภัย เขามาขอบคุณพร้อมข้าวหนึ่งห่อ"}}}},
  "R105": {"P2": {"title": "บ้านไม่มีใครพูดถึงวันเก่า", "s": "คนในบ้านเลี่ยงพูดถึงชีวิตก่อนสงคราม จนวันนี้มีคนเจออัลบั้มรูปเก่าแล้วรีบเก็บเข้าตู้", "choices": {"A": {"t": "หยิบออกมาดูด้วยกันตอนกินข้าว", "r": "ทุกคนเงียบไปครู่หนึ่งแล้วเริ่มเล่า บ้านอบอุ่นขึ้นในคืนนั้น"}, "B": {"t": "ปล่อยไว้ในตู้ ไม่อยากให้ใครเศร้า", "r": "ไม่มีใครเศร้า แต่ความทรงจำดี ๆ ก็ถูกปิดไว้"}, "C": {"t": "ถามคนที่เก็บว่าอยากให้ดูไหม", "r": "เขาอยากดูคนเดียวก่อน คุณให้เวลาเขา เขาขอบคุณที่ถาม"}, "D": {"t": "ชวนทุกคนถ่ายรูปวันนี้เก็บไว้ต่อ", "r": "อัลบั้มเก่ามีรูปของวันนี้ต่อท้าย ทุกคนยิ้มในรูป"}}}, "P3": {"title": "สมุดบันทึกมีวันที่ไม่ตรง", "s": "คุณเจอสมุดบันทึกเก่าของคนในบ้าน บางหน้าเขียนถึงเหตุการณ์ที่ทุกคนจำวันกันผิดมาตลอด", "choices": {"A": {"t": "อ่านให้ทุกคนฟังตอนกินข้าว", "r": "ทุกคนหัวเราะที่จำผิดกันมานาน บ้านอบอุ่นขึ้นในคืนนั้น"}, "B": {"t": "เก็บไว้ ไม่อยากรื้อฟื้น", "r": "ไม่มีใครเศร้า แต่เรื่องที่จำผิดก็ยังผิดต่อไป"}, "C": {"t": "ถามเจ้าของว่าอยากให้คนอื่นอ่านไหม", "r": "เขาอยากเก็บไว้อ่านคนเดียว คุณคืนให้ เขาขอบคุณที่ถามก่อน"}, "D": {"t": "ชวนทุกคนเขียนบันทึกวันนี้ไว้ต่อ", "r": "ทุกคนเขียนคนละหน้าพร้อมวันที่ชัดเจน สมุดเล่มเก่ามีเรื่องราวของวันนี้ต่อท้าย"}}}},
  "R106": {"P2": {"title": "คนในบ้านโทษตัวเองเรื่องปิดบ้าน", "s": "คนในบ้านคนหนึ่งพูดว่าการปิดบ้านไม่ยุ่งกับใครทำให้ทุกคนโดดเดี่ยว และโทษตัวเองที่เป็นคนเสนอ", "choices": {"A": {"t": "บอกเขาว่าตอนนั้นทุกคนตัดสินใจด้วยกัน", "r": "เขาเงียบไปนาน แล้วบอกว่าจะลองให้อภัยตัวเอง"}, "B": {"t": "ปล่อยให้เขาคิดเอง", "r": "คุณไม่ต้องรับเรื่องหนัก แต่เขายังวนอยู่กับความรู้สึกผิด"}, "C": {"t": "ถามว่าตอนนั้นตัดสินใจจากอะไร", "r": "ไล่ทีละข้อแล้ว ตอนนั้นข้างนอกอันตรายจริง เขาเห็นว่าเลือกได้ดีที่สุดแล้ว"}, "D": {"t": "ชวนทั้งบ้านคิดว่าจะเปิดบ้านอย่างไรต่อ", "r": "ทุกคนช่วยกันวางแผนออกไปหาเพื่อนบ้าน ความรู้สึกผิดเปลี่ยนเป็นสิ่งที่ทำได้"}}}, "P3": {"title": "ข้อมูลที่ไม่มีใครรู้ตอนนั้น", "s": "คนในบ้านโทษตัวเองเรื่องการตัดสินใจเมื่อเดือนก่อน คุณยังเก็บข่าวและบันทึกของช่วงนั้นไว้ครบ", "choices": {"A": {"t": "บอกเขาว่าตอนนั้นไม่มีใครรู้ผลล่วงหน้า", "r": "เขาเงียบไปนาน แล้วบอกว่าจะลองให้อภัยตัวเอง"}, "B": {"t": "ปล่อยให้เขาคิดเอง", "r": "คุณไม่ต้องรับเรื่องหนัก แต่เขายังวนอยู่กับความรู้สึกผิด"}, "C": {"t": "เปิดบันทึกช่วงนั้นให้เขาดูทีละวัน", "r": "ข่าวที่ทำให้เรื่องแย่ออกมาหลังวันที่เขาตัดสินใจ เขาเห็นว่าตอนนั้นเลือกจากสิ่งที่มีอยู่จริง"}, "D": {"t": "ชวนทั้งบ้านทบทวนการตัดสินใจครั้งนั้นด้วยกัน", "r": "ทุกคนบอกว่าตอนนั้นก็เห็นด้วย ภาระไม่ได้อยู่ที่เขาคนเดียว"}}}},
  "R107": {"P2": {"title": "คุณเริ่มไม่อยากออกจากบ้าน", "s": "เช้านี้มีคนชวนไปช่วยงานที่ศาลา แต่คุณรู้สึกไม่อยากเจอใครเลย", "choices": {"A": {"t": "ฝืนออกไปช่วยสักชั่วโมง", "r": "คุณเหนื่อยแต่ได้หัวเราะกับคนอื่น กลับบ้านมาใจเบาขึ้น"}, "B": {"t": "อยู่บ้านพักให้เต็มที่", "r": "คุณได้พัก แต่วันนั้นยาวและเงียบ"}, "C": {"t": "ถามตัวเองว่าไม่อยากเจอใครเพราะอะไร", "r": "คุณรู้ว่าเหนื่อยจากข่าว ไม่ใช่จากคน คุณปิดวิทยุแล้วออกไปเดินเล่น"}, "D": {"t": "ชวนเพื่อนบ้านคนเดียวมานั่งคุยที่บ้าน", "r": "ได้คุยกับคนหนึ่งคนในที่ที่คุณสบายใจ บ่ายนั้นผ่านไปเร็ว"}}}, "P3": {"title": "คนที่หายไปจากวงคุย", "s": "คุณสังเกตว่าคนที่เคยมาวงคุยทุกสัปดาห์ไม่มาสามครั้งติด และไม่มีใครเห็นเขาที่ตลาดเลย", "choices": {"A": {"t": "แวะไปหาที่บ้าน", "r": "เขาเปิดประตูคุยด้วยสั้น ๆ แต่บอกว่าดีใจที่มีคนมาหา"}, "B": {"t": "เคารพว่าเขาอาจอยากอยู่คนเดียว", "r": "เขาได้พื้นที่ส่วนตัว แต่ไม่มีใครรู้ว่าเขาเป็นอย่างไรบ้าง"}, "C": {"t": "ถามคนใกล้ชิดว่าเกิดอะไรขึ้น", "r": "เขาป่วยและไม่อยากให้ใครรู้ คุณบอกพยาบาลให้แวะไปดู"}, "D": {"t": "จดรายชื่อคนที่หายจากวงแล้วแบ่งกันไปเยี่ยม", "r": "มีคนหายไปอีกสองคนที่ไม่มีใครสังเกต ทุกคนได้รับการเยี่ยมในสัปดาห์เดียว"}}}},
  "R108": {"P2": {"title": "มีกิจกรรมที่ศาลาแต่คุณไม่รู้", "s": "คืนนี้ศาลามีร้องเพลงและเล่นเกม คุณเพิ่งได้ยินเสียงหัวเราะลอยมาถึงบ้าน", "choices": {"A": {"t": "เดินไปร่วม แม้จะไปช้า", "r": "คนในวงหันมาทักและเว้นที่ให้ คุณร้องเพลงที่รู้จักไปด้วย"}, "B": {"t": "อยู่บ้านพักผ่อนเงียบ ๆ", "r": "คุณได้พักเต็มที่ แต่พลาดคืนที่ทั้งซอยพูดถึง"}, "C": {"t": "ถามเพื่อนบ้านว่ามีกิจกรรมแบบนี้บ่อยไหม", "r": "มีทุกคืนวันเสาร์ คุณจดไว้ว่าจะไปครั้งหน้าตั้งแต่ต้น"}, "D": {"t": "เอาของว่างไปร่วม", "r": "ของว่างของคุณหมดในสิบนาที และมีคนชวนให้มาอีกสัปดาห์หน้า"}}}, "P3": {"title": "กิจกรรมที่ศาลาไม่มีใครมา", "s": "ศาลาจัดกิจกรรมร้องเพลงมาสองสัปดาห์ แต่คนมาน้อยลงทุกครั้ง ผู้จัดเริ่มท้อ", "choices": {"A": {"t": "ไปช่วยจัดและชวนเด็ก ๆ มาร่วม", "r": "เด็กหัวเราะเสียงดังที่สุดในรอบเดือน คุณเหนื่อยแต่ยิ้มทั้งคืน"}, "B": {"t": "อยู่บ้านพักผ่อนเงียบ ๆ", "r": "คุณได้พักเต็มที่ แต่กิจกรรมอาจถูกยกเลิก"}, "C": {"t": "ถามคนที่ไม่มาว่าเพราะอะไร", "r": "เวลาจัดตรงกับรอบชาร์จไฟ คนเลยมาไม่ได้ คุณเสนอให้เลื่อนเวลา"}, "D": {"t": "เลื่อนเวลาแล้วประกาศผ่านวิทยุชุมชน", "r": "คืนวันเสาร์ถัดมาศาลาเต็ม และกิจกรรมจัดต่อทุกสัปดาห์"}}}},
  "R109": {"P2": {"title": "ข่าวดีที่คุณได้ยินคนเดียว", "s": "วิทยุของคุณรายงานว่าอาจมีการเจรจาสงบศึก ข่าวยังไม่ยืนยัน และยังไม่มีใครในซอยรู้", "choices": {"A": {"t": "เล่าให้เพื่อนบ้านฟังพร้อมบอกว่ายังไม่แน่", "r": "บรรยากาศดีขึ้นทั้งซอย และไม่มีใครทิ้งเสบียงที่เก็บไว้"}, "B": {"t": "เก็บไว้คนเดียวจนกว่าจะยืนยัน", "r": "คุณไม่ทำให้ใครหวังลม ๆ แล้ง ๆ แต่ก็ไม่ได้ร่วมยินดีกับใคร"}, "C": {"t": "ฟังต่อเพื่อหาว่าใครพูด", "r": "ข่าวมาจากรายการต่างประเทศที่พูดถึงการเจรจา ไม่ใช่ข้อตกลง คุณจดไว้ตามจริง"}, "D": {"t": "ส่งข่าวให้สถานีชุมชนอ่านพร้อมระดับความแน่ใจ", "r": "คนฟังได้ทั้งความหวังและความจริง และรู้ว่าข่าวนี้มาจากวิทยุของคุณ"}}}, "P3": {"title": "ข่าวดีที่ถูกตัดต่อ", "s": "ข่าวดีว่าสงครามจะสงบส่งต่อกันพร้อมคลิปเสียง คุณสังเกตว่าเสียงในคลิปขาดเป็นช่วง ๆ", "choices": {"A": {"t": "ให้ทุกคนดีใจไปก่อนแต่อย่าเพิ่งเปลี่ยนแผน", "r": "บรรยากาศดีขึ้นทั้งซอย และไม่มีใครทิ้งเสบียงที่เก็บไว้"}, "B": {"t": "ไม่ส่งต่อและไม่พูดถึง", "r": "คุณไม่ผิดหวังถ้าข่าวไม่จริง แต่คลิปยังส่งต่อกันไปเรื่อย ๆ"}, "C": {"t": "หาคลิปฉบับเต็มมาเทียบ", "r": "ฉบับเต็มพูดว่าการเจรจาอาจเริ่มเดือนหน้า ไม่ใช่สงครามจะจบ คุณบอกต่อตามจริง"}, "D": {"t": "ขอสถานีชุมชนอ่านข่าวพร้อมระดับความแน่ใจ", "r": "คนฟังได้ทั้งความหวังและความจริง ไม่มีใครเข้าใจผิด"}}}},
  "R110": {"P2": {"title": "ไม่มีชื่อคุณในเรื่องเล่า", "s": "ชุมชนรำลึกวันแรกของสงคราม ทุกคนเล่าเรื่องคนที่ช่วยกัน แต่ไม่มีใครพูดถึงบ้านคุณเลย", "choices": {"A": {"t": "เล่าเรื่องคนที่เคยช่วยคุณในวันแรก", "r": "เรื่องของคุณทำให้คนอื่นเล่าตาม และเริ่มมีคนพูดถึงสิ่งที่คุณทำบ้าง"}, "B": {"t": "กลับบ้านเงียบ ๆ", "r": "คุณไม่ต้องเจ็บปวดกับความทรงจำ แต่ก็ไม่ได้อยู่ในวงของชุมชน"}, "C": {"t": "ถามตัวเองว่าเคยช่วยใครบ้าง", "r": "คุณนึกได้หลายครั้งที่ช่วยโดยไม่มีใครรู้ และรู้สึกสงบขึ้น"}, "D": {"t": "เสนอช่วยทำป้ายจารึกชื่อที่ศาลา", "r": "คุณได้ทำงานกับคนในซอย และชื่อคุณอยู่ในรายชื่อคนที่ช่วยทำป้าย"}}}, "P3": {"title": "รายชื่อคนที่ช่วยกันไม่ครบ", "s": "ชุมชนรำลึกวันแรก และจะทำป้ายจารึกชื่อคนที่ช่วยเหลือกัน คุณเห็นว่ารายชื่อขาดไปหลายคน", "choices": {"A": {"t": "เล่าเรื่องคนที่เคยช่วยคุณในวันแรก", "r": "เรื่องของคุณทำให้คนอื่นเล่าตาม ชื่อที่ขาดเริ่มถูกนึกได้"}, "B": {"t": "ไม่ไปร่วม ยังไม่พร้อมนึกถึง", "r": "คุณไม่ต้องเจ็บปวดกับความทรงจำ แต่รายชื่อก็ยังขาดอยู่"}, "C": {"t": "เทียบรายชื่อกับบันทึกที่คุณจดมาตลอด", "r": "พบชื่อที่ตกหล่นสิบสองคน รวมถึงคนที่ย้ายออกไปแล้ว"}, "D": {"t": "เปิดให้ทุกคนเพิ่มชื่อก่อนทำป้าย", "r": "ป้ายไม้มีชื่อครบกว่าเดิมเกือบเท่าตัว ใครผ่านก็หยุดอ่าน"}}}},

  "R114": {"P2": {"title": "ถังน้ำฝนของคุณเต็ม", "s": "ถังน้ำฝนที่คุณตั้งไว้เต็มทุกใบหลังฝนตก เพื่อนบ้านที่ไม่มีถังยืนมองจากรั้ว", "choices": {"A": {"t": "ให้เพื่อนบ้านมาตักไปใช้", "r": "เพื่อนบ้านได้น้ำล้างของ ถังของคุณเหลือครึ่งเดียว"}, "B": {"t": "ปิดฝาถังเก็บไว้ใช้เอง", "r": "น้ำของคุณพอใช้ทั้งสัปดาห์ เพื่อนบ้านเดินกลับไปมือเปล่า"}, "C": {"t": "ดูว่าน้ำในถังใช้ได้นานแค่ไหน", "r": "ถ้าปิดฝาดีน้ำอยู่ได้สองสัปดาห์ คุณรู้ว่าแบ่งได้แค่ไหน"}, "D": {"t": "สอนเพื่อนบ้านตั้งรางรองน้ำของตัวเอง", "r": "สองบ้านตั้งรางได้ก่อนฝนรอบหน้า ไม่ต้องมาขอน้ำคุณ"}}}, "P3": {"title": "น้ำฝนจากหลังคาไหนสะอาด", "s": "หลายบ้านรองน้ำฝนไว้ดื่ม คุณสังเกตว่าน้ำจากบางหลังคามีตะกอนและสีขุ่น", "choices": {"A": {"t": "ช่วยกรองน้ำให้บ้านที่น้ำขุ่น", "r": "สามบ้านได้น้ำใส คุณใช้ผ้ากรองไปหลายผืน"}, "B": {"t": "ใช้เฉพาะน้ำจากหลังคาบ้านคุณ", "r": "น้ำของคุณใส แต่บ้านอื่นยังดื่มน้ำขุ่น"}, "C": {"t": "เทียบน้ำจากหลังคาทีละบ้าน", "r": "หลังคาสังกะสีเก่าทำให้น้ำขุ่น หลังคากระเบื้องได้น้ำใส คุณบอกทุกบ้าน"}, "D": {"t": "ให้ทุกบ้านรองน้ำดื่มจากหลังคาที่ดีที่สุด", "r": "ศาลากลายเป็นจุดรองน้ำดื่ม ทุกบ้านได้น้ำใสเหมือนกัน"}}}},
  "R115": {"P2": {"title": "พยากรณ์ที่คุณฟังคนเดียว", "s": "วิทยุของคุณบอกว่าพายุจะเข้าพรุ่งนี้ แต่เพื่อนบ้านยังไม่มีใครรู้", "choices": {"A": {"t": "เดินบอกบ้านข้าง ๆ ให้เตรียมตัว", "r": "สามบ้านเก็บของทัน คุณเตรียมบ้านตัวเองเสร็จตอนดึก"}, "B": {"t": "เตรียมบ้านตัวเองให้พร้อม", "r": "บ้านคุณพร้อมรับพายุ บ้านอื่นรู้ตอนลมเริ่มแรงแล้ว"}, "C": {"t": "ฟังซ้ำว่าพายุเข้าช่วงไหน", "r": "พายุเข้าบ่ายพรุ่งนี้ คุณมีเวลาเตรียมทั้งเช้าโดยไม่ต้องรีบ"}, "D": {"t": "บอกสถานีชุมชนให้ประกาศต่อ", "r": "ทั้งซอยเตรียมตัวทัน และรู้ว่าข่าวนี้มาจากวิทยุของคุณ"}}}, "P3": {"title": "สมุดบันทึกอากาศ", "s": "คุณจดอากาศทุกวันมาหลายสัปดาห์ วันนี้ลมเปลี่ยนทิศแบบที่เคยเกิดก่อนพายุครั้งก่อน", "choices": {"A": {"t": "บอกชาวสวนให้เก็บผลผลิตก่อน", "r": "ชาวสวนเก็บผักชุดแรกทัน พายุเข้าจริงตอนค่ำ"}, "B": {"t": "เตรียมบ้านตัวเองไว้ก่อน", "r": "บ้านคุณพร้อม แต่หลายบ้านยังไม่รู้"}, "C": {"t": "เทียบกับบันทึกครั้งก่อนให้แน่ใจ", "r": "ลม ความชื้น และเมฆตรงกับครั้งก่อนทุกอย่าง คุณมั่นใจว่าพายุจะเข้า"}, "D": {"t": "ขอสถานีชุมชนประกาศพร้อมเหตุผล", "r": "ทั้งซอยเตรียมตัวทัน พายุผ่านไปโดยไม่มีบ้านไหนเสียหายหนัก"}}}},
  "R116": {"P2": {"title": "หน้ากากของคุณเหลือน้อย", "s": "ฝุ่นหนาทึบหลายวันติด หน้ากากที่คุณเก็บไว้เหลือไม่กี่ชิ้น และร้านในซอยไม่มีขาย", "choices": {"A": {"t": "แบ่งให้คนที่ต้องออกไปทำงาน", "r": "สามคนได้หน้ากาก คุณต้องใช้ผ้าชุบน้ำแทน"}, "B": {"t": "เก็บไว้ใช้เอง ไม่ออกจากบ้าน", "r": "คุณไม่ไอเลย แต่ธุระข้างนอกค้างหลายวัน"}, "C": {"t": "ดูว่าฝุ่นจางช่วงไหนของวัน", "r": "ฝุ่นจางช่วงบ่ายสาม คุณออกไปทำธุระช่วงนั้นโดยใช้หน้ากากชิ้นเดียว"}, "D": {"t": "ทำผ้ากรองฝุ่นแลกกับของจากเพื่อนบ้าน", "r": "คุณเย็บผ้ากรองแลกได้ข้าวกับไข่ ทุกบ้านมีของกันฝุ่น"}}}, "P3": {"title": "ฝุ่นมาจากไหน", "s": "ฝุ่นหนาทึบติดต่อกันหลายวัน คุณสังเกตว่าฝุ่นหนาที่สุดตอนลมพัดมาจากทางทิศเหนือ", "choices": {"A": {"t": "แบ่งหน้ากากให้คนที่ต้องออกไปข้างนอก", "r": "สามคนได้หน้ากากไปใช้ หน้ากากของคุณเหลือน้อยลง"}, "B": {"t": "ปิดบ้านไม่ออกไปไหน", "r": "ในบ้านอากาศดีขึ้น แต่ธุระข้างนอกต้องเลื่อน"}, "C": {"t": "ตามทิศลมไปดูต้นทาง", "r": "มีคนเผาขยะกองใหญ่ที่ลานร้างทางเหนือ คุณรู้แล้วว่าฝุ่นมาจากไหน"}, "D": {"t": "แจ้งผู้นำชุมชนให้หยุดการเผา", "r": "การเผาหยุดลง ฝุ่นจางภายในสองวัน"}}}},
  "R117": {"P2": {"title": "บ้านคุณเริ่มมีเชื้อรา", "s": "ฝนตกหลายวัน บ้านที่ปิดมิดชิดตลอดเริ่มมีเชื้อราขึ้นตามมุมผนัง", "choices": {"A": {"t": "ขอยืมที่ตากผ้าในศาลาร่วมกับคนอื่น", "r": "ผ้าแห้งทันใช้ คุณได้คุยกับคนที่ศาลาเป็นครั้งแรกในรอบหลายวัน"}, "B": {"t": "เช็ดเชื้อราแล้วปิดบ้านต่อ", "r": "ผนังสะอาดชั่วคราว ไม่กี่วันเชื้อราก็กลับมา"}, "C": {"t": "หาว่าความชื้นเข้าทางไหน", "r": "น้ำซึมจากรางน้ำที่อุด คุณลอกรางแล้วผนังเริ่มแห้ง"}, "D": {"t": "ชวนช่างในซอยมาดูหลายบ้านพร้อมกัน", "r": "ช่างลอกรางให้สามบ้านในบ่ายเดียว ทุกบ้านช่วยค่าแรงคนละนิด"}}}, "P3": {"title": "ผ้าอับเพราะอะไร", "s": "ผ้าที่ตากไว้ไม่แห้งหลายวัน บางบ้านเริ่มมีผื่นคัน คนสงสัยว่ามาจากผ้าอับ", "choices": {"A": {"t": "ให้บ้านที่มีเด็กอ่อนใช้ที่ตากในร่มของคุณ", "r": "ผ้าอ้อมเด็กแห้งทัน พื้นที่ในบ้านคุณแคบลง"}, "B": {"t": "ตากเฉพาะผ้าที่จำเป็นของคุณ", "r": "ผ้าจำเป็นแห้ง ที่เหลือรอวันแดดออก"}, "C": {"t": "ถามพยาบาลว่าผื่นมาจากอะไร", "r": "ผื่นมาจากผ้าที่ยังชื้นตอนใส่ พยาบาลแนะนำให้รีดผ้าด้วยเตารีดถ่านก่อนใส่"}, "D": {"t": "จัดศาลาเป็นที่ตากผ้าที่มีลมผ่าน", "r": "ศาลามีลมผ่านและหลังคา ทุกบ้านผลัดกันตาก ผื่นลดลง"}}}},
  "R118": {"P2": {"title": "น้ำขังรอบบ้านคุณ", "s": "น้ำขังรอบบ้านคุณหลังฝนตกหนัก ร่องระบายน้ำของซอยไม่ไหลมาทางนี้", "choices": {"A": {"t": "ช่วยขุดร่องให้ทั้งแถวไหลออก", "r": "น้ำลดทั้งแถว คุณเปื้อนโคลนทั้งวัน"}, "B": {"t": "ทำคันดินกันน้ำรอบบ้านคุณ", "r": "บ้านคุณแห้ง แต่น้ำไหลไปขังหน้าบ้านข้าง ๆ แทน"}, "C": {"t": "ดูว่าน้ำติดตรงไหน", "r": "ท่อระบายมีขยะอุดจุดเดียว คุณดึงออก น้ำเริ่มไหล"}, "D": {"t": "ชวนบ้านแถวเดียวกันลอกท่อพร้อมกัน", "r": "ท่อทั้งแถวโล่ง น้ำลดในครึ่งวัน"}}}, "P3": {"title": "น้ำขังจุดเดิมทุกครั้ง", "s": "น้ำขังรอบที่พักหลังฝนตกหนักอีกแล้ว คุณจำได้ว่าขังที่จุดเดิมทุกครั้ง", "choices": {"A": {"t": "ช่วยขุดร่องระบายน้ำชั่วคราว", "r": "น้ำลดลง คุณเปื้อนโคลนไปทั้งตัว"}, "B": {"t": "เลี่ยงทางนั้นและกางมุ้งนอน", "r": "คุณไม่โดนยุงกัด แต่น้ำยังขังอยู่"}, "C": {"t": "วัดระดับพื้นตามแนวท่อ", "r": "ท่อช่วงหนึ่งทรุดต่ำกว่าปลายทาง น้ำจึงไหลย้อน คุณรู้ว่าต้องยกท่อช่วงไหน"}, "D": {"t": "ยกท่อช่วงที่ทรุดร่วมกับทั้งซอย", "r": "ท่อถูกยกในวันเดียว ฝนครั้งต่อไปไม่มีน้ำขังอีก"}}}},
  "R119": {"P2": {"title": "คืนที่หนาวที่สุด", "s": "อากาศเย็นลงอย่างรวดเร็ว ผ้าห่มที่คุณเก็บไว้มีเหลือหลายผืน ขณะที่หลายบ้านไม่พอ", "choices": {"A": {"t": "แบ่งผ้าห่มให้บ้านที่มีคนแก่", "r": "ยายข้างบ้านนอนอุ่น คุณยังมีพอใช้เอง"}, "B": {"t": "เก็บไว้ใช้เองให้อุ่นเต็มที่", "r": "คุณนอนอุ่นทั้งคืน เช้ามาได้ยินว่ามีคนแก่ไม่สบายหลายบ้าน"}, "C": {"t": "นับว่าต้องใช้กี่ผืนจริง", "r": "คุณใช้แค่สองผืน อีกสามผืนให้คนอื่นได้โดยไม่เดือดร้อน"}, "D": {"t": "ให้ศาลาแจกตามความจำเป็น", "r": "ผ้าห่มของคุณไปถึงบ้านที่ขาดที่สุด ผ่านคนที่รู้ว่าใครต้องการ"}}}, "P3": {"title": "ใครหนาวที่สุดคืนนี้", "s": "อากาศเย็นลงฉับพลัน คุณรู้จากบันทึกของชุมชนว่าบ้านไหนมีคนแก่และเด็กเล็ก", "choices": {"A": {"t": "แบ่งผ้าห่มให้บ้านที่มีคนแก่ก่อน", "r": "ยายข้างบ้านนอนอุ่น คุณต้องห่มเสื้อหลายชั้นแทน"}, "B": {"t": "เตรียมของห่มของคุณก่อน", "r": "คุณอุ่นพอ แต่ยังไม่มีใครไปดูบ้านที่เสี่ยง"}, "C": {"t": "ไล่ดูรายชื่อบ้านที่เสี่ยงทีละหลัง", "r": "มีห้าบ้านที่ไม่มีผ้าห่มพอ คุณรู้ว่าต้องไปหาใครก่อน"}, "D": {"t": "ให้ศาลาแจกผ้าห่มตามรายชื่อ", "r": "บ้านที่เสี่ยงได้ผ้าห่มครบในคืนเดียว ไม่มีใครป่วยจากความหนาว"}}}},
  "R120": {"P2": {"title": "แปลงผักของคุณรอดคนเดียว", "s": "ฝนและแดดไม่ตรงฤดู แปลงหลายบ้านเสีย แต่แปลงในที่ร่มของคุณยังรอด", "choices": {"A": {"t": "แบ่งต้นกล้าที่รอดให้เพื่อนบ้าน", "r": "เพื่อนบ้านลงปลูกใหม่ได้ ต้นกล้าของคุณเหลือน้อยลง"}, "B": {"t": "เก็บไว้ปลูกต่อเอง", "r": "แปลงของคุณเต็ม ผักพอกินทั้งเดือน"}, "C": {"t": "ดูว่าทำไมแปลงคุณรอด", "r": "ร่มเงาไม้ช่วยกันแดดจัด คุณรู้วิธีที่ใช้ซ้ำได้"}, "D": {"t": "แลกต้นกล้ากับเมล็ดพันธุ์ชนิดอื่น", "r": "คุณได้เมล็ดสามชนิดใหม่ แปลงของคุณหลากหลายขึ้น"}}}, "P3": {"title": "ปฏิทินปลูกจากตัวเลข", "s": "ฝนและแดดไม่ตรงฤดู ชาวสวนรู้ว่าคุณจดสภาพอากาศมาตลอด จึงมาขอดูข้อมูล", "choices": {"A": {"t": "แบ่งต้นกล้าให้ชาวสวนที่แปลงเสีย", "r": "ชาวสวนลงปลูกได้ทันที ต้นกล้าของคุณเหลือน้อยลง"}, "B": {"t": "ปลูกตามข้อมูลของคุณเอง", "r": "แปลงของคุณได้ผลดี แปลงอื่นยังเดากันต่อ"}, "C": {"t": "หาช่วงที่ฝนตกจากบันทึกหลายสัปดาห์", "r": "ฝนตกทุกบ่ายช่วงกลางเดือน คุณบอกช่วงปลูกที่เหมาะได้แม่น"}, "D": {"t": "ทำปฏิทินปลูกใหม่ติดไว้ที่ศาลา", "r": "ทุกแปลงปลูกตามปฏิทินใหม่ ผลผลิตเสียน้อยกว่าทุกปี"}}}},
  "R124": {"P2": {"title": "ผู้ปกครองมาขอให้สอนถึงบ้าน", "s": "คุณไม่ได้ไปห้องเรียนชั่วคราวเลย ผู้ปกครองคนหนึ่งจึงพาลูกมาขอให้สอนเลขถึงหน้าบ้าน", "choices": {"A": {"t": "รับสอนทันที", "r": "เด็กเข้าใจการหารในหนึ่งสัปดาห์ ผู้ปกครองเอาผักมาให้เป็นการขอบคุณ"}, "B": {"t": "บอกว่าไม่มีเวลา", "r": "คุณมีเวลาทำงานของตัวเอง เด็กยังติดอยู่ที่บทเดิม"}, "C": {"t": "ดูว่าเด็กติดตรงไหน", "r": "เด็กไม่เข้าใจแค่เรื่องเดียว อธิบายสิบนาทีก็ทำต่อเองได้"}, "D": {"t": "สอนแลกกับผักจากสวนของเขา", "r": "สอนสัปดาห์ละสองวัน คุณได้ผักสดทุกสัปดาห์"}}}, "P3": {"title": "แบบฝึกหัดที่ผิด", "s": "ผู้ปกครองถือสมุดลูกมาให้ดู คุณเห็นว่าเฉลยในแบบฝึกหัดที่แจกกันผิดหลายข้อ", "choices": {"A": {"t": "นั่งสอนเด็กใหม่ทั้งบท", "r": "เด็กเข้าใจถูกต้องภายในสัปดาห์ คุณใช้เวลาไปหลายบ่าย"}, "B": {"t": "บอกผู้ปกครองแล้วให้ไปจัดการเอง", "r": "ผู้ปกครองรู้ว่าเฉลยผิด แต่ไม่รู้ว่าคำตอบที่ถูกคืออะไร"}, "C": {"t": "ตรวจทั้งเล่มว่าผิดกี่ข้อ", "r": "ผิดเจ็ดข้อจากสามสิบ คุณเขียนเฉลยที่ถูกแนบไว้"}, "D": {"t": "ส่งเฉลยที่แก้แล้วให้ห้องเรียนทุกห้อง", "r": "ทุกห้องใช้เฉลยเดียวกันที่ตรวจแล้ว เด็กไม่ต้องจำของผิด"}}}},
  "R125": {"P2": {"title": "ห้องเรียนอยู่ไกลจากบ้านคุณ", "s": "ห้องเรียนเล็ก ๆ เปิดที่ศาลา ครูขอให้คุณมาช่วย แต่คุณไม่อยากทิ้งงานที่บ้าน", "choices": {"A": {"t": "ไปช่วยสอนครึ่งวัน", "r": "เด็กได้ความช่วยเหลือมากขึ้น งานที่บ้านคุณช้าไปครึ่งวัน"}, "B": {"t": "อยู่ทำงานที่บ้าน", "r": "งานของคุณเสร็จ ห้องเรียนยังขาดคนช่วย"}, "C": {"t": "ถามครูว่าขาดอะไรที่ทำจากบ้านได้", "r": "ครูขาดสื่อการสอน คุณทำบัตรคำจากกระดาษเหลือใช้ได้ที่บ้าน"}, "D": {"t": "รับทำของให้ห้องเรียนแลกกับข้าวกลางวัน", "r": "คุณทำกระดานให้ห้องเรียน และได้กินข้าวกับครัวกลางทุกวัน"}}}, "P3": {"title": "ห้องเรียนไม่รู้ว่าเด็กมาครบไหม", "s": "ห้องเรียนเล็ก ๆ เริ่มแล้ว แต่ไม่มีใครจดว่าเด็กคนไหนมาบ้าง บางคนหายไปหลายวันไม่มีใครสังเกต", "choices": {"A": {"t": "อาสาเป็นผู้ช่วยครู", "r": "เด็กได้ความช่วยเหลือมากขึ้น คุณได้เห็นพวกเขาเรียนรู้ทุกวัน"}, "B": {"t": "ไม่ยุ่ง ให้ครูจัดการเอง", "r": "คุณมีเวลาทำงานต่อ แต่ยังไม่มีใครรู้ว่าเด็กคนไหนหายไป"}, "C": {"t": "ทำสมุดเช็กชื่อเด็กทุกวัน", "r": "พบเด็กสองคนหายไปเพราะป่วย ครูแวะไปเยี่ยมได้ทันที"}, "D": {"t": "ให้ผู้ปกครองแจ้งครูเมื่อเด็กไม่มา", "r": "ครูรู้ทุกวันว่าใครไม่มาเพราะอะไร ไม่มีเด็กหายเงียบอีก"}}}},
  "R126": {"P2": {"title": "เครื่องเขียนที่คุณเก็บไว้", "s": "ห้องเรียนขาดดินสอและกระดาษ คุณมีกล่องเครื่องเขียนเก่าเก็บไว้เต็มตู้", "choices": {"A": {"t": "ยกให้ห้องเรียนทั้งกล่อง", "r": "เด็กทุกคนได้เขียนพร้อมกัน ตู้ของคุณว่างลง"}, "B": {"t": "เก็บไว้ใช้เอง", "r": "ของของคุณอยู่ครบ เด็กยังต้องผลัดกันใช้ดินสอ"}, "C": {"t": "นับว่าคุณต้องใช้จริงเท่าไร", "r": "คุณใช้แค่ไม่กี่แท่ง ที่เหลือให้ห้องเรียนได้โดยไม่เดือดร้อน"}, "D": {"t": "แลกเครื่องเขียนกับไข่จากผู้ปกครอง", "r": "ห้องเรียนได้เครื่องเขียน คุณได้ไข่ทุกสัปดาห์"}}}, "P3": {"title": "เครื่องเขียนบริจาคหายไปไหน", "s": "ซอยบริจาคดินสอเต็มกล่องเมื่อสัปดาห์ก่อน แต่วันนี้ห้องเรียนบอกว่าดินสอไม่พออีกแล้ว", "choices": {"A": {"t": "ให้ดินสอที่บ้านคุณไปก่อน", "r": "เด็กได้เขียนวันนี้ ของที่บ้านคุณหมด"}, "B": {"t": "ไม่ให้เพิ่มจนกว่าจะรู้ว่าของเก่าไปไหน", "r": "ของของคุณยังอยู่ แต่เด็กต้องผลัดกันใช้ไปก่อน"}, "C": {"t": "ถามครูว่าดินสอถูกใช้อย่างไร", "r": "เด็กเอาดินสอกลับบ้านทุกวันแล้วลืมเอามา คุณเสนอให้เก็บไว้ที่ห้องเรียน"}, "D": {"t": "ทำกล่องดินสอประจำห้องพร้อมจดยืมคืน", "r": "ดินสออยู่ครบทุกวัน กล่องเดิมพอใช้ไปอีกหลายเดือน"}}}},
  "R127": {"P2": {"title": "เด็กมาทะเลาะหน้าบ้านคุณ", "s": "เด็กสองคนแย่งของเล่นกันหน้าบ้านคุณจนเสียงดังทั้งซอย", "choices": {"A": {"t": "ออกไปแยกและคุยกับทีละคน", "r": "ทั้งคู่ยอมขอโทษกัน และนั่งเล่นด้วยกันต่อ"}, "B": {"t": "ปิดประตูหน้าต่าง ไม่ยุ่ง", "r": "บ้านคุณเงียบลง เด็กเถียงกันต่ออีกพักใหญ่"}, "C": {"t": "ถามว่าเรื่องเริ่มจากอะไร", "r": "คนหนึ่งยืมแล้วไม่คืน พอรู้ต้นเรื่องก็แก้ได้ตรงจุด"}, "D": {"t": "พาไปส่งที่ห้องเรียนให้ครูช่วยดู", "r": "ครูให้ทั้งคู่ช่วยกันทำงานชิ้นเดียว พอเย็นก็กลับมาเป็นเพื่อนกัน"}}}, "P3": {"title": "ทะเลาะกันซ้ำทุกบ่าย", "s": "เด็กในห้องเรียนทะเลาะกันทุกบ่าย คุณสังเกตว่าเกิดเวลาเดียวกันทุกวัน", "choices": {"A": {"t": "แยกเด็กออกมาคุยทีละคน", "r": "ทั้งคู่ยอมขอโทษ แต่บ่ายพรุ่งนี้ก็อาจเกิดอีก"}, "B": {"t": "ยึดของที่แย่งกันไว้", "r": "การทะเลาะหยุดวันนี้ แต่ต้นเหตุยังอยู่"}, "C": {"t": "ดูว่าบ่ายมีอะไรต่างจากช่วงเช้า", "r": "เด็กหิวเพราะไม่ได้กินข้าวกลางวัน ทะเลาะกันตอนบ่ายเพราะหิว"}, "D": {"t": "ขอครัวกลางส่งข้าวกลางวันให้ห้องเรียน", "r": "เด็กได้กินข้าวก่อนเรียนบ่าย การทะเลาะหายไปเกือบหมด"}}}},
  "R128": {"P2": {"title": "ครูเก่าขอใช้บ้านคุณสอน", "s": "ครูที่เคยสอนในตำบลกลับมา และขอใช้ห้องหน้าบ้านคุณเป็นห้องเรียน เพราะกว้างและกันฝนได้", "choices": {"A": {"t": "ให้ใช้ห้องหน้าบ้าน", "r": "เด็กได้เรียนในที่กันฝน บ้านคุณเสียงดังทุกเช้า"}, "B": {"t": "ปฏิเสธ แนะนำให้ใช้ศาลา", "r": "บ้านคุณเงียบเหมือนเดิม ครูต้องสอนในศาลาที่ฝนสาด"}, "C": {"t": "ถามว่าจะใช้วันไหน กี่ชั่วโมง", "r": "ใช้แค่สามเช้าต่อสัปดาห์ คุณรับได้โดยไม่กระทบงาน"}, "D": {"t": "ให้ใช้ แลกกับให้ครูสอนหนังสือคุณด้วย", "r": "คุณได้เรียนภาษาอังกฤษตอนบ่าย ห้องหน้าบ้านกลายเป็นห้องเรียน"}}}, "P3": {"title": "ครูที่ไม่มีใครรู้จัก", "s": "มีคนบอกว่าเคยเป็นครูและอยากสอนเด็ก แต่ไม่มีใครในตำบลจำเขาได้", "choices": {"A": {"t": "พาเขาไปดูห้องเรียนชั่วคราว", "r": "เขาสอนได้ดี เด็กชอบ แต่ผู้ปกครองบางคนยังกังวล"}, "B": {"t": "บอกว่ามีคนสอนอยู่แล้ว", "r": "เขากลับไปโดยไม่ได้ช่วย ห้องเรียนยังขาดคน"}, "C": {"t": "ถามว่าเคยสอนที่โรงเรียนไหน แล้วโทรถาม", "r": "โรงเรียนเดิมยืนยันว่าเขาเป็นครูจริง ผู้ปกครองสบายใจ"}, "D": {"t": "ให้เขาสอนโดยมีผู้ปกครองนั่งด้วยช่วงแรก", "r": "ผู้ปกครองเห็นการสอนจริง หนึ่งสัปดาห์ต่อมาทุกคนไว้ใจเขา"}}}},
  "R129": {"P2": {"title": "ทักษะที่คุณฝึกเองมานาน", "s": "ชุมชนอยากให้เด็กเรียนทักษะชีวิต และรู้ว่าคุณต้มน้ำ ทำแผล และปลูกผักเองมาตลอด", "choices": {"A": {"t": "สอนเด็กทุกอย่างที่คุณรู้", "r": "เด็กทำแผลเบื้องต้นได้ภายในหนึ่งสัปดาห์ คุณเหนื่อยแต่ภูมิใจ"}, "B": {"t": "ไม่รับสอน บอกว่าทำเป็นแค่สำหรับตัวเอง", "r": "คุณมีเวลาของตัวเองเต็มที่ ห้องเรียนต้องหาคนอื่น"}, "C": {"t": "ถามว่าเด็กควรรู้อะไรก่อน", "r": "ผู้ปกครองอยากให้เรียนต้มน้ำก่อน คุณสอนเรื่องเดียวได้ตรงความต้องการ"}, "D": {"t": "สอนสัปดาห์ละครั้งที่สวนของคุณ", "r": "เด็กมาช่วยรดผักทุกสัปดาห์ ได้เรียนจากของจริง"}}}, "P3": {"title": "ทักษะที่เด็กควรเรียนก่อน", "s": "มีคนเสนอให้เด็กเรียนทักษะชีวิต แต่แต่ละคนอยากให้สอนคนละเรื่อง จนตกลงกันไม่ได้", "choices": {"A": {"t": "สอนทักษะที่คุณถนัดไปก่อน", "r": "เด็กทำแผลเบื้องต้นได้ภายในหนึ่งสัปดาห์"}, "B": {"t": "รอให้ตกลงกันได้ก่อน", "r": "คุณไม่ต้องเสียแรง แต่เด็กยังไม่ได้เรียนอะไร"}, "C": {"t": "ถามว่าเรื่องไหนเกิดในซอยบ่อยที่สุด", "r": "แผลเล็กกับท้องเสียเกิดบ่อยที่สุด หลักสูตรจึงเริ่มจากทำแผลและต้มน้ำ"}, "D": {"t": "ชวนผู้ใหญ่หลายคนสอนตามลำดับที่ตกลง", "r": "ช่างไฟ พยาบาล และชาวสวนผลัดกันสอน เด็กได้ทักษะครบ"}}}},
  "R130": {"P2": {"title": "จะเรียนที่บ้านหรือที่ศาลา", "s": "ผู้ปกครองถกกันว่าจะให้เด็กเรียนเป็นกลุ่มหรือแยกเรียนบ้านใครบ้านมัน และถามความเห็นคุณ", "choices": {"A": {"t": "ฟังทุกฝ่ายแล้วหาทางผสม", "r": "ตกลงเรียนกลุ่มสามวัน เรียนบ้านสองวัน ทุกฝ่ายรับได้"}, "B": {"t": "บอกว่าแต่ละบ้านควรตัดสินใจเอง", "r": "ที่ประชุมจบเร็ว เด็กบางบ้านไม่ได้เรียนกับเพื่อนอีก"}, "C": {"t": "ถามเด็ก ๆ ว่าอยากเรียนแบบไหน", "r": "เด็กส่วนใหญ่อยากเจอเพื่อน คำตอบนี้ช่วยให้ผู้ใหญ่ตัดสินใจง่ายขึ้น"}, "D": {"t": "เสนอให้โหวตและทบทวนทุกเดือน", "r": "ได้ข้อสรุปที่ทุกคนยอมรับ และปรับได้ถ้าไม่เวิร์ก"}}}, "P3": {"title": "ข้อมูลก่อนเลือกรูปแบบเรียน", "s": "ผู้ปกครองเห็นต่างกันเรื่องรูปแบบเรียน และขอให้คุณช่วยสรุป เพราะคุณจดการเรียนมาตลอด", "choices": {"A": {"t": "ฟังทุกฝ่ายแล้วหาทางผสม", "r": "ตกลงเรียนกลุ่มสามวัน เรียนบ้านสองวัน ทุกฝ่ายรับได้"}, "B": {"t": "สรุปข้อมูลให้แล้วไม่ร่วมตัดสิน", "r": "ผู้ปกครองได้ข้อมูล แต่ยังเถียงกันต่ออีกหลายวัน"}, "C": {"t": "เทียบผลการเรียนของเด็กแต่ละแบบ", "r": "เด็กที่เรียนกลุ่มก้าวหน้ากว่า แต่บางคนเรียนบ้านได้ดีกว่า ทุกคนเห็นภาพชัด"}, "D": {"t": "ให้โหวตจากข้อมูลและทบทวนทุกเดือน", "r": "ได้ข้อสรุปที่ทุกคนยอมรับ และปรับได้เมื่อข้อมูลเปลี่ยน"}}}},
  "R134": {"P2": {"title": "เพื่อนบ้านอยากใช้แปลงของคุณ", "s": "แปลงผักหลังบ้านคุณดินดีที่สุดในซอย เพื่อนบ้านถามว่าขอแบ่งที่ปลูกได้ไหม", "choices": {"A": {"t": "แบ่งที่ส่วนที่ดีให้เขา", "r": "เขาดีใจมาก คุณได้แปลงที่แดดน้อยกว่า"}, "B": {"t": "ขอใช้แปลงทั้งหมดเอง", "r": "คุณมีที่ปลูกครบ เพื่อนบ้านต้องหาที่อื่น"}, "C": {"t": "ดูว่าคุณใช้พื้นที่จริงแค่ไหน", "r": "มีมุมหนึ่งที่คุณไม่เคยปลูก คุณแบ่งมุมนั้นให้ได้โดยไม่เสียอะไร"}, "D": {"t": "ให้ปลูกแลกกับช่วยรดน้ำแปลงคุณ", "r": "เขาปลูกในแปลงคุณและรดน้ำให้ทุกเช้า คุณมีเวลาเพิ่ม"}}}, "P3": {"title": "เส้นแบ่งแปลงไม่ตรง", "s": "เพื่อนบ้านขึงเชือกแบ่งแปลงใหม่ คุณเห็นว่าเชือกเอียงจนฝั่งหนึ่งได้ที่มากกว่า", "choices": {"A": {"t": "ให้เขาใช้ฝั่งที่มากกว่าไป", "r": "เขาดีใจมาก คุณได้แปลงที่เล็กกว่า"}, "B": {"t": "ใช้แปลงของคุณเหมือนเดิม", "r": "คุณมีพื้นที่ครบ แต่การแบ่งยังเอียงอยู่"}, "C": {"t": "วัดพื้นที่ใหม่ทั้งสองฝั่ง", "r": "เชือกเอียงไปหนึ่งเมตร คุณขยับให้ตรง ทั้งสองฝั่งได้แดดเท่ากัน"}, "D": {"t": "ตกลงปลูกพืชคนละชนิดแล้วแลกกัน", "r": "คุณปลูกผักบุ้ง เขาปลูกพริก ทั้งสองบ้านได้กินหลายอย่าง"}}}},
  "R135": {"P2": {"title": "แมลงลงแปลงคุณ", "s": "หนอนเริ่มกัดใบผักในแปลงของคุณ แปลงข้าง ๆ ก็เริ่มโดนเหมือนกัน", "choices": {"A": {"t": "ช่วยจับหนอนแปลงข้าง ๆ ด้วย", "r": "แปลงข้าง ๆ รอด แปลงของคุณเสียไปบ้าง"}, "B": {"t": "กางมุ้งคลุมแปลงตัวเอง", "r": "แปลงคุณรอดเกือบหมด หนอนย้ายไปกินแปลงข้าง ๆ แทน"}, "C": {"t": "ดูว่าหนอนออกตอนไหน", "r": "หนอนออกกลางคืน คุณจับตอนค่ำ ต้นกล้ารอดเกือบหมด"}, "D": {"t": "แลกน้ำหมักไล่แมลงกับเพื่อนบ้าน", "r": "คุณได้น้ำหมักแลกกับผัก ทั้งสองแปลงรอด"}}}, "P3": {"title": "แมลงชนิดใหม่", "s": "ใบผักมีรอยกัดที่ไม่เหมือนหนอนที่เคยเจอ ชาวสวนเริ่มฉีดน้ำหมักแต่ไม่ได้ผล", "choices": {"A": {"t": "ช่วยจับแมลงในแปลงเพื่อนบ้าน", "r": "แปลงข้าง ๆ รอดบางส่วน คุณยังไม่รู้ว่าเป็นแมลงอะไร"}, "B": {"t": "ย้ายต้นกล้าเข้าที่ร่ม", "r": "ต้นกล้ารอดได้ครึ่งหนึ่ง"}, "C": {"t": "เฝ้าดูตอนกลางคืนว่าเป็นตัวอะไร", "r": "เป็นทากที่ออกหลังฝน น้ำหมักไม่ได้ผล ต้องใช้ขี้เถ้าโรยรอบต้น"}, "D": {"t": "บอกชาวสวนทั้งซอยให้ใช้ขี้เถ้าพร้อมกัน", "r": "ทุกแปลงโรยขี้เถ้าคืนเดียวกัน ทากหายไปจากซอย"}}}},
  "R136": {"P2": {"title": "มีคนสงสัยผักของคุณ", "s": "มีข่าวลือว่าดินแถวนี้ปนเปื้อน คนที่เคยแลกผักกับคุณเริ่มไม่กล้ารับ", "choices": {"A": {"t": "ให้ผักฟรีกับคนที่ยังกล้ากิน", "r": "บางบ้านยังรับ ผักไม่เสียเปล่า แต่คุณไม่ได้อะไรแลกกลับ"}, "B": {"t": "หยุดแลก เก็บไว้กินเอง", "r": "บ้านคุณมีผักกินเต็มที่ แต่ไม่ได้ข้าวกับไข่จากการแลก"}, "C": {"t": "เอาดินไปให้เกษตรอำเภอตรวจ", "r": "ผลตรวจบอกว่าดินปกติ คุณติดผลไว้หน้าบ้าน คนกลับมาแลก"}, "D": {"t": "ชวนคนปลูกหลายบ้านส่งดินตรวจพร้อมกัน", "r": "ผลตรวจออกมาว่าปกติทุกแปลง ข่าวลือหยุด"}}}, "P3": {"title": "ผลตรวจดินที่ไม่มีใครเห็น", "s": "มีคนบอกว่ามีผลตรวจดินยืนยันว่าดินปนเปื้อน แต่ไม่มีใครเคยเห็นผลตรวจนั้นจริง", "choices": {"A": {"t": "แบ่งผักจากแปลงที่มั่นใจให้คนที่กลัว", "r": "บ้านที่กลัวยังมีผักกิน ผักของคุณเหลือน้อยลง"}, "B": {"t": "หยุดกินผักจากแปลงไว้ก่อน", "r": "คุณไม่เสี่ยง แต่ผักทั้งแปลงต้องทิ้ง"}, "C": {"t": "ขอดูผลตรวจจากคนที่เล่า", "r": "ไม่มีใครมีผลตรวจจริง ข่าวมาจากโรงงานคนละอำเภอ คุณบอกต่อตามจริง"}, "D": {"t": "ให้เกษตรอำเภอตรวจดินทุกแปลงพร้อมกัน", "r": "ผลตรวจออกมาว่าปกติ ทุกคนกลับมาปลูกได้อย่างสบายใจ"}}}},
  "R137": {"P2": {"title": "บ่อของคุณกับแปลงคนอื่น", "s": "หน้าแล้งน้ำรดผักขาด แต่บ่อหลังบ้านคุณยังมีน้ำ เพื่อนบ้านถามว่าขอตักไปรดผักได้ไหม", "choices": {"A": {"t": "ให้ตักไปรดได้", "r": "แปลงข้าง ๆ รอด บ่อของคุณลดลงเร็วกว่าที่คิด"}, "B": {"t": "รดเฉพาะแปลงคุณ", "r": "แปลงคุณเขียวทั้งแปลง แปลงข้าง ๆ เหี่ยว"}, "C": {"t": "วัดว่าบ่อลดลงวันละเท่าไร", "r": "บ่อพอแบ่งได้วันละสองถัง คุณบอกตัวเลขชัด ไม่มีใครตักเกิน"}, "D": {"t": "ให้ตักแลกกับผักครึ่งหนึ่งของแปลงเขา", "r": "แปลงเขารอด คุณได้ผักเพิ่มอีกชนิด"}}}, "P3": {"title": "น้ำรดผักหายไปไหน", "s": "ถังรดน้ำผักแห้งเร็วผิดปกติ ทั้งที่รดเท่าเดิมทุกวัน", "choices": {"A": {"t": "แบ่งน้ำจากบ้านคุณมาเติมก่อน", "r": "ผักรอดวันนี้ น้ำในบ้านคุณลดลง"}, "B": {"t": "รดเฉพาะต้นที่ใกล้เก็บ", "r": "ผักที่ใกล้เก็บรอด ต้นเล็กต้องปล่อยไป"}, "C": {"t": "ดูถังกับสายยางทีละจุด", "r": "ก้นถังร้าวเป็นเส้นเล็ก น้ำซึมออกทั้งคืน คุณอุดได้ด้วยชันยา"}, "D": {"t": "ต่อน้ำทิ้งจากหลายบ้านมารดผักร่วมกัน", "r": "น้ำใช้แล้วจากหลายบ้านพอรดทั้งแปลง"}}}},
  "R138": {"P2": {"title": "ผลผลิตเต็มแปลงคุณ", "s": "ผักชุดแรกในแปลงของคุณโตพร้อมกันหมด มากกว่าที่คุณกินได้ทัน", "choices": {"A": {"t": "แบ่งให้บ้านที่ขาด", "r": "สามบ้านได้ผักสดครั้งแรกในรอบเดือน"}, "B": {"t": "ตากแห้งเก็บไว้กินเอง", "r": "คุณมีผักแห้งพอทั้งเดือน แต่ใช้เวลาตากทั้งสัปดาห์"}, "C": {"t": "เก็บทีละต้นที่โตเต็มที่", "r": "ได้ผักที่ดีที่สุด และต้นที่เหลือโตต่อได้"}, "D": {"t": "เอาไปแลกที่ตลาดแลกของ", "r": "ผักแลกได้ไข่ น้ำมัน และเกลือ"}}}, "P3": {"title": "ผักชุดแรกพร้อมไม่เท่ากัน", "s": "ผักชุดแรกใกล้เก็บ คุณจดไว้ว่าแต่ละแถวปลูกวันไหน จึงรู้ว่าแถวไหนพร้อมก่อน", "choices": {"A": {"t": "เก็บแถวที่พร้อมแบ่งให้บ้านที่ขาด", "r": "สามบ้านได้ผักสดครั้งแรกในรอบเดือน"}, "B": {"t": "เก็บทั้งหมดไว้กินเอง", "r": "คุณได้ผักกินทั้งสัปดาห์ บางแถวยังอ่อนเกินไป"}, "C": {"t": "เก็บตามวันที่จดไว้ทีละแถว", "r": "ได้ผักที่ดีที่สุดทุกแถว ไม่มีต้นไหนอ่อนหรือแก่เกิน"}, "D": {"t": "ทำตารางเก็บเกี่ยวร่วมกับคนที่ช่วยปลูก", "r": "ทุกคนรู้ว่าวันไหนมาเก็บแถวไหน ผลผลิตไม่เสียเลย"}}}},
  "R139": {"P2": {"title": "เมล็ดพันธุ์ของคุณเป็นที่ต้องการ", "s": "คนรู้ว่าคุณเก็บเมล็ดพันธุ์ไว้หลายชนิด มีคนมาขอซื้อถึงหน้าบ้านทุกวัน", "choices": {"A": {"t": "ให้เมล็ดฟรีพร้อมบอกวิธีปลูก", "r": "เขาเริ่มมีต้นกล้าในสัปดาห์ คนในซอยพูดถึงคุณดีขึ้น"}, "B": {"t": "ขายในราคาที่คุณพอใจ", "r": "คุณได้ข้าวสารมาแลก เมล็ดของคุณลดลง"}, "C": {"t": "ถามว่าเขามีที่และน้ำพอไหม", "r": "เขามีแค่กระถาง คุณให้เมล็ดที่ปลูกในกระถางได้"}, "D": {"t": "แลกเมล็ดกับเมล็ดชนิดอื่นที่คุณไม่มี", "r": "คุณมีเมล็ดเพิ่มอีกสี่ชนิดโดยไม่เสียอะไร"}}}, "P3": {"title": "เมล็ดพันธุ์ขายมีปัญหา", "s": "มีคนขายเมล็ดพันธุ์ในตลาด ซองบอกว่าเป็นพริก แต่เมล็ดหน้าตาไม่เหมือนพริก", "choices": {"A": {"t": "เตือนคนที่กำลังจะซื้อ", "r": "หลายคนไม่ซื้อ คนขายเริ่มไม่พอใจคุณ"}, "B": {"t": "ไม่ซื้อ ใช้เมล็ดที่มีอยู่", "r": "คุณไม่เสีย แต่คนอื่นยังซื้อต่อโดยไม่รู้"}, "C": {"t": "ขอเพาะดูสองสามเมล็ดก่อน", "r": "สามวันต่อมาเป็นต้นมะเขือ ไม่ใช่พริก คุณบอกคนซื้อให้รู้ว่าได้อะไร"}, "D": {"t": "ให้ตลาดเพาะตัวอย่างก่อนขายทุกซอง", "r": "ทุกซองมีต้นตัวอย่างวางโชว์ คนซื้อได้ของตรงกับที่ต้องการ"}}}},
  "R140": {"P2": {"title": "คลังเมล็ดอยากได้เมล็ดคุณ", "s": "ชุมชนตั้งคลังเมล็ดพันธุ์สำหรับฤดูหน้า และรู้ว่าคุณมีเมล็ดมากที่สุดในซอย", "choices": {"A": {"t": "ให้เมล็ดเข้าคลัง", "r": "คลังมีเมล็ดตั้งต้น หลายบ้านเอามาสมทบตาม"}, "B": {"t": "เก็บเมล็ดไว้ที่บ้านเอง", "r": "เมล็ดอยู่กับคุณ ถ้าเสียก็ไม่มีสำรอง"}, "C": {"t": "ดูว่าที่เก็บของคลังกันชื้นได้ไหม", "r": "ที่เก็บเดิมชื้นเกินไป คุณเสนอใช้โอ่งปิดฝาแทน เมล็ดไม่เสีย"}, "D": {"t": "ให้ครึ่งหนึ่ง โดยเบิกคืนได้ทุกฤดู", "r": "เมล็ดของคุณมีสำรองที่คลัง และคุณยังเก็บอีกครึ่งไว้เอง"}}}, "P3": {"title": "คลังเมล็ดต้องมีบัญชี", "s": "ชุมชนจะตั้งคลังเมล็ดพันธุ์ และขอให้คุณช่วยวางระบบ เพราะคุณจดเรื่องแปลงผักมาตลอด", "choices": {"A": {"t": "ให้เมล็ดจากบ้านคุณเข้าคลังก่อน", "r": "คลังมีเมล็ดตั้งต้น หลายบ้านเอามาสมทบ"}, "B": {"t": "ช่วยแนะนำแต่ไม่ดูแลเอง", "r": "คลังเริ่มได้ แต่ไม่มีใครจดว่าเมล็ดไหนเก็บเมื่อไร"}, "C": {"t": "ทดสอบอัตรางอกก่อนเก็บเข้าคลัง", "r": "เมล็ดสองชนิดงอกไม่ถึงครึ่ง คลังเก็บเฉพาะที่งอกดี"}, "D": {"t": "ตั้งกติกาเบิกและคืนพร้อมบันทึก", "r": "ใครเบิกต้องคืนเป็นเมล็ดหลังเก็บเกี่ยว คลังโตขึ้นทุกฤดู"}}}},
  "R144": {"P2": {"title": "สุนัขฝากเลี้ยงกินเยอะ", "s": "เพื่อนบ้านพาสุนัขตัวใหญ่มาขอฝากเลี้ยง รู้ว่าบ้านคุณมีเสบียงพอ แต่สุนัขกินมากกว่าที่คิด", "choices": {"A": {"t": "รับฝากและแบ่งอาหารให้", "r": "เพื่อนบ้านไปได้อย่างสบายใจ เสบียงของคุณลดเร็วขึ้น"}, "B": {"t": "ปฏิเสธเพราะเสบียงต้องเก็บไว้", "r": "เสบียงของคุณยังครบ เพื่อนบ้านต้องหาที่อื่น"}, "C": {"t": "ถามว่าจะไปนานแค่ไหน มีอาหารให้ไหม", "r": "เขาไปสามวันและฝากอาหารไว้ด้วย คุณรับได้โดยไม่เดือดร้อน"}, "D": {"t": "รับฝาก แลกกับให้เขาช่วยงานบ้านเมื่อกลับมา", "r": "สุนัขอยู่กับคุณสามวัน เขากลับมาช่วยซ่อมรั้วให้"}}}, "P3": {"title": "สุนัขฝากเลี้ยงไม่สบาย", "s": "เพื่อนบ้านพาสุนัขมาขอฝากเลี้ยง คุณสังเกตว่ามันซึมและไม่ยอมกินอาหาร", "choices": {"A": {"t": "รับฝากและดูแลอย่างใกล้ชิด", "r": "สุนัขกินได้ในวันที่สอง เพื่อนบ้านไปได้อย่างสบายใจ"}, "B": {"t": "ปฏิเสธเพราะกลัวสัตว์ในบ้านติดโรค", "r": "บ้านคุณไม่เสี่ยง เพื่อนบ้านต้องหาที่อื่น"}, "C": {"t": "ถามว่ามันกินอะไรมาก่อนหน้า", "r": "มันกินกระดูกไก่ติดคอ อาสาดูแลสัตว์ช่วยเอาออกได้ มันกลับมากินได้"}, "D": {"t": "ให้อาสาสมัครสัตว์ตรวจก่อนรับฝาก", "r": "อาสาสมัครตรวจแล้วไม่ติดโรค สามบ้านผลัดกันดูแลต่อ"}}}},
  "R145": {"P2": {"title": "สุนัขจรมาหาอาหารที่บ้านคุณ", "s": "สุนัขจรขาเจ็บตัวหนึ่งมานอนหน้าบ้านคุณทุกคืน เพราะได้กลิ่นอาหาร", "choices": {"A": {"t": "ทำแผลและให้อาหาร", "r": "สุนัขเดินได้ดีขึ้น และเริ่มนอนเฝ้าหน้าบ้านคุณ"}, "B": {"t": "ไล่ไปที่อื่น", "r": "สุนัขเดินกะเผลกจากไป อาหารของคุณไม่ลด"}, "C": {"t": "ดูว่าแผลหนักแค่ไหน", "r": "แผลไม่ลึก ล้างและพันไว้ก็หายเองได้"}, "D": {"t": "ติดต่ออาสาสมัครดูแลสัตว์", "r": "อาสาสมัครรับไปรักษาและหาบ้านให้ใหม่"}}}, "P3": {"title": "สุนัขบาดเจ็บหลายตัว", "s": "สัปดาห์นี้มีสุนัขขาเจ็บถูกพบข้างทางเป็นตัวที่สาม แผลคล้ายกันทุกตัว", "choices": {"A": {"t": "พามาทำแผลที่บ้าน", "r": "สุนัขเดินได้ดีขึ้นในสามวัน ผ้าพันแผลของคุณลดลง"}, "B": {"t": "ให้น้ำแล้วปล่อยไว้ที่เดิม", "r": "สุนัขได้ดื่มน้ำ แต่แผลยังไม่ได้รักษา"}, "C": {"t": "ไปดูจุดที่พบสุนัขทั้งสามตัว", "r": "ทุกตัวถูกพบใกล้รั้วลวดหนามที่ขาดห้อยลงมา คุณพับลวดเก็บ"}, "D": {"t": "แจ้งชุมชนให้ซ่อมรั้วลวดหนาม", "r": "รั้วถูกซ่อม ไม่มีสุนัขบาดเจ็บแบบนี้อีก"}}}},
  "R146": {"P2": {"title": "สุนัขของคุณเฝ้าบ้านดุเกินไป", "s": "สุนัขของคุณเห่าทุกคนที่เดินผ่านหน้าบ้าน ตั้งแต่คุณปิดบ้านไม่ค่อยมีใครมา", "choices": {"A": {"t": "พาสุนัขไปเดินเล่นให้เจอคนในซอย", "r": "สุนัขเริ่มคุ้นกับเพื่อนบ้าน และเห่าน้อยลง"}, "B": {"t": "ปล่อยไว้ เห่าก็ดี กันคนแปลกหน้า", "r": "บ้านคุณปลอดภัย แต่เพื่อนบ้านเริ่มไม่อยากเดินผ่าน"}, "C": {"t": "ดูว่ามันเห่าใครบ้าง", "r": "มันเห่าเฉพาะคนถือถุง เพราะเคยมีคนแกล้ง คุณรู้วิธีให้มันสงบ"}, "D": {"t": "ตกลงเวลาเงียบกับเพื่อนบ้าน", "r": "สุนัขเข้าบ้านหลังสี่ทุ่ม ทุกคนนอนหลับ"}}}, "P3": {"title": "สุนัขเห่าเวลาเดิมทุกคืน", "s": "สุนัขของคุณเห่าตอนตีสองทุกคืน เพื่อนบ้านเริ่มบ่น คุณสงสัยว่ามันเห่าอะไร", "choices": {"A": {"t": "ขอโทษและพาสุนัขเข้าบ้าน", "r": "เพื่อนบ้านได้นอน แต่ยังไม่มีใครรู้ว่ามันเห่าอะไร"}, "B": {"t": "บอกว่ามันเห่าเพราะมีคนแปลกหน้า", "r": "เพื่อนบ้านไม่พอใจแต่ก็เข้าใจ คืนนั้นยังมีเสียงเห่า"}, "C": {"t": "แอบดูตอนตีสองว่ามีอะไร", "r": "มีคนแอบมาตักน้ำจากถังกลางทุกคืน คุณรู้แล้วว่าน้ำหายไปไหน"}, "D": {"t": "แจ้งเวรยามให้มาดูตอนตีสอง", "r": "เวรยามเจอคนตักน้ำ เขาบ้านน้ำหมดจริง ชุมชนจัดน้ำให้เขาแทน"}}}},
  "R147": {"P2": {"title": "น้ำของคนกับของสัตว์", "s": "น้ำในบ้านเหลือน้อย คุณต้องเลือกว่าจะแบ่งน้ำดื่มให้สัตว์เลี้ยงเท่าไร", "choices": {"A": {"t": "แบ่งให้สัตว์เท่ากับที่คุณดื่ม", "r": "สัตว์ไม่หอบเลย น้ำดื่มของคุณหมดเร็วขึ้น"}, "B": {"t": "ให้น้ำที่ใช้ล้างผักแทน", "r": "สัตว์ได้ดื่ม น้ำดื่มของคนไม่ลดลง"}, "C": {"t": "ดูว่าสัตว์ต้องการน้ำวันละเท่าไรจริง", "r": "มันต้องการแค่วันละถ้วย คุณแบ่งพอดีโดยไม่ขาด"}, "D": {"t": "พาไปดื่มที่ถังน้ำสัตว์ของซอย", "r": "มีถังน้ำสำหรับสัตว์ที่ศาลา คุณไม่ต้องแบ่งน้ำดื่มของตัวเอง"}}}, "P3": {"title": "ชามน้ำแห้งเร็วผิดปกติ", "s": "ชามน้ำของสัตว์เลี้ยงแห้งเร็วกว่าทุกวัน ทั้งที่อากาศไม่ร้อน", "choices": {"A": {"t": "แบ่งน้ำดื่มให้สัตว์เพิ่มทันที", "r": "สัตว์ไม่หอบ น้ำของคุณลดลงหนึ่งขวด"}, "B": {"t": "ให้น้ำที่ใช้ล้างผักแทน", "r": "สัตว์ได้ดื่ม น้ำดื่มของคนไม่ลดลง"}, "C": {"t": "ดูว่ามันดื่มมากผิดปกติไหม", "r": "มันดื่มมากและปัสสาวะบ่อย อาจป่วย คุณพาไปให้อาสาดูแลสัตว์ตรวจ"}, "D": {"t": "ปรึกษาอาสาดูแลสัตว์ร่วมกับบ้านอื่น", "r": "หลายบ้านเจอแบบเดียวกัน อาสาพบว่าอาหารเม็ดล็อตเดียวกันเค็มเกิน"}}}},
  "R148": {"P2": {"title": "เด็กเก็บลูกแมวมาเลี้ยงเงียบ ๆ", "s": "เด็กในบ้านแอบเก็บลูกแมวมาเลี้ยงในห้องหลายวัน และแบ่งข้าวของตัวเองให้มัน", "choices": {"A": {"t": "ให้เลี้ยงต่อและช่วยดูแล", "r": "เด็กยิ้มได้ทั้งวันและรับผิดชอบให้อาหารเอง"}, "B": {"t": "บอกว่าบ้านเราเลี้ยงเพิ่มไม่ได้", "r": "อาหารในบ้านไม่ลดลง แต่เด็กร้องไห้ทั้งคืน"}, "C": {"t": "ดูว่าลูกแมวมีแม่หรือเจ้าของไหม", "r": "แม่แมวอยู่ใต้บ้านข้าง ๆ เด็กยอมคืนเมื่อเห็นแม่ของมัน"}, "D": {"t": "หาบ้านที่พร้อมรับเลี้ยงให้เด็กไปเยี่ยมได้", "r": "ลูกแมวได้บ้านที่ดี เด็กได้ออกไปเยี่ยมและเจอเพื่อนใหม่"}}}, "P3": {"title": "ลูกแมวมีเจ้าของไหม", "s": "เด็กในบ้านนั่งกอดลูกแมวที่เพิ่งเจอ ลูกแมวมีปลอกคอสีแดงแต่ไม่มีชื่อ", "choices": {"A": {"t": "ให้เด็กเลี้ยงไปก่อนระหว่างหาเจ้าของ", "r": "เด็กยิ้มได้ทั้งวันและรับผิดชอบให้อาหารเอง"}, "B": {"t": "บอกว่าต้องคืนเจ้าของ", "r": "อาหารในบ้านไม่ลดลง แต่เด็กร้องไห้ทั้งคืน"}, "C": {"t": "ถามรอบซอยว่าใครใส่ปลอกคอสีแดง", "r": "เป็นแมวของยายท้ายซอย เด็กได้ไปส่งและได้รับเชิญไปเล่นด้วยทุกวัน"}, "D": {"t": "ประกาศหาเจ้าของผ่านวิทยุชุมชน", "r": "เจ้าของมารับภายในวันเดียว และให้เด็กไปเยี่ยมได้ทุกเมื่อ"}}}},
  "R149": {"P2": {"title": "มีคนขอรับสุนัขที่คุณเลี้ยงไว้", "s": "สุนัขจรที่คุณให้อาหารมาตลอดเริ่มอ้วนท้วน มีคนมาขอรับไปเลี้ยงที่บ้านเขา", "choices": {"A": {"t": "ให้เขารับไปพร้อมอาหารติดมือ", "r": "สุนัขได้บ้าน คุณแบ่งอาหารไปหนึ่งถุง"}, "B": {"t": "ไม่ให้ เก็บไว้เฝ้าบ้าน", "r": "สุนัขอยู่กับคุณต่อ บ้านคุณมีคนเฝ้า"}, "C": {"t": "ไปดูบ้านเขาก่อน", "r": "บ้านเขามีรั้วและลานกว้าง คุณสบายใจที่จะให้ไป"}, "D": {"t": "ให้ไป แลกกับให้เขาช่วยเฝ้าบ้านคุณยามออกไปข้างนอก", "r": "สุนัขได้บ้านใหม่ และคุณได้คนช่วยดูบ้าน"}}}, "P3": {"title": "คนขอรับสัตว์หลายตัว", "s": "มีคนขอรับสุนัขจรไปเลี้ยงเป็นตัวที่สี่ในเดือนนี้ แต่ไม่มีใครเคยเห็นสุนัขสามตัวก่อนหน้าอีกเลย", "choices": {"A": {"t": "ให้เขารับไปพร้อมอาหาร", "r": "สุนัขไปกับเขา คุณยังไม่รู้ว่ามันจะอยู่ดีไหม"}, "B": {"t": "ไม่ยุ่ง ปล่อยให้เขาตัดสินใจเอง", "r": "ไม่มีใครรู้ว่าสุนัขจะเป็นอย่างไร"}, "C": {"t": "ไปดูบ้านเขาว่าสุนัขสามตัวอยู่ไหม", "r": "สุนัขทั้งสามอยู่ดีในสวนหลังบ้าน เขาเลี้ยงไว้เฝ้าแปลงผัก"}, "D": {"t": "ให้อาสาสัตว์ติดตามสุนัขทุกตัวที่ถูกรับไป", "r": "อาสาแวะดูเดือนละครั้ง สุนัขทุกตัวมีบันทึกว่าอยู่ที่ไหน"}}}},
  "R150": {"P2": {"title": "สัตว์ในซอยไม่มีใครดูแล", "s": "หลายบ้านย้ายออกและทิ้งสัตว์ไว้ สัตว์เริ่มมาหาอาหารที่บ้านคุณทุกวัน", "choices": {"A": {"t": "รับดูแลสัตว์ที่ถูกทิ้ง", "r": "สัตว์มีที่พึ่ง บ้านคุณงานเพิ่มขึ้นมาก"}, "B": {"t": "ปิดถังอาหารให้มิดชิด ไม่ให้มาวนเวียน", "r": "อาหารของคุณปลอดภัย สัตว์ย้ายไปหาที่อื่น"}, "C": {"t": "นับว่ามีสัตว์ถูกทิ้งกี่ตัว", "r": "มีสิบสองตัว คุณรู้ว่าดูแลคนเดียวไม่ไหว"}, "D": {"t": "ส่งรายชื่อสัตว์ให้กลุ่มอาสาดูแล", "r": "กลุ่มอาสาผลัดกันให้อาหาร สัตว์ทุกตัวมีคนดูแล"}}}, "P3": {"title": "อาหารสัตว์ของซอยพอถึงเมื่อไร", "s": "หลายบ้านที่เลี้ยงสัตว์มาคุยกันเรื่องอาหารระยะยาว และขอให้คุณช่วยนับ", "choices": {"A": {"t": "รับดูแลสัตว์ของบ้านที่ไม่ไหว", "r": "สัตว์ทุกตัวมีคนดูแล บ้านคุณงานเพิ่มขึ้นมาก"}, "B": {"t": "ช่วยนับแต่ไม่รับดูแล", "r": "ทุกคนได้ตัวเลข แต่ยังไม่มีใครวางแผนต่อ"}, "C": {"t": "นับสัตว์ อาหาร และวันที่จะหมด", "r": "อาหารพอได้อีกหนึ่งเดือน คุณบอกด้วยว่าต้องเริ่มหาเพิ่มเมื่อไร"}, "D": {"t": "ตั้งกลุ่มผลัดเวรตามตัวเลขที่นับ", "r": "ทุกบ้านผลัดกันคนละวัน สัตว์ได้กินตรงเวลาและอาหารไม่หมดก่อนกำหนด"}}}},
  "R154": {"P2": {"title": "เวรยามขอให้คุณช่วย", "s": "เพื่อนบ้านถือตารางเวรยามมาที่บ้านคุณ เพราะบ้านคุณเป็นหลังเดียวที่ยังไม่เคยลงชื่อ", "choices": {"A": {"t": "ลงชื่อรับเวรกลางคืน", "r": "คุณได้เวรตีหนึ่งถึงตีสาม ง่วงตอนเช้า แต่ซอยมีคนเฝ้าครบ"}, "B": {"t": "ขอไม่ลงเวร บ้านคุณต้องมีคนอยู่", "r": "บ้านคุณมีคนดูแลตลอด ตารางเวรยังมีช่องว่าง"}, "C": {"t": "ถามว่าเวรต้องทำอะไรบ้าง", "r": "แค่เดินรอบซอยชั่วโมงละครั้ง คุณรับเวรหัวค่ำได้"}, "D": {"t": "รับเวรเฉพาะช่วงที่เดินผ่านบ้านตัวเอง", "r": "คุณเฝ้าทั้งซอยและบ้านตัวเองไปพร้อมกัน"}}}, "P3": {"title": "ตารางเวรมีช่องโหว่", "s": "คุณดูตารางเวรยามแล้วเห็นว่าช่วงตีสามถึงตีห้าไม่มีใครลงชื่อเลยทั้งสัปดาห์", "choices": {"A": {"t": "ลงชื่อรับเวรช่วงตีสามเอง", "r": "ช่วงนั้นมีคนเฝ้า คุณง่วงทั้งวันหลายวัน"}, "B": {"t": "ขอไม่ลงเวร บอกเพื่อนบ้านเรื่องช่องโหว่", "r": "เพื่อนบ้านรู้ แต่ยังไม่มีใครรับช่วงนั้น"}, "C": {"t": "ดูว่าเหตุผิดปกติเกิดช่วงไหนบ่อยที่สุด", "r": "บันทึกเก่าบอกว่าของหายส่วนใหญ่ช่วงตีสาม ช่องโหว่นี้สำคัญจริง"}, "D": {"t": "เสนอเวรสั้นสองชั่วโมงหมุนเวียน", "r": "ทุกช่วงมีคนเฝ้า ไม่มีใครอยู่เวรนานเกินไป"}}}},
  "R155": {"P2": {"title": "ไฟหน้าบ้านคุณดวงเดียวที่สว่าง", "s": "ไฟทางเดินดับหมด เหลือแค่ไฟหน้าบ้านคุณที่ใช้โซลาร์ คนเดินผ่านมายืนพักใต้ไฟทุกคืน", "choices": {"A": {"t": "เปิดไฟทั้งคืนให้คนเดินผ่าน", "r": "ซอยมีแสงทั้งคืน แบตของคุณหมดก่อนเช้า"}, "B": {"t": "ปิดไฟหลังสามทุ่ม", "r": "ไฟของคุณพอใช้ แต่ซอยมืดสนิทหลังสามทุ่ม"}, "C": {"t": "ดูว่าคนเดินผ่านช่วงไหนมากที่สุด", "r": "คนเดินผ่านมากแค่ช่วงหนึ่งทุ่มถึงสี่ทุ่ม คุณเปิดเฉพาะช่วงนั้น"}, "D": {"t": "ให้บ้านอื่นผลัดกันเปิดไฟหน้าบ้าน", "r": "ซอยมีแสงทุกคืน ไม่มีบ้านไหนเปลืองไฟเกิน"}}}, "P3": {"title": "ไฟทางดับเป็นแนว", "s": "ไฟทางเดินดับหมดอีกครั้ง คุณสังเกตว่าดับเฉพาะเสาฝั่งเดียวของซอย", "choices": {"A": {"t": "ยืนส่องไฟฉายให้คนเดินผ่าน", "r": "คนแก่สองคนเดินกลับบ้านได้ปลอดภัย ถ่านไฟฉายคุณอ่อนลง"}, "B": {"t": "ไม่ออกนอกบ้านหลังมืด", "r": "คุณปลอดภัย แต่คนอื่นยังต้องเดินในความมืด"}, "C": {"t": "ไล่สายไฟตามเสาฝั่งที่ดับ", "r": "สายหลักหลุดที่เสาต้นแรกต้นเดียว คุณบอกช่างไฟถูกจุด"}, "D": {"t": "ให้ช่างไฟกับเวรยามตรวจเสาทุกสัปดาห์", "r": "ไฟทางเดินไม่ดับนานอีก เพราะมีคนตรวจเจอก่อน"}}}},
  "R156": {"P2": {"title": "คุณถูกสงสัย", "s": "ไก่ของบ้านข้าง ๆ หายไป มีคนพูดว่าเห็นบ้านคุณเปิดประตูหลังตอนดึก", "choices": {"A": {"t": "ไปช่วยเขาตามหาไก่", "r": "ไก่เข้าไปติดในพุ่มไม้หลังบ้านเขาเอง คุณได้คุยกับเพื่อนบ้านเป็นครั้งแรกในรอบนาน"}, "B": {"t": "ปิดประตู ไม่ตอบอะไร", "r": "ไม่มีเรื่องกับใคร แต่ข่าวลือยังอยู่"}, "C": {"t": "ถามว่าใครเห็นอะไรกับตา", "r": "ไม่มีใครเห็นจริง คนพูดแค่ได้ยินมาอีกที"}, "D": {"t": "ขอให้ผู้นำชุมชนตัดสินจากหลักฐาน", "r": "ผู้นำตั้งกติกาว่าจะกล่าวหาใครต้องมีพยาน ข่าวลือหยุด"}}}, "P3": {"title": "กล่าวหาผู้มาใหม่อีกแล้ว", "s": "ผู้มาใหม่ถูกกล่าวหาว่าขโมยเป็นครั้งที่สาม ทุกครั้งคนกล่าวหาคือคนเดิม", "choices": {"A": {"t": "ยืนข้างผู้มาใหม่ ขอให้ทุกคนใจเย็น", "r": "การกล่าวหาหยุดลง ผู้มาใหม่มองคุณด้วยความขอบคุณ"}, "B": {"t": "ถอยออกมา ไม่อยากมีเรื่อง", "r": "คุณไม่มีเรื่องกับใคร แต่ผู้มาใหม่ต้องเผชิญคนเดียว"}, "C": {"t": "เทียบสามครั้งที่ผ่านมาว่าเกิดอะไรขึ้น", "r": "ทั้งสามครั้งของหายแล้วหาเจอเอง คนกล่าวหาไม่เคยมีพยาน"}, "D": {"t": "ขอให้ผู้นำชุมชนตั้งกติกาเรื่องการกล่าวหา", "r": "จะกล่าวหาใครต้องมีพยาน การกล่าวหาลอย ๆ หายไป"}}}},
  "R157": {"P2": {"title": "ของในบ้านคุณถูกขโมย", "s": "ตื่นเช้ามาพบว่าข้าวสารในโรงเก็บของหายไปสองกระสอบ ประตูโรงไม่ได้ล็อก", "choices": {"A": {"t": "ไปถามบ้านข้าง ๆ ว่าเห็นอะไรไหม", "r": "เพื่อนบ้านเห็นคนแปลกหน้าเดินผ่านตอนตีสาม และช่วยเฝ้าให้คืนต่อมา"}, "B": {"t": "ใส่กุญแจและย้ายของเข้าบ้าน", "r": "ของไม่หายอีก แต่บ้านคุณแคบลงจนเดินลำบาก"}, "C": {"t": "ดูรอยเท้ารอบโรงเก็บของ", "r": "รอยเท้าไปทางคลองหลังบ้าน คุณรู้ว่าต้องปิดทางนั้น"}, "D": {"t": "แจ้งเวรยามของชุมชน", "r": "เวรยามเพิ่มรอบเดินหลังบ้านคุณ ไม่มีของหายอีก"}}}, "P3": {"title": "ของหายตามรอบเวร", "s": "ของในคลังกลางหายอีกครั้ง คุณมีบันทึกเวรยามครบทุกคืน", "choices": {"A": {"t": "อาสาเฝ้าคลังคืนนี้", "r": "ไม่มีของหายเพิ่ม คุณอดนอนทั้งคืน"}, "B": {"t": "เอาของของบ้านคุณกลับไปเก็บเอง", "r": "ของของคุณปลอดภัย แต่คลังกลางยังมีปัญหา"}, "C": {"t": "เทียบวันที่ของหายกับตารางเวร", "r": "ของหายเฉพาะคืนที่เวรขาด ไม่ใช่คนในเวรเอาไป"}, "D": {"t": "เสนอให้ไม่มีคืนไหนเวรว่าง", "r": "ทุกคืนมีคนเฝ้าครบ ของหายหยุดลงทันที"}}}},
  "R158": {"P2": {"title": "คนหนีน้ำมาเคาะประตู", "s": "กลุ่มคนหนีน้ำท่วมมาเคาะประตูบ้านคุณกลางดึก บ้านคุณเป็นหลังเดียวที่ยังเปิดไฟ", "choices": {"A": {"t": "ให้เข้าพักในบ้าน", "r": "เด็กและคนแก่ได้นอนในที่แห้ง บ้านคุณแออัดทั้งคืน"}, "B": {"t": "บอกทางไปศูนย์พักพิงผ่านประตู", "r": "พวกเขาไปต่อได้ คุณไม่ต้องเปิดประตูรับใคร"}, "C": {"t": "ถามว่ามีคนป่วยหรือเจ็บไหม", "r": "มีเด็กไข้ขึ้นหนึ่งคน คุณให้ยาลดไข้แล้วพาไปหาพยาบาลตอนเช้า"}, "D": {"t": "พาไปที่ศาลาแล้วปลุกเวรยาม", "r": "ศาลารับทั้งกลุ่ม หลายบ้านตื่นมาเอาผ้าห่มมาช่วย"}}}, "P3": {"title": "กลุ่มคนขอพักบอกไม่ตรงกัน", "s": "กลุ่มคนสิบกว่าคนมาขอพักฉุกเฉิน บอกว่าหนีน้ำท่วม แต่เสื้อผ้าทุกคนแห้งสนิท", "choices": {"A": {"t": "ให้พักในบ้านคุณบางส่วน", "r": "เด็กและคนแก่ได้นอน คืนนั้นผ่านไปเรียบร้อย"}, "B": {"t": "บอกทางไปศูนย์พักพิง", "r": "พวกเขาไปต่อได้ บ้านคุณไม่ต้องรับภาระ"}, "C": {"t": "ถามว่ามาจากที่ไหนและเกิดอะไรขึ้น", "r": "ที่พักเดิมถูกน้ำท่วมตั้งแต่เมื่อวาน พวกเขาเดินมาทั้งคืนจนผ้าแห้ง เรื่องจริงทุกอย่าง"}, "D": {"t": "เปิดศาลาให้พักพร้อมลงชื่อทุกคน", "r": "ศาลารับทั้งกลุ่ม ทุกคนมีชื่อในบันทึก หลายบ้านเอาผ้าห่มมาช่วย"}}}},
  "R159": {"P2": {"title": "กติกาเวรที่คุณไม่ได้ร่วม", "s": "ชุมชนตั้งกติกาเวรยามใหม่ ทุกบ้านต้องมีคนเข้าเวรสัปดาห์ละครั้ง รวมถึงบ้านคุณ", "choices": {"A": {"t": "รับเวรตามกติกา", "r": "คุณได้รู้จักคนในซอยมากขึ้น และรู้ว่าซอยปลอดภัยแค่ไหน"}, "B": {"t": "ขอจ่ายเป็นข้าวสารแทนการเข้าเวร", "r": "ชุมชนรับข้าว แต่บางคนบอกว่าเงินซื้อเวรไม่ได้"}, "C": {"t": "ถามว่าถ้าไม่เข้าเวรจะเป็นอย่างไร", "r": "บ้านที่ไม่เข้าเวรจะไม่ได้ความช่วยเหลือก่อน คุณรู้ผลที่ตามมาชัด"}, "D": {"t": "เสนอให้บ้านคุณเป็นจุดพักของเวรกลางคืน", "r": "เวรยามมาพักดื่มน้ำที่บ้านคุณ บ้านคุณจึงมีคนเฝ้าตลอดคืน"}}}, "P3": {"title": "สัญญาณแจ้งเหตุสับสน", "s": "คนอยู่เวรใช้สัญญาณแจ้งเหตุคนละแบบ บางคนเป่านกหวีด บางคนเคาะเสา จนไม่มีใครรู้ว่าแปลว่าอะไร", "choices": {"A": {"t": "อาสาเขียนขั้นตอนแจ้งเหตุ", "r": "ทุกคนรู้ว่าเจอเรื่องแบบไหนต้องแจ้งใคร คุณใช้เวลาไปหนึ่งคืน"}, "B": {"t": "ให้คนอยู่เวรตกลงกันเอง", "r": "คุณไม่ต้องรับภาระ แต่สัญญาณยังไม่ชัด"}, "C": {"t": "รวบรวมว่ามีสัญญาณแบบไหนใช้อยู่บ้าง", "r": "มีห้าแบบที่ใช้ต่างกัน คุณเลือกสามแบบที่คนใช้มากที่สุด"}, "D": {"t": "ซ้อมสัญญาณแจ้งเหตุพร้อมกันทั้งซอย", "r": "เป่าสามครั้งคือขอความช่วยเหลือ ทุกบ้านรู้และตอบสนองได้ทันที"}}}},
  "R160": {"P2": {"title": "ข้อพิพาทรั้วบ้านคุณ", "s": "บ้านข้าง ๆ บอกว่ารั้วที่คุณสร้างเสริมความปลอดภัยรุกที่ของเขาไปหนึ่งศอก", "choices": {"A": {"t": "ยอมถอยรั้วให้", "r": "การทะเลาะจบ ลานบ้านคุณแคบลง"}, "B": {"t": "ยืนยันว่ารั้วอยู่ในที่ของคุณ", "r": "รั้วอยู่ที่เดิม แต่บ้านข้าง ๆ ไม่คุยกับคุณอีก"}, "C": {"t": "ดูหลักเขตที่ดินเดิม", "r": "หลักเขตอยู่ตรงแนวรั้วพอดี เขาเห็นด้วยตาตัวเองและยอมรับ"}, "D": {"t": "ให้ผู้นำชุมชนกับพยานไกล่เกลี่ย", "r": "ได้ข้อตกลงเป็นลายลักษณ์อักษร เรื่องจบโดยไม่มีใครเสียหน้า"}}}, "P3": {"title": "รั้วที่ทะเลาะกันมีแผนที่สองฉบับ", "s": "สองบ้านทะเลาะกันเรื่องรั้ว ต่างถือแผนที่ที่ดินคนละฉบับมายืนยัน", "choices": {"A": {"t": "ไปคุยกับทั้งสองบ้านทีละฝั่ง", "r": "แต่ละฝั่งได้ระบาย ทั้งคู่ยอมเจอกันครึ่งทาง"}, "B": {"t": "บอกว่าไม่ขอยุ่งเรื่องนี้", "r": "คุณไม่ต้องเลือกข้าง แต่ทั้งสองบ้านยังไม่คุยกัน"}, "C": {"t": "เทียบแผนที่สองฉบับกับหลักเขตจริง", "r": "ฉบับหนึ่งวาดก่อนตัดถนนใหม่ ฉบับที่ถูกชี้ว่าแนวอยู่ตรงกลางพอดี"}, "D": {"t": "ให้ผู้นำชุมชนกับพยานไกล่เกลี่ยจากหลักฐาน", "r": "ได้ข้อตกลงเป็นลายลักษณ์อักษร เรื่องจบโดยไม่มีใครเสียหน้า"}}}},
