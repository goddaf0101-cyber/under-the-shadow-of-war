  "R164": {"P2": {"title": "แบบฟอร์มที่คุณไม่เคยกรอก", "s": "จุดช่วยเหลือแจกของตามแบบฟอร์มที่ต้องกรอกล่วงหน้า บ้านคุณไม่เคยกรอกเพราะไม่เคยขอความช่วยเหลือ", "choices": {"A": {"t": "กรอก แล้วช่วยเพื่อนบ้านกรอกด้วย", "r": "บ้านคุณมีชื่อในระบบ เพื่อนบ้านสองคนได้ส่งแบบฟอร์มทัน"}, "B": {"t": "ไม่กรอก ยังพึ่งตัวเองได้", "r": "คุณไม่ต้องยุ่งกับขั้นตอน แต่ถ้าวันหนึ่งขาดก็ไม่มีชื่อในระบบ"}, "C": {"t": "อ่านแบบฟอร์มดูว่าต้องให้ข้อมูลอะไร", "r": "แบบฟอร์มถามแค่จำนวนคนและของที่ขาด คุณกรอกเสร็จในห้านาที"}, "D": {"t": "กรอกไว้และขอให้เป็นผู้ให้ของแทน", "r": "เจ้าหน้าที่จดบ้านคุณเป็นผู้บริจาค ชื่อคุณอยู่ในระบบแบบที่คุณเลือก"}}}, "P3": {"title": "แบบฟอร์มที่ถามข้อมูลเกิน", "s": "เพื่อนบ้านถือแบบฟอร์มขอรับความช่วยเหลือมา คุณสังเกตว่ามีช่องถามเลขบัญชีธนาคาร ซึ่งไม่น่าจำเป็น", "choices": {"A": {"t": "นั่งกรอกให้จนเสร็จ", "r": "แบบฟอร์มส่งได้ แต่เลขบัญชีของเขาอยู่ในมือคนที่ไม่รู้จัก"}, "B": {"t": "บอกให้ไปถามเจ้าหน้าที่เอง", "r": "คุณมีเวลาทำงานต่อ เขาต้องไปต่อคิวถามที่อำเภอ"}, "C": {"t": "ตรวจว่าแบบฟอร์มมาจากหน่วยงานไหน", "r": "แบบฟอร์มจริงของอำเภอไม่มีช่องเลขบัญชี ฉบับนี้เป็นของปลอม คุณเตือนทั้งซอย"}, "D": {"t": "ให้ศาลาแจกเฉพาะแบบฟอร์มฉบับจริง", "r": "ทุกบ้านกรอกฉบับเดียวกันที่ตรวจแล้ว ไม่มีใครให้ข้อมูลเกินจำเป็น"}}}},
  "R165": {"P2": {"title": "จุดช่วยเหลือย้ายไปไกล", "s": "จุดช่วยเหลือย้ายไปไกลขึ้นสองกิโล คุณไม่ค่อยได้ใช้ แต่เพื่อนบ้านถามว่าคุณมีรถพาไปไหม", "choices": {"A": {"t": "ขับรถพาคนแก่ไปจุดใหม่", "r": "ยายสองคนได้รับของตามสิทธิ์ คุณเสียน้ำมันไปหนึ่งเที่ยว"}, "B": {"t": "บอกว่ารถต้องเก็บน้ำมันไว้", "r": "น้ำมันของคุณยังอยู่ เพื่อนบ้านต้องเดินไปเอง"}, "C": {"t": "ถามว่าจุดใหม่เปิดกี่โมง มีรถรับไหม", "r": "จุดใหม่มีรถรับทุกเช้าที่ปากซอย ไม่มีใครต้องเดินไกล"}, "D": {"t": "ให้ยืมรถ แลกกับให้เขาเติมน้ำมันคืน", "r": "เพื่อนบ้านขับไปรับของให้หลายบ้าน และเติมน้ำมันคืนให้ครบ"}}}, "P3": {"title": "ป้ายบอกจุดใหม่ผิดทาง", "s": "จุดช่วยเหลือย้ายไปที่ใหม่ แต่ป้ายบอกทางชี้ไปคนละทางกับที่คนที่เพิ่งกลับมาเล่า", "choices": {"A": {"t": "พาคนแก่ไปจุดใหม่ด้วยตัวเอง", "r": "ยายสองคนได้รับของตามสิทธิ์ คุณเดินไกลขึ้นสองกิโล"}, "B": {"t": "ไปจุดใหม่คนเดียวรับของของคุณ", "r": "คุณได้ของครบ คนอื่นยังเดินตามป้ายผิดอยู่"}, "C": {"t": "เดินตามป้ายดูว่าไปจบที่ไหน", "r": "ป้ายถูกลมพัดหมุน ชี้ไปทางตรงข้าม คุณหมุนกลับและตอกให้แน่น"}, "D": {"t": "ขอให้สถานีชุมชนประกาศเส้นทางที่ถูก", "r": "ทุกบ้านรู้ทางภายในวันเดียว ไม่มีใครเดินไปเสียเที่ยว"}}}},
  "R166": {"P2": {"title": "ประกาศที่มาไม่ถึงบ้านคุณ", "s": "มีประกาศใหม่ของตำบลเรื่องเวลาออกนอกบ้าน คุณเพิ่งรู้จากเวรยามที่มาเตือนหน้าบ้าน", "choices": {"A": {"t": "ขอบคุณแล้วไปช่วยเวรยามบอกบ้านอื่นด้วย", "r": "อีกห้าบ้านที่ยังไม่รู้ได้รู้ทัน คุณได้เดินรู้จักคนในซอย"}, "B": {"t": "ทำตามที่เวรยามบอก แล้วปิดบ้าน", "r": "คุณไม่ทำผิดประกาศ แต่ไม่รู้รายละเอียดอื่น"}, "C": {"t": "ไปอ่านประกาศฉบับจริงที่ศาลา", "r": "ประกาศจริงมีข้อยกเว้นสำหรับคนที่ต้องไปโรงพยาบาล คุณรู้ครบ"}, "D": {"t": "ขอให้เวรยามแวะบอกบ้านคุณทุกครั้งที่มีประกาศ", "r": "เวรยามจดบ้านคุณไว้ในรายชื่อแจ้งข่าว คุณไม่พลาดประกาศอีก"}}}, "P3": {"title": "ประกาศใหม่อ้างฉบับที่ไม่มีอยู่", "s": "ประกาศของตำบลฉบับใหม่อ้างถึงคำสั่งอำเภอเลขหนึ่ง แต่คุณหาคำสั่งเลขนั้นไม่เจอเลย", "choices": {"A": {"t": "บอกคนรอบตัวให้ทำตามฉบับที่ปลอดภัยกว่า", "r": "ทุกคนเลือกทางที่ระวังที่สุด ไม่มีใครเดือดร้อน"}, "B": {"t": "รอจนกว่าจะมีประกาศชัดเจน", "r": "คุณไม่ทำอะไรผิด แต่บางเรื่องก็ค้างไป"}, "C": {"t": "ถามที่อำเภอเรื่องคำสั่งเลขนั้น", "r": "คำสั่งยังไม่ออก ตำบลประกาศล่วงหน้าเกินไป คุณบอกต่อตามจริง"}, "D": {"t": "ขอให้ผู้นำชุมชนถามทั้งสองหน่วยงาน", "r": "ได้คำตอบเดียวกันจากทั้งคู่ ประกาศใหม่ติดที่ศาลาภายในวันนั้น"}}}},
  "R167": {"P2": {"title": "เจ้าหน้าที่ขอใช้บ้านคุณ", "s": "เจ้าหน้าที่ประจำจุดมีคนเดียว และขอใช้ห้องหน้าบ้านคุณเป็นที่รับเรื่องชั่วคราว เพราะใกล้ปากซอย", "choices": {"A": {"t": "ให้ใช้และช่วยจดเรื่องให้", "r": "คิวสั้นลงมาก บ้านคุณมีคนเข้าออกทั้งวัน"}, "B": {"t": "ปฏิเสธ บ้านคุณไม่ใช่ที่ทำการ", "r": "บ้านคุณเงียบเหมือนเดิม เจ้าหน้าที่ยังต้องนั่งรับเรื่องกลางแดด"}, "C": {"t": "ถามว่าจะใช้กี่วัน กี่ชั่วโมง", "r": "ใช้แค่สองบ่ายต่อสัปดาห์ คุณรับได้โดยไม่กระทบงาน"}, "D": {"t": "ให้ใช้ แลกกับให้บ้านคุณได้ข่าวราชการก่อน", "r": "คุณรู้ประกาศใหม่ก่อนทุกคน และเจ้าหน้าที่มีที่ทำงานกันแดด"}}}, "P3": {"title": "คิวยาวเพราะเรื่องไม่ครบ", "s": "เจ้าหน้าที่ประจำจุดมีคนเดียว คิวยาวทุกวัน คุณสังเกตว่าคนครึ่งหนึ่งต้องกลับไปเอาเอกสารมาเพิ่ม", "choices": {"A": {"t": "อาสาช่วยจดเรื่องเบื้องต้นให้", "r": "เจ้าหน้าที่ทำงานเร็วขึ้นครึ่งหนึ่ง คุณใช้เวลาไปครึ่งวัน"}, "B": {"t": "กลับมาใหม่วันที่คนน้อย", "r": "คุณไม่ต้องยืนรอนาน แต่เรื่องของคุณช้าไปหนึ่งวัน"}, "C": {"t": "ทำรายการเอกสารที่ต้องเตรียมแต่ละเรื่อง", "r": "คนเตรียมเอกสารมาครบตั้งแต่ครั้งแรก คิวสั้นลงเกือบครึ่ง"}, "D": {"t": "ติดรายการเอกสารไว้หน้าจุดและที่ศาลา", "r": "ทุกคนอ่านก่อนมา ไม่มีใครต้องกลับไปเอาเอกสารอีก"}}}},
  "R168": {"P2": {"title": "สิทธิที่บ้านคุณไม่เคยใช้", "s": "ระหว่างรอคิว คุณได้ยินว่าบ้านที่มีผู้สูงอายุได้สิทธิ์รับยาฟรีทุกเดือน ซึ่งบ้านคุณไม่เคยรับ", "choices": {"A": {"t": "บอกบ้านอื่นที่อาจไม่รู้เรื่องนี้ด้วย", "r": "หลายบ้านไปลงชื่อรับสิทธิ์ทัน เจ้าหน้าที่ขอบคุณที่ช่วยกระจายข่าว"}, "B": {"t": "ไม่ใช้สิทธิ์ ยังซื้อยาเองได้", "r": "คุณไม่ต้องลงชื่ออะไร ยาที่ซื้อเองยังพอ"}, "C": {"t": "ขอดูเกณฑ์ว่าบ้านไหนได้สิทธิ์", "r": "เกณฑ์ครอบคลุมเฉพาะผู้สูงอายุที่ลงทะเบียน คุณรู้ว่าบ้านไหนเข้าเกณฑ์"}, "D": {"t": "ลงชื่อรับสิทธิ์และติดเกณฑ์ไว้ที่ศาลา", "r": "ทุกบ้านเห็นเกณฑ์ ใครเข้าเกณฑ์ก็มาลงชื่อได้เอง"}}}, "P3": {"title": "รายชื่อรับนมตกหล่น", "s": "ผู้ปกครองร้องว่าลูกไม่ได้รับนมแจก คุณเทียบแล้วพบว่ามีเด็กอีกหลายบ้านไม่อยู่ในรายชื่อ", "choices": {"A": {"t": "ช่วยผู้ปกครองยื่นเรื่องให้เจ้าหน้าที่", "r": "เด็กคนนี้ได้นมตั้งแต่วันถัดไป แต่บ้านอื่นยังตกหล่น"}, "B": {"t": "บอกให้เขารอรอบหน้า", "r": "คุณไม่ต้องยุ่ง แต่เด็กหลายคนยังไม่ได้นม"}, "C": {"t": "เทียบรายชื่อกับเด็กที่อยู่จริงในซอย", "r": "มีเด็กตกหล่นเจ็ดคน เพราะรายชื่อทำก่อนพวกเขาย้ายมา"}, "D": {"t": "ให้ศาลาส่งรายชื่อเด็กที่อัปเดตทุกเดือน", "r": "รายชื่อเป็นปัจจุบันเสมอ ไม่มีเด็กตกหล่นอีก"}}}},
  "R169": {"P2": {"title": "ไม่มีใครเป็นตัวแทนซอยคุณ", "s": "อำเภอเปิดรับตัวแทนประชาชน ซอยคุณยังไม่มีใครสมัคร เพื่อนบ้านถามว่าคุณจะลองไหม", "choices": {"A": {"t": "สมัครเป็นตัวแทนของซอย", "r": "คุณได้รับเลือก งานเพิ่มขึ้นมาก แต่ซอยมีเสียงในอำเภอ"}, "B": {"t": "ไม่สมัคร ขอดูแลบ้านตัวเอง", "r": "คุณไม่ต้องรับภาระ ซอยไม่มีเสียงในเรื่องที่กระทบทุกบ้าน"}, "C": {"t": "ถามว่าตัวแทนต้องทำอะไรบ้าง", "r": "ตัวแทนแค่ส่งเรื่อง ไม่ได้ตัดสินใจ คุณรู้ว่ารับไหวแค่ไหน"}, "D": {"t": "เสนอให้ผลัดกันเป็นตัวแทนคนละเดือน", "r": "ทุกบ้านผลัดกันเป็นตัวแทน ไม่มีใครรับภาระคนเดียว"}}}, "P3": {"title": "ผู้สมัครตัวแทนที่ไม่มีใครรู้จัก", "s": "อำเภอเปิดรับตัวแทนประชาชน มีผู้สมัครคนหนึ่งบอกว่าอยู่ในซอยมาสิบปี แต่ไม่มีใครจำเขาได้", "choices": {"A": {"t": "ช่วยจัดเวทีให้ผู้สมัครทุกคนพูด", "r": "ทุกคนได้ฟังผู้สมัครครบ การเลือกตั้งเป็นระเบียบ"}, "B": {"t": "ไม่ยุ่ง ปล่อยให้คนอื่นเลือก", "r": "คุณไม่ต้องเลือกข้าง แต่ยังไม่มีใครรู้ว่าเขาเป็นใคร"}, "C": {"t": "ถามผู้สมัครว่าเคยอยู่บ้านหลังไหน", "r": "เขาอยู่ซอยข้างเคียง ไม่ใช่ซอยนี้ เขายอมถอนตัวไปสมัครที่ซอยตัวเอง"}, "D": {"t": "ให้ผู้สมัครมีผู้รับรองจากในซอยสองคน", "r": "ผู้สมัครทุกคนมีคนรับรอง ทุกคนรู้ว่าตัวแทนเป็นคนในซอยจริง"}}}},
  "R170": {"P2": {"title": "บัญชีกลางอยากรู้ของบ้านคุณ", "s": "ชุมชนเปิดบัญชีของส่วนกลางให้ทุกคนตรวจ และขอให้ทุกบ้านแจ้งของที่บริจาคเข้าไป", "choices": {"A": {"t": "แจ้งทุกอย่างที่บ้านคุณเคยให้", "r": "บัญชีครบขึ้น คนเห็นว่าบ้านคุณช่วยมากกว่าที่คิด"}, "B": {"t": "ไม่แจ้ง ของที่ให้เป็นเรื่องส่วนตัว", "r": "บัญชีขาดรายการของบ้านคุณ แต่ความเป็นส่วนตัวยังอยู่"}, "C": {"t": "ขอดูบัญชีก่อนว่าจะเปิดให้ใครเห็น", "r": "บัญชีบอกแค่ยอดรวม ไม่บอกชื่อบ้าน คุณสบายใจที่จะแจ้ง"}, "D": {"t": "แจ้งโดยขอให้ไม่ระบุชื่อ", "r": "ของที่คุณให้อยู่ในบัญชีครบ โดยไม่มีชื่อบ้านคุณ"}}}, "P3": {"title": "บัญชีเก่ามีช่องว่าง", "s": "ชุมชนจะเปิดบัญชีของส่วนกลางให้ทุกคนตรวจ คุณเห็นว่าบัญชีเก่าหายไปทั้งเดือน", "choices": {"A": {"t": "อาสาเป็นคนจดบัญชีจากนี้ไป", "r": "บัญชีครบทุกรายการ คุณใช้เวลาวันละชั่วโมง"}, "B": {"t": "เริ่มบัญชีใหม่ ไม่ย้อนดูของเก่า", "r": "บัญชีใหม่สะอาด แต่ไม่มีใครรู้ว่าเดือนที่หายไปเกิดอะไรขึ้น"}, "C": {"t": "ไล่หาบันทึกเดือนที่หายจากใบเบิก", "r": "เจอใบเบิกครบในกล่องที่ศาลา บัญชีเดือนนั้นกลับมาครบ"}, "D": {"t": "ติดบัญชีไว้ที่ศาลาทุกสัปดาห์", "r": "ทุกคนเห็นว่าของไปไหน ความไม่ไว้ใจในชุมชนลดลง"}}}},
  "R174": {"P2": {"title": "งานที่คุณทำคนเดียว", "s": "คุณรับซ่อมของเองที่บ้านมาพักหนึ่ง วันนี้มีคนเสนองานขนของแลกข้าวสาร แต่ต้องทำกับคนอื่นอีกหลายคน", "choices": {"A": {"t": "รับงานไปทำกับคนอื่น", "r": "ทำงานทั้งวัน ได้ข้าวสารสองกิโล และได้รู้จักคนอีกหลายคน"}, "B": {"t": "ปฏิเสธ ทำงานซ่อมที่บ้านต่อ", "r": "คุณทำงานแบบที่ชอบ แต่ไม่ได้ข้าวเพิ่ม"}, "C": {"t": "ถามรายละเอียดงานและค่าตอบแทนให้ชัด", "r": "งานครึ่งวันแลกข้าวสามกิโล ตกลงกันชัดเจนก่อนเริ่ม"}, "D": {"t": "รับงานซ่อมอุปกรณ์ขนของแทนการขน", "r": "คุณซ่อมรถเข็นให้ทีมขนของที่บ้าน ได้ข้าวเท่ากันโดยไม่ต้องออกไป"}}}, "P3": {"title": "งานแลกข้าวที่ไม่มีใครได้ข้าว", "s": "มีคนเสนองานขนของแลกข้าวสารอีกครั้ง คุณจำได้ว่าเดือนก่อนมีคนทำงานแล้วไม่ได้ข้าวครบ", "choices": {"A": {"t": "รับงานไปทำ", "r": "ทำงานทั้งวัน ได้ข้าวสารสองกิโล น้อยกว่าที่ตกลง"}, "B": {"t": "ปฏิเสธเพราะเคยมีปัญหา", "r": "คุณไม่เสียแรง แต่ไม่ได้ข้าวเพิ่ม"}, "C": {"t": "ขอให้ตกลงเป็นลายลักษณ์อักษรก่อนเริ่ม", "r": "มีข้อตกลงเขียนชัด ทำครึ่งวันได้ข้าวสามกิโลครบ"}, "D": {"t": "ชวนคนที่เคยโดนไปคุยกับผู้จ้างพร้อมกัน", "r": "ผู้จ้างยอมจ่ายส่วนที่ค้างเดือนก่อน และใช้ข้อตกลงเขียนจากนี้ไป"}}}},
  "R175": {"P2": {"title": "เครื่องมือของคุณพัง", "s": "สว่านที่คุณใช้หาเลี้ยงตัวพังกลางงาน และร้านอะไหล่ปิดหมด", "choices": {"A": {"t": "ยืมเครื่องเพื่อนบ้านมาใช้ก่อน", "r": "งานเสร็จทันเวลา คุณติดค้างน้ำใจเพื่อนบ้านหนึ่งครั้ง"}, "B": {"t": "หยุดงานจนกว่าจะซ่อมเองได้", "r": "คุณได้พัก แต่รายได้หายไปหลายวัน"}, "C": {"t": "เปิดดูว่าเสียตรงไหน", "r": "แปรงถ่านมอเตอร์หมด เปลี่ยนชิ้นเดียวก็ใช้ได้"}, "D": {"t": "แลกงานซ่อมกับช่างที่มีอะไหล่", "r": "ช่างให้แปรงถ่านแลกกับให้คุณซ่อมพัดลมให้เขา"}}}, "P3": {"title": "เครื่องมือพังซ้ำที่เดิม", "s": "สว่านของคุณพังเป็นครั้งที่สอง ที่จุดเดิม หลังเปลี่ยนอะไหล่ไปไม่ถึงเดือน", "choices": {"A": {"t": "ยืมเครื่องของเพื่อนบ้านมาใช้ก่อน", "r": "งานเสร็จทันเวลา คุณติดค้างน้ำใจเพื่อนบ้านหนึ่งครั้ง"}, "B": {"t": "หยุดงานไว้ก่อน", "r": "คุณได้พัก แต่งานค้างและรายได้หาย"}, "C": {"t": "ดูว่าทำไมพังจุดเดิม", "r": "ไฟที่บ้านแรงไม่คงที่ มอเตอร์จึงเสียเร็ว คุณใช้ตัวปรับไฟก่อนเสียบ"}, "D": {"t": "ให้ช่างไฟตรวจไฟทั้งซอย", "r": "ไฟตกเป็นช่วงทั้งซอย ช่างแก้ที่หม้อแปลง เครื่องมือหลายบ้านไม่พังอีก"}}}},
  "R176": {"P2": {"title": "มีคนมาแย่งงานคุณ", "s": "มีช่างคนใหม่ประกาศว่าซ่อมได้ทุกอย่างในราคาถูกกว่าคุณ ลูกค้าประจำเริ่มหายไป", "choices": {"A": {"t": "แนะนำงานที่คุณรับไม่ทันให้เขา", "r": "เขาได้งาน คุณได้พัก และเขาเริ่มส่งงานยากมาให้คุณ"}, "B": {"t": "ลดราคาให้ต่ำกว่าเขา", "r": "ลูกค้ากลับมา แต่คุณได้ค่าแรงน้อยลง"}, "C": {"t": "ดูว่าเขาซ่อมได้ดีแค่ไหน", "r": "เขาซ่อมเร็วแต่ไม่ทน งานที่เขาซ่อมกลับมาหาคุณภายในสัปดาห์"}, "D": {"t": "ตกลงแบ่งงานกันคนละประเภท", "r": "เขารับงานไฟ คุณรับงานเครื่องยนต์ ไม่มีใครแย่งใคร"}}}, "P3": {"title": "ช่างที่อ้างว่าซ่อมได้ทุกอย่าง", "s": "มีคนประกาศว่าซ่อมได้ทุกอย่าง คุณเห็นใบรับรองที่เขาแสดงเป็นของศูนย์ซ่อมที่ปิดไปหลายปีแล้ว", "choices": {"A": {"t": "ให้โอกาสเขาซ่อมของชิ้นเล็กก่อน", "r": "เขาซ่อมวิทยุได้จริง ชุมชนได้ช่างเพิ่มหนึ่งคน"}, "B": {"t": "ไม่จ้าง ใช้ช่างที่รู้จัก", "r": "คุณไม่เสี่ยง แต่ช่างเดิมคิวยาวมาก"}, "C": {"t": "ถามว่าเคยทำงานที่ศูนย์นั้นเมื่อไร", "r": "เขาทำงานที่นั่นก่อนปิด ใบรับรองเป็นของจริงแค่เก่า เขาซ่อมรถได้ดี"}, "D": {"t": "ให้เขาซ่อมของชุมชนต่อหน้าทุกคน", "r": "ทุกคนเห็นฝีมือจริง เขาได้งานต่อเนื่อง"}}}},
  "R177": {"P2": {"title": "งานซ่อมล้นมือคุณ", "s": "งานซ่อมหลายบ้านมาถึงคุณพร้อมกัน เพราะช่างคนอื่นรับไม่ไหว คุณทำคนเดียวมาตลอด", "choices": {"A": {"t": "รับทุกงาน ทำจนดึก", "r": "งานเสร็จเพิ่มสามบ้าน คุณเหนื่อยจนป่วยเล็กน้อย"}, "B": {"t": "รับเฉพาะงานที่ทำทัน", "r": "งานที่รับเสร็จดี งานที่เหลือต้องรอคิว"}, "C": {"t": "ดูว่างานไหนเร่งด่วนที่สุด", "r": "หลังคารั่วสองบ้านต้องทำก่อนฝน คุณจัดลำดับใหม่"}, "D": {"t": "ให้เจ้าของบ้านช่วยงานง่าย ๆ เอง", "r": "คุณทำแค่ส่วนยาก งานค้างหมดในหนึ่งสัปดาห์"}}}, "P3": {"title": "คิวซ่อมไม่มีลำดับ", "s": "งานซ่อมหลายบ้านค้างพร้อมกัน ช่างรับงานตามคนที่มาเร่งก่อน ไม่ได้ดูว่างานไหนจำเป็นกว่า", "choices": {"A": {"t": "ช่วยงานช่างในวันหยุด", "r": "งานเสร็จเพิ่มสามบ้าน คุณเหนื่อยแต่ได้เรียนงานช่าง"}, "B": {"t": "รอคิวซ่อมบ้านคุณตามปกติ", "r": "คุณไม่ต้องลงแรง แต่บ้านคุณได้ซ่อมช้า"}, "C": {"t": "จัดลำดับงานตามความเสี่ยง", "r": "หลังคารั่วสองบ้านต้องทำก่อนฝน สายไฟชำรุดหนึ่งบ้านต้องทำวันนี้"}, "D": {"t": "ติดคิวงานพร้อมลำดับไว้ที่ศาลา", "r": "ทุกคนเห็นว่างานไหนมาก่อนเพราะอะไร ไม่มีใครมาเร่งช่างอีก"}}}},
  "R178": {"P2": {"title": "มีคนขอเป็นลูกมือคุณ", "s": "วัยรุ่นในซอยมาขอเป็นลูกมือช่างของคุณ เพราะอยากมีทักษะไว้หากิน", "choices": {"A": {"t": "สอนเขาทีละขั้น", "r": "เขาเริ่มทำงานเองได้ภายในสามวัน คุณใช้เวลาสอนไปไม่น้อย"}, "B": {"t": "ปฏิเสธ คุณชอบทำงานคนเดียว", "r": "งานของคุณเป็นแบบเดิม เขาไปหาที่เรียนที่อื่น"}, "C": {"t": "ถามว่าเขาถนัดอะไรอยู่แล้ว", "r": "เขาเคยต่อไฟบ้าน คุณให้เริ่มจากงานไฟก่อน"}, "D": {"t": "รับเป็นลูกมือ แลกกับแรงยกของหนัก", "r": "เขาช่วยยกของหนักทุกงาน คุณสอนแลกกับแรง"}}}, "P3": {"title": "ผู้ช่วยช่างทำพลาดซ้ำ", "s": "ผู้ช่วยช่างคนใหม่ต่อสายไฟผิดเป็นครั้งที่สอง ช่างคนอื่นเริ่มไม่อยากให้เขาทำงาน", "choices": {"A": {"t": "สอนเขาใหม่ทีละขั้นด้วยตัวเอง", "r": "เขาต่อถูกภายในสามวัน คุณใช้เวลาสอนไปไม่น้อย"}, "B": {"t": "ให้เขาดูไปก่อน ไม่ต้องลงมือ", "r": "งานไม่พลาดอีก แต่เขาเรียนรู้ได้ช้า"}, "C": {"t": "ดูว่าเขาพลาดตรงไหนทั้งสองครั้ง", "r": "เขาสลับสีสายเพราะแยกสีแดงกับน้ำตาลไม่ออก คุณติดป้ายตัวอักษรบนสายให้"}, "D": {"t": "ทำป้ายบอกสายให้ทุกกล่องเครื่องมือ", "r": "ทุกคนอ่านป้ายแทนดูสี ไม่มีใครต่อสายผิดอีก"}}}},
  "R179": {"P2": {"title": "ท่อน้ำหลักผ่านหน้าบ้านคุณ", "s": "ชุมชนจะซ่อมท่อน้ำหลักที่รั่ว ต้องขุดผ่านลานหน้าบ้านคุณ", "choices": {"A": {"t": "ให้ขุดและลงแรงช่วยด้วย", "r": "งานเสร็จเร็วขึ้น ลานบ้านคุณเละไปหลายวัน"}, "B": {"t": "ขอให้ขุดอ้อมบ้านคุณ", "r": "ลานบ้านคุณไม่เสียหาย แต่ท่อต้องยาวขึ้นและงานช้าลง"}, "C": {"t": "ดูว่าท่อรั่วตรงไหนจริง", "r": "จุดรั่วอยู่ก่อนถึงบ้านคุณสามเมตร ไม่ต้องขุดลานเลย"}, "D": {"t": "ให้ขุด แลกกับต่อท่อแยกเข้าบ้านคุณ", "r": "ท่อหลักซ่อมเสร็จ บ้านคุณได้ท่อแยกที่น้ำแรงกว่าเดิม"}}}, "P3": {"title": "ท่อที่จะซ่อมไม่ใช่จุดรั่ว", "s": "ชุมชนเตรียมขุดซ่อมท่อน้ำหลัก แต่คุณสงสัยว่าจุดที่จะขุดไม่ใช่จุดที่รั่วจริง", "choices": {"A": {"t": "อาสาลงแรงขุดตามแผน", "r": "งานเริ่มเร็ว แต่ขุดไปแล้วไม่เจอรอยรั่ว ต้องขุดใหม่"}, "B": {"t": "รอให้คนอื่นจัดการก่อน", "r": "คุณไม่ต้องลงแรง งานเริ่มช้ากว่าที่ควร"}, "C": {"t": "ฟังเสียงน้ำตามแนวท่อตอนกลางคืน", "r": "เสียงน้ำรั่วดังที่สุดห่างจากจุดเดิมสิบเมตร คุณปักหมุดจุดใหม่"}, "D": {"t": "แบ่งทีมขุดตามจุดที่ปักหมุดไว้", "r": "ขุดเจอรอยรั่วในครั้งเดียว งานเสร็จภายในสองวัน"}}}},
  "R180": {"P2": {"title": "ชื่อคุณไม่มีในกระดานงาน", "s": "กระดานแบ่งงานชุมชนมีชื่อทุกบ้าน ยกเว้นบ้านคุณที่ไม่เคยลงชื่อ", "choices": {"A": {"t": "ลงชื่อรับงานที่ไม่มีใครรับ", "r": "งานที่ตกหล่นมีคนทำ คนเริ่มเห็นชื่อคุณบนกระดาน"}, "B": {"t": "ไม่ลงชื่อ ทำงานของตัวเองต่อ", "r": "คุณมีเวลาเต็มที่ แต่บางคนบ่นว่าบ้านคุณไม่ช่วย"}, "C": {"t": "ดูว่างานไหนตรงกับที่คุณถนัด", "r": "มีงานซ่อมเครื่องมือที่ไม่มีใครรับ คุณลงชื่อแค่งานนั้น"}, "D": {"t": "รับงานซ่อมที่ทำจากบ้านได้", "r": "คุณซ่อมเครื่องมือของชุมชนที่บ้าน ชื่อคุณอยู่บนกระดานโดยไม่ต้องออกไป"}}}, "P3": {"title": "กระดานงานที่ไม่มีใครดู", "s": "กระดานแบ่งงานมีชื่อซ้ำและเวลาทับกัน คุณสังเกตว่าคนส่วนใหญ่ไม่ได้ดูกระดานเลย", "choices": {"A": {"t": "รับงานที่ไม่มีใครลงชื่อ", "r": "งานที่ตกหล่นมีคนทำ คุณมีงานเพิ่มขึ้นสองอย่าง"}, "B": {"t": "ทำแค่งานที่คุณลงชื่อไว้", "r": "งานของคุณเสร็จ แต่กระดานยังวุ่นวาย"}, "C": {"t": "ถามว่าทำไมไม่มีใครดูกระดาน", "r": "กระดานอยู่หลังศาลาที่ไม่มีใครเดินผ่าน คุณย้ายมาไว้หน้าครัวกลาง"}, "D": {"t": "ให้ประกาศงานของวันผ่านวิทยุชุมชนทุกเช้า", "r": "ทุกคนได้ยินว่าวันนี้ใครทำอะไร งานไม่ทับกันอีก"}}}},
  "R184": {"P2": {"title": "ผู้มาใหม่ตั้งเพิงข้างบ้านคุณ", "s": "ผู้มาใหม่ครอบครัวหนึ่งตั้งเพิงพักชั่วคราวติดรั้วบ้านคุณ คนในซอยถามว่าคุณจะว่าอย่างไร", "choices": {"A": {"t": "ให้อยู่ได้และแบ่งน้ำให้", "r": "ครอบครัวนั้นมีที่พัก เขาช่วยดูบ้านให้ยามคุณออกไปข้างนอก"}, "B": {"t": "ขอให้ย้ายไปตั้งที่อื่น", "r": "เพิงย้ายไปที่ลานวัด บ้านคุณเงียบเหมือนเดิม"}, "C": {"t": "ถามว่าจะอยู่นานแค่ไหน", "r": "พวกเขาจะอยู่สองสัปดาห์ก่อนไปบ้านญาติ คุณรับได้"}, "D": {"t": "พาไปหาที่ที่ชุมชนจัดไว้", "r": "ชุมชนมีที่ว่างที่ดีกว่าข้างรั้วคุณ พวกเขาได้ที่พักที่มีคนดูแล"}}}, "P3": {"title": "ตัวเลขที่สองฝ่ายใช้ต่างกัน", "s": "คนในชุมชนแบ่งสองฝ่ายเรื่องรับผู้มาใหม่ ทั้งสองฝ่ายอ้างตัวเลขเสบียงที่ไม่ตรงกัน", "choices": {"A": {"t": "พูดสนับสนุนการรับผู้มาใหม่", "r": "ฝ่ายรับมีเสียงมากขึ้น แต่ฝ่ายที่กลัวยังไม่สบายใจ"}, "B": {"t": "บอกว่าต้องดูแลคนเดิมก่อน", "r": "ฝ่ายที่กลัวรู้สึกว่ามีคนเข้าใจ แต่ผู้มาใหม่ไม่มีที่ไป"}, "C": {"t": "นับเสบียงจริงต่อหน้าทั้งสองฝ่าย", "r": "นับแล้วรับได้อีกสิบคน ทั้งสองฝ่ายมีตัวเลขเดียวกันให้คุยต่อ"}, "D": {"t": "ให้ที่ประชุมตั้งเงื่อนไขจากตัวเลขที่นับ", "r": "รับผู้มาใหม่ได้สิบคนโดยต้องช่วยงาน ทั้งสองฝ่ายยอมรับ"}}}},
  "R185": {"P2": {"title": "ผู้มาใหม่รู้ทางที่คุณไม่รู้", "s": "ผู้มาใหม่เล่าว่าเพิ่งผ่านถนนเส้นที่คุณใช้หาของ และเห็นด่านใหม่ที่คุณยังไม่รู้", "choices": {"A": {"t": "ช่วยเขาเล่าให้คนในชุมชนฟัง", "r": "หลายบ้านได้ข้อมูลเส้นทางใหม่ ผู้มาใหม่ได้รับการยอมรับมากขึ้น"}, "B": {"t": "ฟังไว้ใช้เอง ไม่บอกต่อ", "r": "คุณเลี่ยงด่านได้ทัน แต่คนอื่นยังไม่รู้"}, "C": {"t": "ถามรายละเอียดว่าผ่านเมื่อไรและเห็นอะไร", "r": "เขาผ่านมาเมื่อวาน ข้อมูลใหม่กว่าข่าว คุณจดไว้"}, "D": {"t": "แลกข้อมูลทางของคุณกับของเขา", "r": "ทั้งคู่ได้รู้ทางเลี่ยงด่านเพิ่ม โดยไม่ต้องพึ่งข่าวลือ"}}}, "P3": {"title": "ข้อมูลของผู้มาใหม่ไม่ตรงกัน", "s": "ผู้มาใหม่สองกลุ่มเล่าสภาพถนนเส้นเดียวกันไม่ตรงกัน กลุ่มหนึ่งว่าผ่านได้ อีกกลุ่มว่าปิด", "choices": {"A": {"t": "ช่วยทั้งสองกลุ่มเล่าให้ชุมชนฟัง", "r": "ชุมชนได้ยินทั้งสองแบบ แต่ยังไม่รู้ว่าเชื่อแบบไหน"}, "B": {"t": "ฟังไว้แต่ไม่บอกต่อ", "r": "คุณรู้ข้อมูลสองแบบ แต่คนอื่นไม่รู้เลย"}, "C": {"t": "ถามว่าแต่ละกลุ่มผ่านเมื่อไร", "r": "กลุ่มแรกผ่านสามวันก่อน กลุ่มหลังผ่านเมื่อวาน ถนนเพิ่งปิด"}, "D": {"t": "ส่งข้อมูลพร้อมวันที่ให้สถานีชุมชนประกาศ", "r": "ทั้งตำบลรู้ว่าถนนปิดตั้งแต่เมื่อวาน ไม่มีใครเดินทางไปเสียเที่ยว"}}}},
  "R186": {"P2": {"title": "ผู้มาใหม่มองบ้านคุณ", "s": "ข้าวในคลังกลางลดลงเร็ว คนบางกลุ่มเริ่มพูดว่าผู้มาใหม่อาจมาขโมยจากบ้านที่มีของมากอย่างบ้านคุณ", "choices": {"A": {"t": "ปกป้องผู้มาใหม่ต่อหน้าทุกคน", "r": "การกล่าวหาเบาลง ผู้มาใหม่เริ่มทักทายคุณ"}, "B": {"t": "ล็อกบ้านให้แน่นหนาขึ้น", "r": "ของของคุณปลอดภัย แต่ความไม่ไว้ใจในชุมชนยังอยู่"}, "C": {"t": "ตรวจบัญชีเบิกข้าวย้อนหลัง", "r": "ข้าวลดลงเพราะครัวกลางทำอาหารเพิ่มวันละมื้อ ไม่มีใครขโมย"}, "D": {"t": "ชวนผู้มาใหม่มาช่วยเฝ้าคลังกลาง", "r": "ผู้มาใหม่มีหน้าที่ของตัวเอง คนเลิกสงสัยเพราะเห็นเขาทำงาน"}}}, "P3": {"title": "ข้าวหายพร้อมผู้มาใหม่", "s": "ข้าวในคลังลดลงเร็วตั้งแต่ผู้มาใหม่กลุ่มล่าสุดมาถึง คนเริ่มโทษพวกเขา", "choices": {"A": {"t": "ปกป้องผู้มาใหม่ต่อหน้าทุกคน", "r": "การกล่าวหาเบาลง แต่บางคนเริ่มมองคุณไม่ดี"}, "B": {"t": "ไม่ยุ่ง เก็บข้าวบ้านคุณไว้ให้ดี", "r": "ข้าวของคุณปลอดภัย แต่ความไม่ไว้ใจในชุมชนยังอยู่"}, "C": {"t": "เทียบบัญชีเบิกข้าวกับจำนวนคนกิน", "r": "ข้าวลดตามจำนวนคนที่เพิ่มพอดี ไม่มีใครขโมย แค่คนกินมากขึ้น"}, "D": {"t": "ให้ทุกคนเห็นบัญชีคลังทุกวัน", "r": "เมื่อทุกคนเห็นตัวเลขเอง การกล่าวหาก็หายไป"}}}},
  "R187": {"P2": {"title": "ผู้มาใหม่ขอทำงานที่บ้านคุณ", "s": "ผู้มาใหม่คนหนึ่งเสนอช่วยซ่อมบ้านและปลูกผักให้คุณ แลกกับที่นอนในโรงเก็บของ", "choices": {"A": {"t": "รับข้อเสนอทันที", "r": "บ้านคุณได้ซ่อมหลายจุด เขาได้ที่พักและมีงานทำ"}, "B": {"t": "ปฏิเสธ ไม่อยากให้คนนอกอยู่ในบ้าน", "r": "บ้านคุณเป็นของคุณเหมือนเดิม เขาต้องหาที่อื่น"}, "C": {"t": "ถามว่าเขาถนัดงานอะไร", "r": "เขาเคยเป็นช่างไม้ คุณให้เขาซ่อมประตูก่อนดูฝีมือ"}, "D": {"t": "ให้ทำงานแลกข้าว แต่ให้ไปนอนที่พักชุมชน", "r": "เขาได้งานและที่พักที่มีคนดูแล บ้านคุณได้ซ่อม"}}}, "P3": {"title": "ทักษะที่ผู้มาใหม่อ้าง", "s": "ผู้มาใหม่เสนอช่วยงานแลกที่พัก คนหนึ่งบอกว่าเป็นพยาบาล แต่ไม่มีเอกสารยืนยัน", "choices": {"A": {"t": "รับข้อเสนอทันที", "r": "ครัวกลางและจุดปฐมพยาบาลมีคนช่วยเพิ่ม ผู้มาใหม่ได้ที่พัก"}, "B": {"t": "บอกว่ามีคนทำอยู่แล้ว", "r": "ไม่มีอะไรเปลี่ยน ผู้มาใหม่ต้องหาที่อื่น"}, "C": {"t": "ให้พยาบาลในชุมชนคุยเรื่องงานกับเขา", "r": "คุยไม่กี่นาทีก็รู้ว่าเป็นพยาบาลจริง เขาได้ช่วยที่จุดปฐมพยาบาลทันที"}, "D": {"t": "ให้ทุกคนลองงานหนึ่งวันก่อนจัดหน้าที่", "r": "ผู้มาใหม่ทุกคนได้งานตรงกับฝีมือจริง"}}}},
  "R188": {"P2": {"title": "ญาติผู้มาใหม่มาเพิ่ม", "s": "ญาติของผู้มาใหม่ที่อยู่ข้างบ้านคุณตามมาสมทบอีกห้าคน เพิงเล็ก ๆ แน่นจนล้นมาถึงรั้วคุณ", "choices": {"A": {"t": "ช่วยหาที่นอนเพิ่มให้", "r": "ครอบครัวได้อยู่พร้อมหน้า ข้างบ้านคุณแออัดขึ้น"}, "B": {"t": "บอกว่ารั้วบ้านคุณต้องว่าง", "r": "ญาติบางส่วนย้ายไปที่อื่น ครอบครัวต้องแยกกันอยู่"}, "C": {"t": "ถามว่าจะอยู่นานแค่ไหน", "r": "พวกเขาอยู่แค่หนึ่งสัปดาห์ก่อนไปบ้านญาติอีกจังหวัด รับได้โดยไม่เดือดร้อน"}, "D": {"t": "ให้ชุมชนหาที่ที่รับครอบครัวใหญ่ได้", "r": "ชุมชนย้ายทั้งครอบครัวไปห้องเรียนว่าง ทุกคนได้อยู่ด้วยกัน"}}}, "P3": {"title": "ญาติที่ตามมามีชื่อซ้ำ", "s": "ญาติของผู้มาใหม่ตามมาอีกห้าคน คุณเห็นว่ามีสองชื่อที่ลงทะเบียนไว้ที่ศูนย์พักพิงอีกแห่งแล้ว", "choices": {"A": {"t": "ช่วยหาที่นอนเพิ่มให้ทุกคน", "r": "ครอบครัวได้อยู่พร้อมหน้า ศาลาแออัดขึ้น"}, "B": {"t": "บอกว่ารับเพิ่มไม่ได้แล้ว", "r": "ที่พักไม่แออัด แต่ครอบครัวต้องแยกกันอยู่"}, "C": {"t": "ถามเรื่องชื่อที่ลงทะเบียนซ้ำ", "r": "สองคนนั้นเพิ่งย้ายจากศูนย์อื่นมาอยู่กับครอบครัว คุณช่วยแจ้งย้ายให้ถูกต้อง"}, "D": {"t": "ให้ชุมชนตัดสินตามกติกาที่มีอยู่", "r": "กติกาให้รับได้ถ้าช่วยงาน ญาติทุกคนลงชื่อรับงาน"}}}},
  "R189": {"P2": {"title": "คุณถูกขอให้ต้อนรับผู้มาใหม่", "s": "ชุมชนตั้งขั้นตอนรับผู้มาใหม่ และอยากให้บ้านที่อยู่ปากซอยอย่างบ้านคุณเป็นจุดแรกที่ผู้มาใหม่แวะ", "choices": {"A": {"t": "รับเป็นจุดต้อนรับ", "r": "ผู้มาใหม่ทุกคนได้คำแนะนำจากคุณ บ้านคุณมีคนแวะทุกวัน"}, "B": {"t": "ปฏิเสธ ขอให้ใช้ศาลาแทน", "r": "บ้านคุณเงียบเหมือนเดิม ผู้มาใหม่ต้องเดินหาศาลาเอง"}, "C": {"t": "ถามว่าจุดต้อนรับต้องทำอะไรบ้าง", "r": "แค่ชี้ทางไปศาลาและบอกกติกาสามข้อ คุณรับได้"}, "D": {"t": "ติดป้ายบอกทางหน้าบ้านแทนการต้อนรับเอง", "r": "ผู้มาใหม่อ่านป้ายแล้วไปศาลาเอง คุณไม่ต้องรับภาระ"}}}, "P3": {"title": "ปัญหาผู้มาใหม่ที่ผ่านมา", "s": "ชุมชนจะตั้งขั้นตอนรับผู้มาใหม่ และขอให้คุณช่วยดู เพราะคุณจดเรื่องที่เกิดขึ้นไว้ทุกครั้ง", "choices": {"A": {"t": "อาสาเป็นคนต้อนรับผู้มาใหม่", "r": "ผู้มาใหม่ทุกคนได้คำแนะนำจากคุณ งานเพิ่มแต่ทุกอย่างเป็นระเบียบ"}, "B": {"t": "ให้บันทึกแต่ไม่ร่วมร่าง", "r": "คนร่างได้ข้อมูล แต่ตีความบางเรื่องผิดไป"}, "C": {"t": "สรุปว่าปัญหาไหนเกิดซ้ำมากที่สุด", "r": "ปัญหาหลักคือไม่มีใครบอกกติกาผู้มาใหม่ ขั้นตอนจึงเริ่มจากการอธิบายกติกา"}, "D": {"t": "ร่างขั้นตอนร่วมกันที่ศาลา", "r": "ได้ขั้นตอนสั้น ๆ สามข้อติดไว้ที่ปากซอย ทุกบ้านใช้ได้"}}}},
  "R190": {"P2": {"title": "ผู้มาใหม่จะมีเสียงเรื่องบ้านคุณ", "s": "ชุมชนถกว่าผู้มาใหม่ควรมีสิทธิ์ร่วมตัดสินเรื่องส่วนกลาง รวมถึงเรื่องที่ขอใช้ของจากบ้านคุณ", "choices": {"A": {"t": "สนับสนุนให้ผู้มาใหม่มีเสียงเท่ากัน", "r": "ผู้มาใหม่รู้สึกเป็นส่วนหนึ่ง และเริ่มช่วยงานส่วนรวมมากขึ้น"}, "B": {"t": "เสนอให้เฉพาะคนเดิมตัดสินเรื่องของบ้านเดิม", "r": "บ้านคุณยังตัดสินเรื่องของตัวเอง ผู้มาใหม่รู้สึกเป็นคนนอก"}, "C": {"t": "ถามว่าเรื่องไหนจะให้ผู้มาใหม่ร่วมตัดสิน", "r": "เป็นแค่เรื่องของส่วนกลาง ไม่เกี่ยวกับของในบ้านใคร คุณสบายใจ"}, "D": {"t": "ให้โหวตและทบทวนทุกสามเดือน", "r": "ได้ข้อสรุปที่ทุกฝ่ายรับได้ และเปลี่ยนได้ถ้าไม่เหมาะ"}}}, "P3": {"title": "ชุมชนอื่นทำอย่างไร", "s": "ชุมชนถกกันว่าผู้มาใหม่ควรมีสิทธิ์ร่วมตัดสินเรื่องส่วนกลางหรือไม่ ทุกคนหันมาถามข้อมูลจากคุณ", "choices": {"A": {"t": "สนับสนุนให้ผู้มาใหม่มีเสียงเท่ากัน", "r": "ผู้มาใหม่รู้สึกเป็นส่วนหนึ่ง แต่คนเดิมบางคนไม่พอใจ"}, "B": {"t": "ให้ข้อมูลแล้วไม่ออกความเห็น", "r": "ที่ประชุมได้ข้อมูล แต่ยังเถียงกันต่อ"}, "C": {"t": "หาว่าตำบลข้างเคียงทำอย่างไรและได้ผลไหม", "r": "ตำบลข้างเคียงให้สิทธิ์หลังอยู่ครบหนึ่งเดือน และไม่มีปัญหา คุณเสนอให้ลองแบบเดียวกัน"}, "D": {"t": "ให้โหวตและทบทวนทุกสามเดือน", "r": "ได้ข้อสรุปที่ทุกฝ่ายรับได้ และเปลี่ยนได้ถ้าไม่เหมาะ"}}}},
  "R194": {"P2": {"title": "กลุ่มแลกของอยากได้ของคุณ", "s": "มีคนชวนตั้งกลุ่มแลกของประจำ และรู้ว่าบ้านคุณมีของเก็บไว้มาก", "choices": {"A": {"t": "เอาของมาลงกลุ่มก่อน", "r": "กลุ่มเริ่มได้ทันที คนอื่นเอาของมาตาม"}, "B": {"t": "ยังไม่ร่วม ดูไปก่อน", "r": "ของคุณยังครบ แต่คุณพลาดของที่แลกได้"}, "C": {"t": "ถามกติกาการแลกให้ชัด", "r": "กติกาชัดว่าแลกตามน้ำหนักและมีคนจด คุณสบายใจที่จะร่วม"}, "D": {"t": "ร่วมเฉพาะของที่คุณมีเกิน", "r": "คุณแลกของเกินได้ของที่ขาด โดยไม่ต้องเอาของทั้งหมดออกมา"}}}, "P3": {"title": "กติกากลุ่มแลกของยังไม่ชัด", "s": "มีคนชวนตั้งกลุ่มแลกของประจำ แต่ยังไม่มีใครรู้ว่าจะชั่งตวงอย่างไร และจะจดอะไรบ้าง", "choices": {"A": {"t": "เอาของมาลงกลุ่มก่อน", "r": "กลุ่มเริ่มได้ทันที แต่มีเรื่องเถียงกันในสัปดาห์แรก"}, "B": {"t": "ยังไม่ร่วม รอดูก่อน", "r": "ของคุณยังครบ แต่คุณพลาดของที่แลกได้"}, "C": {"t": "เขียนกติกาชั่งตวงและการจดให้ชัด", "r": "กติกาชัดว่าแลกตามน้ำหนักและมีคนจด ไม่มีใครเถียง"}, "D": {"t": "ช่วยตั้งวันและที่แลกประจำพร้อมกติกา", "r": "ทุกวันอาทิตย์ที่ศาลามีการแลกของ ชุมชนพึ่งตัวเองได้มากขึ้น"}}}},
  "R195": {"P2": {"title": "คุณยังไม่เคยไปสถานพยาบาล", "s": "สถานพยาบาลกลับมาเปิด คุณดูแลตัวเองมาตลอดและไม่เคยไปตรวจเลยตั้งแต่สงครามเริ่ม", "choices": {"A": {"t": "ไปตรวจ และพาคนแก่ข้างบ้านไปด้วย", "r": "ทั้งคุณและยายได้ตรวจ คุณรู้ว่าความดันสูงกว่าที่คิด"}, "B": {"t": "ไม่ไป ยังรู้สึกแข็งแรงดี", "r": "คุณประหยัดเวลา แต่ไม่รู้ว่าร่างกายเป็นอย่างไร"}, "C": {"t": "ถามว่าวันไหนคนน้อยที่สุด", "r": "วันพฤหัสคนน้อยกว่าครึ่ง คุณไปตรวจโดยไม่ต้องรอนาน"}, "D": {"t": "นัดตรวจพร้อมเพื่อนบ้านที่ยังไม่เคยไป", "r": "ได้คิวเป็นกลุ่ม ห้าคนได้ตรวจครั้งแรกในรอบปี"}}}, "P3": {"title": "คิวสถานพยาบาลไม่เป็นธรรม", "s": "สถานพยาบาลเปิดสัปดาห์ละสามวัน คุณสังเกตว่าคนที่มาตีห้าได้คิวก่อน แต่คนป่วยหนักมาเร็วไม่ไหว", "choices": {"A": {"t": "พาคนแก่ที่ไปเองไม่ได้ไปด้วย", "r": "ยายสองคนได้ตรวจ คุณเสียเวลาครึ่งวัน"}, "B": {"t": "ไปเฉพาะเมื่อคุณจำเป็น", "r": "คุณประหยัดเวลา คนป่วยหนักยังได้คิวท้าย"}, "C": {"t": "ดูว่าคนป่วยหนักต้องรอนานแค่ไหน", "r": "คนป่วยหนักรอเฉลี่ยห้าชั่วโมง คุณเสนอให้มีคิวแยกตามอาการ"}, "D": {"t": "รวมรายชื่อคนป่วยหนักไปนัดคิวพิเศษ", "r": "สถานพยาบาลเปิดคิวแยก คนป่วยหนักได้ตรวจก่อนโดยไม่ต้องมาตีห้า"}}}},
  "R196": {"P2": {"title": "บ่อของคุณยังไม่ได้ตรวจ", "s": "ผลตรวจน้ำบางจุดออกมาแล้ว แต่บ่อน้ำหลังบ้านคุณที่ใช้มาตลอดยังไม่เคยตรวจ", "choices": {"A": {"t": "ให้ตรวจ และให้เพื่อนบ้านใช้ถ้าผลดี", "r": "บ่อของคุณผ่านการตรวจ กลายเป็นจุดน้ำของซอย"}, "B": {"t": "ใช้ต่อไปโดยไม่ตรวจ", "r": "คุณใช้น้ำเหมือนเดิม แต่ไม่รู้ว่าปลอดภัยแค่ไหน"}, "C": {"t": "ส่งตัวอย่างไปตรวจเงียบ ๆ", "r": "ผลตรวจบอกว่าต้องต้มก่อนดื่ม คุณปรับวิธีใช้ทันที"}, "D": {"t": "ตรวจพร้อมบ่อของบ้านอื่น", "r": "ตรวจครบทุกบ่อในซอย ทุกบ้านรู้ว่าน้ำของตัวเองเป็นอย่างไร"}}}, "P3": {"title": "จุดน้ำที่ยังไม่ได้ตรวจ", "s": "ผลตรวจน้ำบางจุดออกมาแล้ว คุณเห็นว่าจุดที่คนใช้มากที่สุดยังไม่อยู่ในรายการตรวจ", "choices": {"A": {"t": "ช่วยเก็บตัวอย่างน้ำจุดที่ยังไม่ตรวจ", "r": "ได้ตัวอย่างเพิ่มห้าจุด ผลจะออกสัปดาห์หน้า"}, "B": {"t": "ใช้เฉพาะน้ำจากจุดที่ตรวจแล้ว", "r": "คุณปลอดภัย แต่ต้องเดินไกลขึ้น"}, "C": {"t": "นับว่าแต่ละจุดมีคนใช้กี่บ้าน", "r": "บ่อหลังวัดใช้มากที่สุดแต่ยังไม่ตรวจ คุณขอให้ตรวจจุดนี้ก่อน"}, "D": {"t": "ทำแผนที่จุดน้ำพร้อมผลตรวจติดที่ศาลา", "r": "ทุกคนรู้ว่าจุดไหนปลอดภัย แผนที่ถูกอัปเดตทุกครั้งที่มีผลใหม่"}}}},

  for(var i=0;i<3;i++){var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+i*0.07);g.gain.linearRampToValueAtTime(0.05,t+i*0.07+0.01);g.gain.linearRampToValueAtTime(0,t+i*0.07+0.05);o.connect(g);g.connect(SND.layers.crick);o.start(t+i*0.07);o.stop(t+i*0.07+0.06);}
}
/* ---- music (director approved 27 Oct: synthesized, no files). Slow A-minor pad + sparse plucked notes with echo.
   Mood follows the scene: day = fuller · night = lower and sparser · health < 30 = dark pad, no melody · dead = fades out. */
var MUS={bus:null,pad:null,mel:null,lp:null,next:0,chord:0,noteAt:0,mode:"",timer:null};
var MUS_CHORDS=[[110,130.81,164.81],[87.31,110,130.81],[73.42,87.31,110],[82.41,103.83,123.47]];   /* Am · F · Dm · E */
var MUS_SCALE=[220,261.63,293.66,329.63,392,440,523.25,587.33,659.25];                              /* A-minor pentatonic */
var MUS_MOOD={menu:{pad:0.050,mel:0.040,rate:0.45,oct:1,cut:900},day:{pad:0.050,mel:0.045,rate:0.55,oct:1,cut:1000},
  night:{pad:0.042,mel:0.032,rate:0.32,oct:0.5,cut:650},low:{pad:0.040,mel:0,rate:0,oct:0.5,cut:380},dead:{pad:0,mel:0,rate:0,oct:0.5,cut:300},
  intro:{pad:0.058,mel:0.030,rate:0.30,oct:0.5,cut:620}};   /* opening film (28 Oct): low and slow under the narration */
function musInit(){
  var c=SND.ctx; if(!c||MUS.bus) return;
  MUS.bus=c.createGain(); MUS.bus.gain.value=1; MUS.bus.connect(SND.master);
  MUS.lp=c.createBiquadFilter(); MUS.lp.type="lowpass"; MUS.lp.frequency.value=900; MUS.lp.Q.value=0.4;
  MUS.pad=c.createGain(); MUS.pad.gain.value=0; MUS.pad.connect(MUS.lp); MUS.lp.connect(MUS.bus);
  MUS.mel=c.createGain(); MUS.mel.gain.value=0; MUS.mel.connect(MUS.bus);
  var dl=c.createDelay(1.5), fb=c.createGain(), dlf=c.createBiquadFilter(); dl.delayTime.value=0.42; fb.gain.value=0.34; dlf.type="lowpass"; dlf.frequency.value=2200;
  MUS.mel.connect(dl); dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(MUS.bus);
  MUS.next=c.currentTime+0.2; MUS.noteAt=c.currentTime+2.5;
  MUS.timer=setInterval(musTick,250);
}
function musChord(t,freqs,len){
  var c=SND.ctx;
  freqs.forEach(function(f,i){
    [0,4].forEach(function(cent,j){
      var o=c.createOscillator(), g=c.createGain(); o.type=j?"triangle":"sine";
      o.frequency.value=f*Math.pow(2,cent/1200);
      var v=(j?0.45:1)/freqs.length;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+3.2); g.gain.setValueAtTime(v,t+len-0.4); g.gain.linearRampToValueAtTime(0,t+len+3.2);
      o.connect(g); g.connect(MUS.pad); o.start(t); o.stop(t+len+3.4);
    });
  });
}
function musNote(t,f){
  var c=SND.ctx;
  [[1,"sine",1],[2,"sine",0.22],[3,"triangle",0.06]].forEach(function(h){
    var o=c.createOscillator(), g=c.createGain(); o.type=h[1]; o.frequency.value=f*h[0];
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(h[2],t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+2.4/h[0]);
    o.connect(g); g.connect(MUS.mel); o.start(t); o.stop(t+2.6);
  });
}
function musTick(){
  var c=SND.ctx; if(!c||!MUS.bus||c.state!=="running") return;
  var m=MUS_MOOD[MUS.mode]||MUS_MOOD.menu, now=c.currentTime, len=9;
  if(MUS.next<now+0.6){ if(m.pad>0) musChord(MUS.next,MUS_CHORDS[MUS.chord%4],len); MUS.chord++; MUS.next+=len; }
  if(m.rate>0&&MUS.noteAt<now+0.4){
    if(Math.random()<m.rate){ var ch=MUS_CHORDS[(MUS.chord+3)%4], pool=MUS_SCALE.slice(0,7);
      var f=Math.random()<0.5? ch[Math.floor(Math.random()*3)]*4 : pool[Math.floor(Math.random()*pool.length)];
      musNote(MUS.noteAt,f*(m.oct<1?0.5:1)); }
    MUS.noteAt+=1.3+Math.random()*2.2;
  }
}
function musSet(mode){
  if(!MUS.bus||MUS.mode===mode) return; MUS.mode=mode; var m=MUS_MOOD[mode], t=SND.ctx.currentTime;
  MUS.pad.gain.setTargetAtTime(m.pad,t,2.5); MUS.mel.gain.setTargetAtTime(m.mel,t,2.0); MUS.lp.frequency.setTargetAtTime(m.cut,t,3);
}
function sndSet(layer,v,tc){var g=SND.layers[layer];if(g&&SND.ctx)g.gain.setTargetAtTime(v,SND.ctx.currentTime,tc||1.5);}
/* pick layers from the current scene: hour, weather arc, health */
function sndMood(){
  if(!SND.ctx||!st||view!=="game"){ if(SND.ctx){sndSet("wind",0.10);sndSet("crick",0);sndSet("rain",0);sndSet("drone",0);musSet("menu");} return; }
  var cur=E.currentEvent(st), h=(st.phase==="event"&&cur)?cur.hour:21.5, ev=cur&&cur.ev;
  var night=h>=19||h<6, rain=!!(ev&&(st.phase==="event"||st.phase==="result")&&ev.arc==="สภาพอากาศ")||!!(st.phase==="summary"&&st.summary&&st.summary.rain), low=st.stats.health<30, dead=st.phase==="dead";
  sndSet("wind",dead?0.03:(night?0.10:0.16)); sndSet("crick",night&&!dead?0.9:0); sndSet("rain",rain?0.06:0); sndSet("drone",dead?0.10:(low?0.08:0),2.5);
  musSet(dead?"dead":low?"low":night?"night":"day");
}
function cue(kind){
  var c=SND.ctx; if(!c||!SND.on) return; var t=c.currentTime;
  function tone(f,dur,vol,type,at){var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+(at||0));g.gain.linearRampToValueAtTime(vol,t+(at||0)+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+(at||0)+dur);o.connect(g);g.connect(SND.master);o.start(t+(at||0));o.stop(t+(at||0)+dur+0.05);}
  if(kind==="tick") tone(880,0.08,0.05,"triangle");
  else if(kind==="day"){tone(196,1.6,0.08);tone(294,1.4,0.04,"sine",0.02);}
  else if(kind==="hurt"){tone(70,0.5,0.25,"sine");tone(110,0.25,0.08,"square");}
  else if(kind==="death"){tone(110,3,0.10);tone(82,3.5,0.08,"sine",0.4);}
}
function sndToggle(){
  SND.on=!SND.on; save("ww3ts.sound.v1",SND.on);
  if(SND.on){ if(!SND.ctx) sndInit(); else {SND.ctx.resume();SND.master.gain.setTargetAtTime(0.55,SND.ctx.currentTime,0.4);} }
  else if(SND.ctx){SND.master.gain.setTargetAtTime(0.0001,SND.ctx.currentTime,0.2);}
  document.querySelectorAll(".sndbtn").forEach(function(b){b.textContent=SND.on?"เสียง: เปิด":"เสียง: ปิด";b.setAttribute("aria-pressed",SND.on?"true":"false");});
}
function sndBtn(){return '<button class="sndbtn" aria-pressed="'+(SND.on?"true":"false")+'">'+(SND.on?"เสียง: เปิด":"เสียง: ปิด")+'</button>';}
document.addEventListener("pointerdown",function(){ if(SND.on){ if(!SND.ctx) sndInit(); else if(SND.ctx.state==="suspended") SND.ctx.resume(); } },{capture:true});
document.addEventListener("click",function(e){ if(e.target.closest&&e.target.closest(".sndbtn")) sndToggle(); });
document.addEventListener("visibilitychange",function(){ if(!SND.ctx) return; if(document.hidden) SND.ctx.suspend(); else if(SND.on) SND.ctx.resume(); });

function period(h){return h<9?"ช่วงเช้า":h<12?"ช่วงสาย":h<16?"ช่วงบ่าย":h<19?"ช่วงเย็น":h<22?"ช่วงค่ำ":"กลางดึก";}
function tint(h){
  if(h<9) return "linear-gradient(180deg,rgba(255,214,160,.25),rgba(120,110,90,.15))";
  if(h<16) return "linear-gradient(180deg,rgba(255,255,255,0),rgba(90,90,80,.12))";
  if(h<19) return "linear-gradient(180deg,rgba(230,150,90,.38),rgba(80,60,50,.25))";
  if(h<22) return "linear-gradient(180deg,rgba(60,70,120,.62),rgba(30,30,50,.55))";
  return "linear-gradient(180deg,rgba(20,26,60,.82),rgba(10,10,25,.75))";
}
/* outdoor scenes are 16:9 photos: size them a little larger than the scene so each event can show a different part (28 Oct) */
function sizeLoc(){var el=document.querySelector(".scene .bg.loc");if(!el)return;var r=el.getBoundingClientRect();if(!r.width||!r.height)return;var w=Math.max(r.width,r.height*1.778)*1.14;el.style.backgroundSize=Math.round(w)+"px auto";}
window.addEventListener("resize",function(){try{sizeLoc();}catch(e){}});
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function chip(k,v){var s=STAT[k];return '<span class="chip num '+(v>0?"up":"down")+'">'+esc(s?s.th:k)+" "+(v>0?"+":"")+v+"</span>";}

/* ---- online leaderboard (director approved 27 Oct): artifact db, one best run per player ----
   board/<viewer id> = {name, occ, province, days, cause, at}. Everyone who can open the page reads;
   each player (Contributor and up) writes only their own document. Works without it (local board stays). */
var NET={provider:null,db:null,uid:null,rows:null,state:"off",unsub:null,sent:false,sending:false,err:""};
var CFG=window.WW3_ONLINE||{};
function supaOn(){return !!(CFG.supabaseUrl&&CFG.anonKey);}
function clientId(){var id=load("ww3ts.client.v1",null);if(!id){id=(crypto&&crypto.randomUUID)?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,function(c){return (c^Math.random()*16>>c/4).toString(16);});save("ww3ts.client.v1",id);}return id;}
function supaFetch(path,opt){opt=opt||{};var h={apikey:CFG.anonKey,Authorization:"Bearer "+CFG.anonKey,"Content-Type":"application/json"};
  for(var k in (opt.headers||{}))h[k]=opt.headers[k];
  return fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/"+path,{method:opt.method||"GET",headers:h,body:opt.body});}
function supaLoad(){
  NET.state="loading";refreshBoards();
  supaFetch("runs?select=nickname,char_name,occupation,province,days,cause,client_id&order=days.desc,created_at.asc&limit=20")
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(a){var me=clientId();NET.rows=a.map(function(x){return {nick:String(x.nickname||""),name:String(x.char_name||""),occ:String(x.occupation||""),province:String(x.province||""),days:+x.days||0,cause:String(x.cause||""),mine:x.client_id===me};});NET.state="on";refreshBoards();})
    .catch(function(){NET.state="off";NET.err="โหลดอันดับไม่ได้";refreshBoards();});
}
function initOnline(){
  if(supaOn()){NET.provider="supa";supaLoad();return;}
  if(!(window.claude&&claude.use)) return;
  NET.provider="claude"; NET.state="loading";
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    NET.db=r[0]; var u=r[1];
    if(!NET.db){NET.state="off";refreshBoards();return;}
    return (u?u.id():Promise.resolve(null)).then(function(id){
      NET.uid=id||null; NET.state="on";
      try{
        NET.unsub=NET.db.collection("board").orderBy("days","desc").limit(20).onSnapshot(function(s){
          NET.rows=s.docs.map(function(d){var x=d.data()||{};return {name:String(x.name||""),occ:String(x.occ||""),province:String(x.province||""),days:+x.days||0,cause:String(x.cause||""),mine:!!NET.uid&&d.id===NET.uid};});
          refreshBoards();
        },function(){NET.state="off";refreshBoards();});
      }catch(e){NET.state="off";}
      refreshBoards();
    });
  }).catch(function(){NET.state="off";refreshBoards();});
}
function onlineBoardHTML(n){
  if(NET.state==="loading"||(NET.state==="on"&&!NET.rows)) return '<p class="note">กำลังโหลดอันดับ…</p>';
  if(NET.state!=="on") return '<p class="note">'+(NET.err?esc(NET.err)+' · ':'')+'อันดับออนไลน์ยังไม่เปิดในหน้านี้ ตอนนี้แสดงเฉพาะสถิติในเครื่อง</p>';
  var rows=NET.rows.slice(0,n||20);
  if(!rows.length) return '<p class="note">ยังไม่มีใครส่งสถิติ ชีวิตแรกที่จบลงจะขึ้นอันดับที่นี่</p>';
  return '<div class="tbl" style="overflow-x:auto"><table class="board"><tr><th>#</th><th>ผู้เล่น · ตัวละคร</th><th>รอด (วัน)</th><th>สาเหตุ</th></tr>'+
    rows.map(function(r,i){return '<tr'+(r.mine?' class="me"':'')+'><td class="num">'+(i+1)+'</td><td>'+(r.nick?'<b>'+esc(r.nick)+'</b> · ':'')+esc(r.name)+' · '+esc(r.occ)+(r.mine?' <b class="you">คุณ</b>':'')+'<br><span class="note">'+esc(r.province)+'</span></td><td class="num">'+r.days+'</td><td>'+esc(r.cause||"–")+'</td></tr>';}).join("")+'</table></div>';
}
function refreshBoards(){
  document.querySelectorAll("[data-online-board]").forEach(function(el){el.innerHTML=onlineBoardHTML(+el.getAttribute("data-online-board")||20);});
  var f=document.getElementById("submitBox"); if(f) f.outerHTML=submitBoxHTML();
  bindSubmit();
}
/* Claude provider: auto-submit own best (unchanged). Supabase provider: player types a nickname and presses send. */
function submitOnline(run){
  if(NET.provider!=="claude"||!NET.db||!NET.uid) return;
  var ref; try{ref=NET.db.collection("board").doc(NET.uid);}catch(e){return;}
  ref.get().then(function(s){var cur=s.exists?(+(s.data()||{}).days||0):-1;if(run.days>cur) return ref.set(run);})
    .then(function(){NET.sent=true;},function(){});
}
function submitBoxHTML(){
  if(NET.provider!=="supa"||!st||(st.phase!=="dead"&&st.phase!=="ending")) return '<div id="submitBox"></div>';
  if(NET.sent) return '<div id="submitBox"><p class="note">ส่งขึ้นอันดับแล้ว</p></div>';
  return '<div id="submitBox" class="row" style="gap:8px;margin-top:6px;align-items:center"><input id="nick" maxlength="20" placeholder="ชื่อเล่นที่จะขึ้นอันดับ" value="'+esc(load("ww3ts.nick.v1","")||"")+'" style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit"><button class="btn" id="sendRun"'+(NET.sending?' disabled':'')+'>'+(NET.sending?'กำลังส่ง…':'ส่งขึ้นอันดับ')+'</button>'+(NET.err&&NET.state==="on"?'<p class="note" style="width:100%;color:var(--bad)">'+esc(NET.err)+'</p>':'')+'</div>';
}
function bindSubmit(){
  var b=document.getElementById("sendRun"); if(!b||b._bound) return; b._bound=true;
  b.addEventListener("click",function(){
    var nick=(document.getElementById("nick").value||"").trim().slice(0,20);
    if(!nick){NET.err="ใส่ชื่อเล่นก่อนส่ง";refreshBoards();return;}
    save("ww3ts.nick.v1",nick); NET.sending=true; NET.err=""; refreshBoards();
    var body={client_id:clientId(),nickname:nick,char_name:st.char.name,occupation:st.char.occupation,province:st.char.province,days:E.daysSurvived(st),cause:(st.phase==="ending"?"รอดจนจบ · "+D.chapters.endings[st.ending.key].title:causeTh(st.deathCause)),events:st.playEvents||0,play_seconds:Math.round(st.playSec||0),game_version:CFG.gameVersion||""};
    supaFetch("runs",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)})
      .then(function(r){NET.sending=false;if(!r.ok)throw 0;NET.sent=true;st.submitted=true;persist&&persist();supaLoad();})
      .catch(function(){NET.sending=false;NET.err="ส่งไม่สำเร็จ ลองใหม่อีกครั้งในอีกสักครู่";refreshBoards();});
  });
}

function chapIntroHTML(day){
  var ci=st.chapterIntro, C=D.chapters; if(!C||!ci||ci.day!==day) return "";
  var ch=C.list[ci.n-1], dec=C.decisions.filter(function(d){return d.id===ci.from;})[0];
  return '<div class="chap" id="chapIntro" role="button" tabindex="0" title="แตะเพื่ออ่านเต็ม"><div class="chapt"><b>เข้าสู่บทที่ '+ci.n+' · '+esc(ch.title)+'</b><br>'+esc(ch.intro)+(dec&&dec.next[ci.key]?' · '+esc(dec.next[ci.key]):'')+((ci.extra||[]).map(function(l){return ' · '+esc(l);}).join(""))+'</div></div>';
}
function isFinalNight(){var C=D.chapters;if(!C||st.chapter<C.list.length)return false;return !E.availableArcs(st).length;}
function nextDayLabel(){return isFinalNight()?"ดูบทสรุปชีวิต":"เช้าวันที่ "+(st.day+1);}
/* explore (28 Oct prototype, ?test=1 only) */
function exploreHTML(){
  var ex=st.explore, X=B.night.explore, a0=B.night.actions.filter(function(a){return a.key==="scavenge";})[0], pl=a0.places.filter(function(p){return p.id===ex.place;})[0];
  var pct=Math.round(ex.noise/(X.noiseMax||100)*100), lvl=pct>=80?"bad":pct>=55?"warn":"ok";
  var msg=ex.caught?'<p class="exmsg bad">ถูกเจอ! คุณวิ่งหนีจนบาดเจ็บ และทิ้งของไปครึ่งหนึ่ง</p>':pct>=80?'<p class="exmsg bad">มีคนกำลังเดินมาทางนี้</p>':pct>=55?'<p class="exmsg warn">ได้ยินเสียงฝีเท้าอยู่ไม่ไกล</p>':'<p class="exmsg">ยังเงียบอยู่ ค้นได้อีก</p>';
  var spots=ex.spots.map(function(id){var sp=E.exploreSpot(ex.place,id),done=ex.searched[id];
    return '<button class="spot'+(done?' done':'')+'" data-spot="'+id+'"'+(done||ex.ended?' disabled':'')+'><b>'+esc(sp.th)+'</b><small>'+(done?(Object.keys(done).length?Object.keys(done).map(function(k){return esc(E.itemDef(k).th)+' +'+done[k];}).join(" · "):'ว่างเปล่า'):'แตะเพื่อค้น')+'</small></button>';}).join("");
  var carry=Object.keys(ex.loot).filter(function(k){return ex.loot[k];});
  return '<article class="card event explore"><div class="eyebrow">คืนวันที่ '+st.day+' · ออกค้นหา · '+esc(pl.th)+'</div>'+
    '<div class="noise '+lvl+'"><span>เสียง</span><div class="nbar"><i style="width:'+pct+'%"></i></div><b class="num">'+pct+'%</b></div>'+msg+
    '<div class="spots">'+spots+'</div>'+
    '<div class="chips" style="margin-top:6px">'+(carry.length?itemChips(ex.loot,false):'<span class="chip none">ยังไม่ได้อะไร</span>')+'</div>'+
    '<div class="foot"><button class="btn primary" id="exLeave">กลับบ้าน</button></div></article>';
}
function nightPlace(nr){var act=(B.night.actions.filter(function(a){return a.key===nr.key;})[0])||{};return act.places&&act.places.filter(function(p){return p.id===nr.place;})[0];}
function nightText(nr){
  var act=(B.night.actions.filter(function(a){return a.key===nr.key;})[0])||{}, pl=act.places&&act.places.filter(function(p){return p.id===nr.place;})[0];
  var o;
  if(nr.key==="travel") o={tag:"เดินทาง",h:"เดินทางข้ามจังหวัด",p:"คุณใช้ทั้งคืนเดินทางจนถึง"+(nr.to||st.char.province)};
  else if(nr.key==="scavenge"&&nr.explore){var ns=Object.keys(nr.explore.searched).map(function(id){return E.exploreSpot(nr.place,id).th;});o={tag:"ออกค้นหา · "+pl.th,h:nr.explore.caught?"ถูกเจอระหว่างค้น":"กลับมาพร้อมของ",p:"คุณค้น "+ns.length+" จุด: "+ns.join(" ")+(nr.explore.caught?" แต่ถูกเจอ ต้องวิ่งหนีจนบาดเจ็บ และทิ้งของไปครึ่งหนึ่ง":" แล้วกลับก่อนมีใครมาเจอ")};}
  else if(nr.key==="scavenge") o=nr.injury?{tag:"ออกค้นหา · "+pl.th,h:"บาดเจ็บระหว่างทาง",p:"คุณพลาดล้มขณะค้น"+pl.th+" ได้ของกลับมาแค่ครึ่งเดียว"}:{tag:"ออกค้นหา · "+pl.th,h:"กลับมาพร้อมของ",p:"คุณค้น"+pl.th+"จนเกือบสว่าง ได้อาหารและน้ำกลับมา"};
  else if(nr.key==="build"){var bd=E.buildDef(nr.build);o={tag:"สร้างของ",h:"สร้าง"+bd.th+"เสร็จ",p:"คุณใช้ทั้งคืนประกอบ"+bd.th+" ตอนนี้ตั้งอยู่ในบ้านแล้ว ตั้งแต่พรุ่งนี้: "+buildEffectText(bd),img:A.props[bd.prop]};}
  else if(nr.key==="share") o={tag:"แบ่งของให้ต้น",h:"ของไปถึงสองแม่ลูก",p:"คุณแบกข้าวและน้ำไปที่อาคารร้างหลังตลาด แม่ของต้นลุกขึ้นนั่งได้แล้ว"};
  else if(nr.key==="guard") o=nr.repelled?{tag:"เฝ้าบ้าน",h:"ไล่โจรไปได้",p:"ตีสองมีคนมางัดรั้วหลังบ้าน คุณส่งเสียงและส่องไฟ พวกเขาวิ่งหนีไป ของในคลังไม่หาย"}:{tag:"เฝ้าบ้าน",h:"เฝ้าบ้านทั้งคืน",p:"คุณนั่งเฝ้าประตูจนฟ้าสาง ไม่มีใครเข้าใกล้บ้าน"};
  else o={tag:"นอนพัก",h:"นอนพักทั้งคืน",p:"คุณได้นอนเต็มคืน ตื่นมาพร้อมแรงที่กลับมา"};
  if(nr.raid) o.p+=" แต่ระหว่างคืนมีคนงัดเข้ามาขโมยของในคลังไปครึ่งหนึ่ง";
  else if(st.flags&&st.flags.dog&&nr.key!=="guard"&&nr.key!=="travel") o.p+=" หมาที่บ้านนอนเฝ้าประตูทั้งคืน";
  return o;
}
function doNight(k,p){
  E.night(st,k,p);
  plog("night",{note:k+(p?":"+p:"")+(st.nightResult&&st.nightResult.injury?" injury -"+st.nightResult.injury:"")+(st.nightResult&&st.nightResult.raid?" raid":"")});
  if(st.phase==="dead"){cue("death");recordDeath();}else cue(st.nightResult&&(st.nightResult.injury||st.nightResult.raid)?"hurt":"tick");
  persist();render();focusMain();
}

function renderGame(){
  var cur=E.currentEvent(st), ev=cur&&cur.ev, hour=cur?cur.hour:21.5;
  if(st.phase==="summary"||st.phase==="dead"||st.phase==="night"||st.phase==="ending"){ev=null;hour=st.phase==="night"?23.5:21.5;}
  var head='<div class="dayline"><h2>วันที่ <span class="num">'+st.day+'</span></h2><span class="meta">'+(ev?period(hour)+' · <span class="num">'+hhmm(hour)+'</span> · ':'')+esc(st.char.province)+'</span>'+pipsHTML()+'</div>';
  var body="";
  if(st.phase==="event"){
    var sk2=st.day+"-"+st.qi+"-"+ev.id; if(sk2!==shownKey){shownKey=sk2;shownAt=Date.now();}
    var rec=E.recallFor(st,ev);
    body='<article class="card event"><div class="eyebrow">'+chapTag()+(ev.effectsArc?'จุดตัดสินใจท้ายบท':ev.twist?esc(period(hour)):esc(period(hour))+' · '+esc(ev.arc))+(opts.ids?' · '+ev.id+(ev.path?' · '+ev.path+' '+D.branchRule.names[ev.path]:''):'')+'</div><h3>'+esc(ev.title)+'</h3>'+
      '<p class="scene-text">'+esc(ev.s)+(ev.sf&&ev.sf!==ev.s?' <button class="more" id="fullScene">อ่านเต็ม</button>':'')+'</p>'+
      (rec?(rec.same?'<div class="recall">เคยเจอเรื่องนี้ (วันที่ <span class="num">'+rec.day+'</span>) ครั้งก่อนคุณเลือก: <b>'+esc(rec.text)+'</b></div>':'<div class="recall">ครั้งก่อน (วันที่ <span class="num">'+rec.day+'</span> · '+esc(rec.title)+') คุณเลือก: <b>'+esc(rec.text)+'</b></div>'):'')+
      '<div class="choices">'+ev.choices.map(function(c){
        var peek=(opts.peek&&!ev.twist)?'<span class="peek chips">'+chips(E.effectsFor(ev,c.k))+'</span>':'';
        return '<button class="choice" data-k="'+c.k+'"><span class="k">'+c.k+'</span><span>'+esc(c.t)+peek+'</span></button>';}).join("")+'</div></article>';
  } else if(st.phase==="result"){
    var r=st.lastResult;
    body='<article class="card event result"><div class="eyebrow">ผลการตัดสินใจ · '+esc(ev.title)+'</div><h3>'+esc(r.key)+' · '+esc(r.text)+'</h3>'+
      '<p>'+esc(r.result)+(r.resultFull&&r.resultFull!==r.result?' <button class="more" id="fullResult">อ่านเต็ม</button>':'')+'</p><div class="chips">'+chips(r.delta)+'</div>'+
      '<div class="foot"><button class="btn primary" id="next">'+(st.qi+1<st.queue.length?"เหตุการณ์ถัดไป":"จบวัน")+'</button></div></article>';
  } else if(st.phase==="summary"&&st.explore){
    body=exploreHTML();
  } else if(st.phase==="summary"){
    var s=st.summary;
    var provs=B.character.provinces.filter(function(p){return p!==st.char.province;});
    var warn=[];if(s.accident)warn.push('เกิดอุบัติเหตุ บาดเจ็บ สุขภาพ −'+s.accident);if(s.lowReasons.length)warn.push('สุขภาพลดลงเพราะ '+s.lowReasons.map(function(k){return STAT[k].th;}).join(", ")+' ต่ำเกินไป');
    body='<article class="card"><div class="eyebrow">สรุปวันที่ '+s.day+(s.rain?' · ฝนตก':'')+(B.night?' · ผ่านไปอีกหนึ่งวัน</div><div style="height:8px"></div>':'</div><h3 style="font-family:var(--f-display);margin:4px 0 10px">ผ่านไปอีกหนึ่งวัน</h3>')+
      '<div class="chips sumchips">'+chips(s.total)+'</div>'+
      (warn.length?'<p class="note" style="color:var(--bad);margin-top:8px">'+warn.join(' · ')+'</p>':'')+
      chapIntroHTML(s.day)+
      (B.stock&&E.traderHere(st)?'<button class="trader" id="traderOpen">'+(A.npc[TRADER_NPC]?'<img alt="" src="'+A.npc[TRADER_NPC]+'">':'')+'<span><b>'+esc(B.stock.trader.name)+'มาเคาะประตู</b><small>แลกของได้เฉพาะวันนี้</small></span><span class="go">ดูของ ›</span></button>':'')+
      (B.stock?stockBarHTML():'')+
      (B.night?(B.stock?'':'<p class="sec-h" style="margin:12px 0 6px">คืนนี้จะทำอะไร</p>')+'<div class="nopts">'+E.nightActions(st).map(function(a){var g=a.key==="guard",tired=a.key==="sleep"&&st.stats.energy<30;return '<button class="nopt'+(tired?' rec':'')+'" data-n="'+a.key+'">'+esc(a.th)+'<small'+(g?' class="keep"':'')+'>'+esc(g?'เสี่ยงถูกปล้น '+Math.round(E.raidChance(st)*100)+'%':tired?'พลังงานต่ำ ควรพัก':(NIGHT_HINT[a.key]||""))+'</small></button>';}).join("")+'</div>':'')+
      '<div class="foot" style="justify-content:space-between;align-items:center"><span class="row" style="gap:12px"><button class="more" id="dayLog">สิ่งที่เลือกวันนี้</button>'+(B.travel.enabled?'<button class="more" id="travelOpen">'+(st.travelledToday?'เดินทางแล้ววันนี้':'ย้ายจังหวัด')+'</button>':'')+""+'</span>'+(B.night?'':'<button class="btn primary" id="nextday">'+nextDayLabel()+'</button>')+'</div></article>';
  } else if(st.phase==="night"&&E.encounterPending(st)){
    var en0=E.encounterDef(st.nightResult.enc), pl0=nightPlace(st.nightResult);
    body='<article class="card event"><div class="eyebrow">คืนวันที่ '+st.day+' · ออกค้นหา · '+esc(pl0?pl0.th:"")+'</div><h3>'+esc(en0.title)+'</h3><p class="scene-text">'+esc(en0.s)+'</p>'+
      '<div class="choices">'+en0.choices.map(function(c){var ok=E.canEncounter(st,c),need={};for(var x in (c.items||{}))if(c.items[x]<0)need[x]=-c.items[x];

      '<div class="foot"><button class="btn primary" id="nextday">'+nextDayLabel()+'</button></div></article>';
  } else if(st.phase==="ending"){
    var en=st.ending, EN=D.chapters.endings[en.key], tl=D.chapters.endingTail[en.tail], KN=D.chapters.keyNames;

      '<div class="foot" style="margin-top:8px"><button class="btn" id="home2">หน้าแรก</button><button class="btn primary" id="again">เริ่มชีวิตใหม่</button>'+(opts.test?'<button class="btn ghost" id="logExport2">ส่งออกบันทึกทดสอบ</button>':'')+'</div>'+
      submitBoxHTML()+'<p class="sec-h" style="margin-top:14px">อันดับออนไลน์</p><div data-online-board="10">'+onlineBoardHTML(10)+'</div><p class="sec-h" style="margin-top:12px">เครื่องนี้</p>'+boardHTML()+'</article>';

      '<p class="rcause">เสียชีวิตจาก<b>'+esc(causeTh(st.deathCause))+'</b> คืนวันที่ '+st.deathDay+'</p>'+

      '<div class="foot" style="margin-top:8px"><button class="btn" id="home2">หน้าแรก</button><button class="btn primary" id="again">เริ่มชีวิตใหม่</button>'+(opts.test?'<button class="btn ghost" id="logExport2">ส่งออกบันทึกทดสอบ</button>':'')+'</div>'+

  on("fullResult",function(){var r=st.lastResult;openSheet('<div class="eyebrow">ผลการตัดสินใจ · ข้อความเต็ม</div><h3 style="font-family:var(--f-display);margin:0">'+esc(r.key)+' · '+esc(r.text)+'</h3><p>'+esc(r.resultFull)+'</p>');});

  on("dayLog",function(){var s=st.summary;openSheet('<div class="eyebrow">สรุปวันที่ '+s.day+'</div><ul class="log">'+s.log.map(function(l){return '<li><b>'+esc(l.title)+'</b> → '+esc(l.key)+' · '+esc(l.text)+'</li>';}).join("")+'</ul>');});
  on("travelOpen",function(){
    if(st.travelledToday)return;
    var provs=B.character.provinces.filter(function(p){return p!==st.char.province;});
    openSheet('<div class="eyebrow">ย้ายไปจังหวัดอื่น · ไม่บังคับ</div><p class="note">'+(E.canTravel(st)?'ใช้แรงและเสี่ยง: '+Object.keys(B.travel.cost).map(function(k){return STAT[k].th+" "+B.travel.cost[k];}).join(", "):'พลังงานต้องไม่ต่ำกว่า '+B.travel.minEnergy)+'</p><select id="prov" aria-label="จังหวัดปลายทาง">'+provs.map(function(p){return '<option>'+esc(p)+'</option>';}).join("")+'</select><button class="btn primary" id="travel" '+(E.canTravel(st)?'':'disabled')+'>เดินทางคืนนี้</button>');

function thVoice(){try{var v=speechSynthesis.getVoices();return v.filter(function(x){return /^th/i.test(x.lang);})[0]||null;}catch(e){return null;}}
function playIntro(done){
  var i=-1, timers=[], audio=null, ended=false, ov=document.createElement("div");
  ov.className="intro"; ov.setAttribute("role","dialog"); ov.setAttribute("aria-label","ฉากเปิดเกม");

  function duck(on){ if(MUS.bus&&SND.ctx) MUS.bus.gain.setTargetAtTime(on?0.45:1,SND.ctx.currentTime,0.5); }
  function stopVoice(){ timers.forEach(clearTimeout); timers=[]; try{speechSynthesis.cancel();}catch(e){} if(audio){audio.onended=audio.onerror=null;audio.pause();audio=null;} duck(false); }
  function finish(){ if(ended) return; ended=true; stopVoice(); try{save(INTRO_KEY,true);}catch(e){} ov.style.transition="opacity .6s"; ov.style.opacity="0"; setTimeout(function(){ov.remove();},620); if(SND.ctx) sndSet("drone",0); done&&done(); }

      var fired=false; u.onend=function(){ if(!fired){fired=true;duck(false);next();} }; u.onerror=u.onend;
      duck(true); speechSynthesis.speak(u);
      timers.push(setTimeout(function(){ if(!fired){fired=true;try{speechSynthesis.cancel();}catch(e){}next();} },est*2.2+4000));   /* safety if the engine never reports the end */
      return; }catch(e){} }
    timers.push(setTimeout(function(){show(i+1);},est+1400));
  }

function runTut(stage){

/* ---- update notice (director approved 27 Oct): the web build ships version.json; when a newer build is live,
   show a bar "มีอัปเดตใหม่ — แตะเพื่อโหลด". Checks every 5 min and when the app comes back to the screen. Save is in localStorage, so reload keeps progress. */
var UPD={shown:false,dismissed:""};
function updCheck(){
  var mine=window.WW3_BUILD; if(!mine||UPD.shown||!window.fetch||!/^https?:$/.test(location.protocol)) return;
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j||!j.build||j.build===mine||j.build===UPD.dismissed) return;
    UPD.shown=true; var bar=document.createElement("div"); bar.className="updbar"; bar.setAttribute("role","status");
    bar.innerHTML='<span>มีอัปเดตใหม่ของเกม</span><button class="updgo">แตะเพื่อโหลด</button><button class="updx" aria-label="ปิด">✕</button>';
    document.body.appendChild(bar);
    bar.querySelector(".updgo").onclick=function(){ try{persist();}catch(e){}
      var go=function(){location.reload();};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(function(rg){return rg&&rg.update();}).then(go,go);} else go(); };
    bar.querySelector(".updx").onclick=function(){UPD.dismissed=j.build;UPD.shown=false;bar.remove();};
  }).catch(function(){});
}
setInterval(updCheck,5*60*1000); setTimeout(updCheck,20000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) updCheck(); });
