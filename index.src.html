<title>WW3 Thailand Survival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: status ledger on the left, scene band + event card on the right; stacks to one column on phones (scene → card → ledger).
   Single dark look by choice (wartime night-shift console), so only bare :root carries the palette. */
:root{
  --bg:#141413; --panel:#1c1c1a; --panel-2:#232320; --line:#33322d; --line-2:#45433b;
  --fg:#ece8dd; --muted:#9d988a; --faint:#6d695e;
  --accent:#d6a63a; --accent-ink:#1b1606; --accent-soft:rgba(214,166,58,.12);
  --good:#7fb069; --bad:#d9644a; --warn:#d6a63a;
  --bar:#cfc8b6; --bar-track:#2c2b27;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- title screen ---------- */
.title{max-width:640px;margin:6vh auto 0;display:grid;gap:22px}
.title h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1.02;letter-spacing:.01em;margin:0;text-wrap:balance}
.title h1 small{display:block;font-size:.36em;letter-spacing:.32em;color:var(--accent);font-weight:600;margin-bottom:10px}
.title p{margin:0;color:var(--muted);max-width:60ch}
.stamp{display:inline-flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--accent);border:1px dashed var(--line-2);border-radius:999px;padding:3px 12px;width:fit-content}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.charcard{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.charcard dt{color:var(--muted)}
.charcard dd{margin:0;font-weight:500}
.board{width:100%;border-collapse:collapse;font-size:14px}
.board td,.board th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.board,.tbl table.board{width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;font-size:13px}
table.board th:nth-child(1),table.board td:nth-child(1){width:26px;padding-inline:4px}
table.board th:nth-child(3),table.board td:nth-child(3){width:58px;text-align:right}
table.board th:nth-child(4),table.board td:nth-child(4){width:31%}
table.board td{overflow-wrap:anywhere;vertical-align:top}
.board th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.06em}

/* ---------- game layout ---------- */
.game{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.side{position:sticky;top:12px;display:grid;gap:16px}
.main{display:grid;gap:16px;min-width:0}
@media (max-width:860px){
  .game{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:2}
}
.who{display:flex;gap:12px;align-items:center}
.badge{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--panel-2);border:1px solid var(--line-2);color:var(--accent);flex:none}
.who b{display:block;font-size:16px;line-height:1.3}
.who span{color:var(--muted);font-size:13px}
.facts{display:grid;gap:2px;font-size:13px;color:var(--muted);margin-top:10px}
.facts b{color:var(--fg);font-weight:500}
.stats{display:grid;gap:7px;margin-top:14px}
.stat{display:grid;grid-template-columns:22px 92px minmax(0,1fr) 34px;align-items:center;gap:8px;font-size:13.5px}
.stat .ic{font-size:14px;text-align:center}
.track{height:7px;background:var(--bar-track);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:4px;transition:width .5s ease}
.stat.mid .fill{background:var(--warn)}
.stat.low .fill{background:var(--bad)}
.stat.low .v{color:var(--bad)}
.stat .v{text-align:right;font-size:13px}
.sec-h{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.14em;color:var(--muted);margin:0 0 8px}
.mem{display:grid;gap:8px;font-size:13px;max-height:260px;overflow:auto}
.mem div{border-left:2px solid var(--line-2);padding-left:10px;color:var(--muted)}
.mem b{color:var(--fg);font-weight:500}
.side .row .btn{padding:7px 12px;font-size:13px}

/* header */
.dayline{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.dayline h2{font-family:var(--f-display);font-weight:700;font-size:24px;margin:0}
.dayline .meta{color:var(--muted);font-size:14px}
.pips{display:flex;gap:6px;margin-left:auto}
.pip{width:26px;height:6px;border-radius:3px;background:var(--line-2)}
.pip.done{background:var(--muted)}
.pip.now{background:var(--accent)}

/* scene band */
.scene{position:relative;height:clamp(190px,30vw,300px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#0e0e0d}
.scene .bg{position:absolute;inset:0;background-repeat:no-repeat;background-size:auto 100%;filter:saturate(.62) brightness(.82) contrast(1.02);transition:background-position 1.2s ease}
.scene .bg.loc{background-size:cover}
.scene .tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;transition:background .8s}
.scene .vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.scene .npc{position:absolute;bottom:9%;height:84%;width:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));transition:opacity .4s}
.scene .shadow{position:absolute;bottom:8%;height:14px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px)}
.scene .actor{position:absolute;bottom:9%;height:84%;width:0;z-index:1}
.scene .actor .spr{position:absolute;bottom:0;left:0;height:100%;width:auto;transform:translateX(-50%);transform-origin:50% 100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
/* NPC art cropped flat at the file edge: fade that edge so the cut is not a hard line (approved 27 Oct, option 2) */
.scene .actor .spr.fadeL{-webkit-mask-image:linear-gradient(to right,transparent 1%,#000 9%);mask-image:linear-gradient(to right,transparent 1%,#000 9%)}
.scene .actor .spr.fadeR{-webkit-mask-image:linear-gradient(to left,transparent 1%,#000 9%);mask-image:linear-gradient(to left,transparent 1%,#000 9%)}
.scene .actor .shadow{position:absolute;bottom:-1.5%;left:0;width:72px;max-width:14vw;height:12px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px)}
@media (prefers-reduced-motion:no-preference){
  .scene .actor .spr{animation:breathe 3.4s ease-in-out infinite alternate}
  .scene .actor.enter-left{animation:walkInL 1.3s cubic-bezier(.25,.7,.35,1) both}
  .scene .actor.enter-right{animation:walkInR 1.3s cubic-bezier(.25,.7,.35,1) .15s both}
  .scene .actor.enter-left .spr{animation:bob .32s ease-in-out 4,breathe 3.4s ease-in-out 1.3s infinite alternate}
  .scene .actor.enter-right .spr{animation:bob .32s ease-in-out .15s 4,breathe 3.4s ease-in-out 1.45s infinite alternate}
}
.sndbtn{font:inherit;font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-right:6px;cursor:pointer}
.sndbtn[aria-pressed="true"]{color:var(--accent);border-color:rgba(214,166,58,.45)}
table.board tr.me td{background:rgba(214,166,58,.12)}
.you{color:var(--accent);font-size:11px;font-weight:600}
.scene .actor .wsheet{position:absolute;bottom:0;left:0;height:100%;aspect-ratio:168/433;transform:translateX(-50%);background-repeat:no-repeat;background-size:400% 100%;background-position:0 0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.scene .actor .wsheet.walking{background-size:800% 100%}
@media (prefers-reduced-motion:no-preference){
  .scene .actor .wsheet.idle{animation:idle4 2.4s steps(4,end) infinite}
  .scene .actor .wsheet.walking{animation:walk8 1s steps(8,end) infinite}
}
@keyframes walk8{from{background-position:0 0}to{background-position:114.2857% 0}}
@keyframes idle4{from{background-position:0 0}to{background-position:133.3333% 0}}
@keyframes walkInL{from{transform:translateX(-46vw)}to{transform:translateX(0)}}
@keyframes walkInR{from{transform:translateX(46vw)}to{transform:translateX(0)}}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3%)}}
@keyframes breathe{from{transform:translateX(-50%) scaleY(1)}to{transform:translateX(-50%) scaleY(1.012)}}
.scene .foot-band{position:absolute;left:0;right:0;bottom:0;height:17%;min-height:26px;background:linear-gradient(180deg,rgba(12,12,11,0),rgba(12,12,11,.78) 45%);z-index:2;pointer-events:none}
.scene .who-tag{position:absolute;bottom:5px;transform:translateX(-50%);font-size:11.5px;line-height:1.5;color:var(--fg);padding:1px 9px;border-radius:999px;background:rgba(12,12,11,.6);border:1px solid rgba(255,255,255,.12);white-space:nowrap;z-index:3;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.scene .who-tag.me{color:var(--accent);font-weight:600;border-color:rgba(214,166,58,.45)}
.scene .npc.player{z-index:1}
.scene .actor.pet{z-index:2}
.scene .actor.pet .shadow{width:48px;height:8px}
.scene .tag{position:absolute;right:10px;top:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;background:rgba(10,10,9,.66);color:var(--fg);padding:3px 9px;border-radius:999px}
.scene .props{position:absolute;right:10px;top:10px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.scene .props img{width:40px;height:40px;background:rgba(10,10,9,.6);border-radius:8px;padding:3px;border:1px dashed var(--accent)}
@media (prefers-reduced-motion:no-preference){ .scene .bg{animation:drift 40s ease-in-out infinite alternate} }
@keyframes drift{from{transform:scale(1.04) translateX(-1%)}to{transform:scale(1.04) translateX(1%)}}

/* event card */
.event{border-left:3px solid var(--accent)}
.eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.16em;color:var(--accent);font-weight:600}
.event h3{font-family:var(--f-display);font-size:22px;font-weight:600;margin:2px 0 8px;text-wrap:balance}
.event p.scene-text{margin:0 0 14px;max-width:68ch}
.recall{font-size:13px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:14px}
.recall b{color:var(--fg);font-weight:500}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice .k{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:16px;line-height:1.5}
.choice .peek{display:block;margin-top:4px}
.result p{margin:0 0 12px;max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.up{color:var(--good);border-color:rgba(127,176,105,.4)}
.chip.down{color:var(--bad);border-color:rgba(217,100,74,.4)}
.chip.none{color:var(--faint)}
.foot{display:flex;justify-content:flex-end;margin-top:14px;gap:10px;flex-wrap:wrap}
/* chapters + night (27 Oct) */
.chap{font-size:13px;background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:7px 11px;margin:10px 0 0}
.chap b{color:var(--accent)}
.chap{cursor:pointer}
.nopts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.nopt{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:9px 6px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.25}
.nopt small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:3px}
.nopt:hover{border-color:var(--accent)}
.place{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;margin:0 0 8px;cursor:pointer}
.place b{display:block;margin-bottom:4px}
/* stock + build (28 Oct) */
.stockbar{display:flex;flex-wrap:nowrap;align-items:center;gap:2px 8px;width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:5px 8px;margin:12px 0 8px;cursor:pointer;font-size:13px;overflow:hidden}
.stockbar .it{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.stockbar .it.zero{opacity:.4}
.stockbar img,.srow img,.ichip img{width:20px;height:20px;object-fit:contain}
.stockbar .more{margin-left:auto;color:var(--accent);white-space:nowrap}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow img{width:26px;height:26px}
.srow .sub{display:block;font-size:12px;color:var(--muted)}
.srow .btn{padding:6px 12px;font-size:13px}
.srow .lack{color:var(--bad)}
.ichip{display:inline-flex;align-items:center;gap:3px}
/* built things stand in the home scene (28 Oct) */
.scene .bitem{position:absolute;bottom:7%;height:21%;width:auto;transform:translateX(-50%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.55)) saturate(.8) brightness(.92);z-index:0;pointer-events:none}
.scene .bitem.new{animation:bnew 1.6s ease-out 2}
@keyframes bnew{0%{filter:drop-shadow(0 0 0 rgba(212,168,67,0)) brightness(1.4)}50%{filter:drop-shadow(0 0 10px rgba(212,168,67,.9)) brightness(1.3)}100%{filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}}
.trader{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;background:rgba(127,176,105,.1);border:1px solid rgba(127,176,105,.55);border-radius:10px;padding:4px 10px;margin:8px 0 0;cursor:pointer}
.trader img{width:34px;height:34px;object-fit:cover;object-position:50% 12%;border-radius:8px}
.trader b{display:block;color:var(--good)}
.trader small{display:none}
.trader .go{color:var(--good);font-weight:600;white-space:nowrap}
.bigbuild{display:block;width:96px;height:96px;object-fit:contain;margin:4px auto 6px}
.nopt small.keep{display:block}
.tally{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:8px 0 0}
.log{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.log li{color:var(--muted)}
.log b{color:var(--fg);font-weight:500}
.travel{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2);font-size:14px}
select{background:var(--panel-2);color:var(--fg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:inherit;max-width:100%}
.note{font-size:12.5px;color:var(--faint)}
.dead h3{color:var(--bad)}

/* draft review panel */
.overlay{position:fixed;inset:0;background:rgba(5,5,4,.7);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);max-width:980px;width:100%;padding:20px;display:grid;gap:18px}
.sheet h2{font-family:var(--f-display);margin:0;font-size:22px}
.sheet h4{margin:0 0 6px;font-family:var(--f-display);letter-spacing:.06em}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:13px;min-width:640px;width:100%}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:500}
.tbl td:first-child{white-space:nowrap} .st-done{color:var(--good)} .st-dev{color:var(--warn)} .st-un{color:var(--bad)}
.toggles{display:grid;gap:8px;font-size:14px}
.toggles label{display:flex;gap:8px;align-items:center;cursor:pointer}

/* ---------- compact status strip + read-full + sheets (all sizes) ---------- */
.more{background:none;border:0;padding:0;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.recall{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mtop{display:none}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.s{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 4px;font-size:12px}
.s .i{font-size:13px;line-height:1}
.s .v{text-align:right;font-family:var(--f-mono);font-size:13px;transition:color .3s}
.s .t{grid-column:1/-1;height:4px;background:var(--bar-track);border-radius:3px;overflow:hidden}
.s .t div{height:100%;background:var(--bar);transition:width .5s}
.s.mid .t div{background:var(--warn)} .s.low .v{color:var(--bad)} .s.low .t div{background:var(--bad)}
.s.flash-up .v{color:var(--good)} .s.flash-down .v{color:var(--bad)}
.s .d{font-size:10px;font-family:var(--f-mono);margin-left:2px}
.s.flash-up .d{color:var(--good)} .s.flash-down .d{color:var(--bad)}
.wmini{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.wmini .badge{width:28px;height:28px;font-size:14px;border-radius:7px}
.wmini span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wmini b{color:var(--fg);font-weight:600}
.wmini button{margin-left:auto;flex:none;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.bsheet{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--panel);border-top:1px solid var(--line-2);border-radius:18px 18px 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:82vh;overflow:auto;display:grid;gap:12px;max-width:720px;margin:0 auto}
.bscrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.55)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto}
.bsheet p{margin:0}
.bsheet .closer{justify-self:end}

/* ---------- phone: everything on one screen ---------- */
@media (max-width:860px){
  body.ingame{padding-block:0}
  body.ingame .wrap{max-width:none}
  .game{display:flex;flex-direction:column;align-items:stretch;gap:10px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:8px 10px}
  .mtop,.main,.main > *{width:100%}
  .side{display:none}
  .mtop{display:grid;gap:7px;flex:none}
  .mtop .dayline h2{font-size:20px}
  .mtop .dayline .meta{font-size:12.5px}
  .mtop .pip{width:18px;height:5px}
  .main{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0}
  .main > .dayline{display:none}
  .scene{flex:1 20 150px;height:auto;min-height:84px;max-height:min(52vh,290px)}  /* cap (28 Oct): short cards no longer blow the characters up */
  .main > .card{flex:0 0 auto;min-height:0;max-height:calc(100% - 92px);overflow:auto;padding:12px 14px}
  .eyebrow{font-size:11.5px}
  .event h3{font-size:18px;margin:1px 0 4px}

<script>
(function(){

var st=null, pendingChar=null, view="title", showDraft=false, lastEnterKey=null;
var STAT={}; B.stats.forEach(function(s){STAT[s.key]=s;});

function load(k,def){try{var v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}

/* playtest log (director approved 27 Oct): opt-in via ?test=1 or the draft panel; stays in this browser until exported */
try{var _q=new URLSearchParams(location.search);if(_q.get("test")==="1"){opts.test=true;save(OPT_KEY,opts);}if(_q.get("test")==="0"){opts.test=false;save(OPT_KEY,opts);}}catch(e){}
var LOG_KEY="ww3ts.playlog.v1", shownAt=0, shownKey="";
function plog(type,extra){
  if(!opts.test||!st) return;
  var L=load(LOG_KEY,[]); var s=st.stats||{};
  L.push(Object.assign({t:Date.now(),run:st.runId||"",type:type,day:st.day,health:s.health,fullness:s.fullness,hydration:s.hydration,energy:s.energy,mental:s.mental,safety:s.safety,clean:s.clean},extra||{}));
  if(L.length>5000) L=L.slice(-5000); save(LOG_KEY,L);
}
function logCSV(){

  var q=function(v){v=v==null?"":String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return "﻿"+cols.join(",")+"\n"+L.map(function(r){return [new Date(r.t).toISOString(),r.run,r.type,r.day,r.id,r.arc,r.path,r.key,r.ms,r.health,r.fullness,r.hydration,r.energy,r.mental,r.safety,r.clean,r.note].map(q).join(",");}).join("\n");
}
function exportLog(){

  if(window.claude&&claude.use){claude.use("downloads").then(function(dl){
    if(dl) dl.save({filename:name,data:new Blob([csv],{type:"text/csv"})}).catch(function(){});
  }).catch(function(){});}
  else try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}catch(e){}
  openSheet('<div class="eyebrow">บันทึกการเล่น</div><p class="note">ถ้าไฟล์ไม่ดาวน์โหลดเอง ให้คัดลอกข้อความด้านล่างไปวางในไฟล์ .csv</p><textarea readonly style="width:100%;height:40vh;font:12px var(--f-mono)">'+esc(csv)+'</textarea>');
}
function logCount(){return load(LOG_KEY,[]).length;}
var storageOK=save("ww3ts.probe",1);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function hhmm(h){var H=Math.floor(h),M=Math.round((h-H)*60);return (H<10?"0":"")+H+":"+(M<10?"0":"")+M;}
/* ---- sound (director approved 27 Oct): no music files — ambience and cues synthesized with Web Audio, so no licensing.
   Layers: wind (all day) · crickets (evening/night) · rain (weather arc) · low drone when health < 30.
   Cues: choice tick · day-end bell · accident thud · death fade. Starts on the first tap (browser rule); toggle remembered. */
var SND={ctx:null,on:load("ww3ts.sound.v1",true)!==false,master:null,layers:{},timer:null,mood:""};
function sndInit(){
  if(SND.ctx||!SND.on) return;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{SND.ctx=new AC();}catch(e){return;}
  var c=SND.ctx; SND.master=c.createGain(); SND.master.gain.value=0.0001; SND.master.connect(c.destination);
  SND.master.gain.setTargetAtTime(0.55,c.currentTime,1.2);
  var buf=c.createBuffer(1,c.sampleRate*3,c.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<d.length;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}           /* brown noise */
  function loopNoise(){var s=c.createBufferSource();s.buffer=buf;s.loop=true;s.start();return s;}
  /* wind: brown noise through a slowly moving band-pass */
  var wf=c.createBiquadFilter();wf.type="bandpass";wf.frequency.value=380;wf.Q.value=0.7;var wg=c.createGain();wg.gain.value=0;
  loopNoise().connect(wf);wf.connect(wg);wg.connect(SND.master);
  var lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=0.07;lg.gain.value=180;lfo.connect(lg);lg.connect(wf.frequency);lfo.start();
  /* rain: white-ish noise, high-passed */
  var rb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),rd=rb.getChannelData(0);for(i=0;i<rd.length;i++)rd[i]=(Math.random()*2-1)*(Math.random()<0.03?1:0.25);
  var rs=c.createBufferSource();rs.buffer=rb;rs.loop=true;rs.start();var rf=c.createBiquadFilter();rf.type="highpass";rf.frequency.value=1800;var rg=c.createGain();rg.gain.value=0;rs.connect(rf);rf.connect(rg);rg.connect(SND.master);
  /* drone: two detuned low sines */
  var dg=c.createGain();dg.gain.value=0;[55,55.6].forEach(function(f){var o=c.createOscillator();o.type="sine";o.frequency.value=f;o.connect(dg);o.start();});dg.connect(SND.master);
  var cg=c.createGain();cg.gain.value=0;cg.connect(SND.master);
  SND.layers={wind:wg,rain:rg,drone:dg,crick:cg};
  SND.timer=setInterval(cricket,900);
  musInit();
  sndMood();
}
function cricket(){ var c=SND.ctx; if(!c||SND.layers.crick.gain.value<0.01||Math.random()<0.35) return;
  var t=c.currentTime, f=4200+Math.random()*600;
  for(var i=0;i<3;i++){var o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+i*0.07);g.gain.linearRampToValueAtTime(0.05,t+i*0.07+0.01);g.gain.linearRampToValueAtTime(0,t+i*0.07+0.05);o.connect(g);g.connect(SND.layers.crick);o.start(t+i*0.07);o.stop(t+i*0.07+0.06);}
}
/* ---- music (director approved 27 Oct: synthesized, no files). Slow A-minor pad + sparse plucked notes with echo.
   Mood follows the scene: day = fuller · night = lower and sparser · health < 30 = dark pad, no melody · dead = fades out. */
var MUS={bus:null,pad:null,mel:null,lp:null,next:0,chord:0,noteAt:0,mode:"",timer:null};
var MUS_CHORDS=[[110,130.81,164.81],[87.31,110,130.81],[73.42,87.31,110],[82.41,103.83,123.47]];   /* Am · F · Dm · E */
var MUS_SCALE=[220,261.63,293.66,329.63,392,440,523.25,587.33,659.25];                              /* A-minor pentatonic */
var MUS_MOOD={menu:{pad:0.050,mel:0.040,rate:0.45,oct:1,cut:900},day:{pad:0.050,mel:0.045,rate:0.55,oct:1,cut:1000},
  night:{pad:0.042,mel:0.032,rate:0.32,oct:0.5,cut:650},low:{pad:0.040,mel:0,rate:0,oct:0.5,cut:380},dead:{pad:0,mel:0,rate:0,oct:0.5,cut:300}};
function musInit(){
  var c=SND.ctx; if(!c||MUS.bus) return;
  MUS.bus=c.createGain(); MUS.bus.gain.value=1; MUS.bus.connect(SND.master);
  MUS.lp=c.createBiquadFilter(); MUS.lp.type="lowpass"; MUS.lp.frequency.value=900; MUS.lp.Q.value=0.4;
  MUS.pad=c.createGain(); MUS.pad.gain.value=0; MUS.pad.connect(MUS.lp); MUS.lp.connect(MUS.bus);
  MUS.mel=c.createGain(); MUS.mel.gain.value=0; MUS.mel.connect(MUS.bus);
  var dl=c.createDelay(1.5), fb=c.createGain(), dlf=c.createBiquadFilter(); dl.delayTime.value=0.42; fb.gain.value=0.34; dlf.type="lowpass"; dlf.frequency.value=2200;
  MUS.mel.connect(dl); dl.connect(dlf); dlf.connect(fb); fb.connect(dl); dlf.connect(MUS.bus);
  MUS.next=c.currentTime+0.2; MUS.noteAt=c.currentTime+2.5;
  MUS.timer=setInterval(musTick,250);
}
function musChord(t,freqs,len){
  var c=SND.ctx;
  freqs.forEach(function(f,i){
    [0,4].forEach(function(cent,j){
      var o=c.createOscillator(), g=c.createGain(); o.type=j?"triangle":"sine";
      o.frequency.value=f*Math.pow(2,cent/1200);
      var v=(j?0.45:1)/freqs.length;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+3.2); g.gain.setValueAtTime(v,t+len-0.4); g.gain.linearRampToValueAtTime(0,t+len+3.2);
      o.connect(g); g.connect(MUS.pad); o.start(t); o.stop(t+len+3.4);
    });
  });
}
function musNote(t,f){
  var c=SND.ctx;
  [[1,"sine",1],[2,"sine",0.22],[3,"triangle",0.06]].forEach(function(h){
    var o=c.createOscillator(), g=c.createGain(); o.type=h[1]; o.frequency.value=f*h[0];
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(h[2],t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+2.4/h[0]);
    o.connect(g); g.connect(MUS.mel); o.start(t); o.stop(t+2.6);
  });
}
function musTick(){
  var c=SND.ctx; if(!c||!MUS.bus||c.state!=="running") return;
  var m=MUS_MOOD[MUS.mode]||MUS_MOOD.menu, now=c.currentTime, len=9;
  if(MUS.next<now+0.6){ if(m.pad>0) musChord(MUS.next,MUS_CHORDS[MUS.chord%4],len); MUS.chord++; MUS.next+=len; }
  if(m.rate>0&&MUS.noteAt<now+0.4){
    if(Math.random()<m.rate){ var ch=MUS_CHORDS[(MUS.chord+3)%4], pool=MUS_SCALE.slice(0,7);
      var f=Math.random()<0.5? ch[Math.floor(Math.random()*3)]*4 : pool[Math.floor(Math.random()*pool.length)];
      musNote(MUS.noteAt,f*(m.oct<1?0.5:1)); }
    MUS.noteAt+=1.3+Math.random()*2.2;
  }
}
function musSet(mode){
  if(!MUS.bus||MUS.mode===mode) return; MUS.mode=mode; var m=MUS_MOOD[mode], t=SND.ctx.currentTime;
  MUS.pad.gain.setTargetAtTime(m.pad,t,2.5); MUS.mel.gain.setTargetAtTime(m.mel,t,2.0); MUS.lp.frequency.setTargetAtTime(m.cut,t,3);
}
function sndSet(layer,v,tc){var g=SND.layers[layer];if(g&&SND.ctx)g.gain.setTargetAtTime(v,SND.ctx.currentTime,tc||1.5);}
/* pick layers from the current scene: hour, weather arc, health */
function sndMood(){
  if(!SND.ctx||!st||view!=="game"){ if(SND.ctx){sndSet("wind",0.10);sndSet("crick",0);sndSet("rain",0);sndSet("drone",0);musSet("menu");} return; }
  var cur=E.currentEvent(st), h=(st.phase==="event"&&cur)?cur.hour:21.5, ev=cur&&cur.ev;
  var night=h>=19||h<6, rain=!!(ev&&(st.phase==="event"||st.phase==="result")&&ev.arc==="สภาพอากาศ"), low=st.stats.health<30, dead=st.phase==="dead";
  sndSet("wind",dead?0.03:(night?0.10:0.16)); sndSet("crick",night&&!dead?0.9:0); sndSet("rain",rain?0.06:0); sndSet("drone",dead?0.10:(low?0.08:0),2.5);
  musSet(dead?"dead":low?"low":night?"night":"day");
}
function cue(kind){
  var c=SND.ctx; if(!c||!SND.on) return; var t=c.currentTime;
  function tone(f,dur,vol,type,at){var o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(0,t+(at||0));g.gain.linearRampToValueAtTime(vol,t+(at||0)+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+(at||0)+dur);o.connect(g);g.connect(SND.master);o.start(t+(at||0));o.stop(t+(at||0)+dur+0.05);}
  if(kind==="tick") tone(880,0.08,0.05,"triangle");
  else if(kind==="day"){tone(196,1.6,0.08);tone(294,1.4,0.04,"sine",0.02);}
  else if(kind==="hurt"){tone(70,0.5,0.25,"sine");tone(110,0.25,0.08,"square");}
  else if(kind==="death"){tone(110,3,0.10);tone(82,3.5,0.08,"sine",0.4);}
}
function sndToggle(){
  SND.on=!SND.on; save("ww3ts.sound.v1",SND.on);
  if(SND.on){ if(!SND.ctx) sndInit(); else {SND.ctx.resume();SND.master.gain.setTargetAtTime(0.55,SND.ctx.currentTime,0.4);} }
  else if(SND.ctx){SND.master.gain.setTargetAtTime(0.0001,SND.ctx.currentTime,0.2);}
  document.querySelectorAll(".sndbtn").forEach(function(b){b.textContent=SND.on?"เสียง: เปิด":"เสียง: ปิด";b.setAttribute("aria-pressed",SND.on?"true":"false");});
}
function sndBtn(){return '<button class="sndbtn" aria-pressed="'+(SND.on?"true":"false")+'">'+(SND.on?"เสียง: เปิด":"เสียง: ปิด")+'</button>';}
document.addEventListener("pointerdown",function(){ if(SND.on){ if(!SND.ctx) sndInit(); else if(SND.ctx.state==="suspended") SND.ctx.resume(); } },{capture:true});
document.addEventListener("click",function(e){ if(e.target.closest&&e.target.closest(".sndbtn")) sndToggle(); });
document.addEventListener("visibilitychange",function(){ if(!SND.ctx) return; if(document.hidden) SND.ctx.suspend(); else if(SND.on) SND.ctx.resume(); });

function period(h){return h<9?"ช่วงเช้า":h<12?"ช่วงสาย":h<16?"ช่วงบ่าย":h<19?"ช่วงเย็น":h<22?"ช่วงค่ำ":"กลางดึก";}
function tint(h){
  if(h<9) return "linear-gradient(180deg,rgba(255,214,160,.25),rgba(120,110,90,.15))";
  if(h<16) return "linear-gradient(180deg,rgba(255,255,255,0),rgba(90,90,80,.12))";
  if(h<19) return "linear-gradient(180deg,rgba(230,150,90,.38),rgba(80,60,50,.25))";
  if(h<22) return "linear-gradient(180deg,rgba(60,70,120,.62),rgba(30,30,50,.55))";
  return "linear-gradient(180deg,rgba(20,26,60,.82),rgba(10,10,25,.75))";
}
/* outdoor scenes are 16:9 photos: size them a little larger than the scene so each event can show a different part (28 Oct) */
function sizeLoc(){var el=document.querySelector(".scene .bg.loc");if(!el)return;var r=el.getBoundingClientRect();if(!r.width||!r.height)return;var w=Math.max(r.width,r.height*1.778)*1.14;el.style.backgroundSize=Math.round(w)+"px auto";}

function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function chip(k,v){var s=STAT[k];return '<span class="chip num '+(v>0?"up":"down")+'">'+esc(s?s.th:k)+" "+(v>0?"+":"")+v+"</span>";}
function chips(d){var keys=Object.keys(d);return keys.length?keys.map(function(k){return chip(k,d[k]);}).join(""):'<span class="chip none">ไม่มีการเปลี่ยนแปลงต่อสถานะ</span>';}

    b.map(function(r,i){return '<tr><td class="num">'+(i+1)+'</td><td>'+esc(r.name)+' · '+esc(r.occ)+'<br><span class="note">'+esc(r.province)+'</span></td><td class="num">'+r.days+'</td><td>'+esc(r.cause||"–")+'</td></tr>';}).join("")+'</table></div>';
}

/* ---- online leaderboard (director approved 27 Oct): artifact db, one best run per player ----
   board/<viewer id> = {name, occ, province, days, cause, at}. Everyone who can open the page reads;
   each player (Contributor and up) writes only their own document. Works without it (local board stays). */
var NET={provider:null,db:null,uid:null,rows:null,state:"off",unsub:null,sent:false,sending:false,err:""};
var CFG=window.WW3_ONLINE||{};
function supaOn(){return !!(CFG.supabaseUrl&&CFG.anonKey);}
function clientId(){var id=load("ww3ts.client.v1",null);if(!id){id=(crypto&&crypto.randomUUID)?crypto.randomUUID():"10000000-1000-4000-8000-100000000000".replace(/[018]/g,function(c){return (c^Math.random()*16>>c/4).toString(16);});save("ww3ts.client.v1",id);}return id;}
function supaFetch(path,opt){opt=opt||{};var h={apikey:CFG.anonKey,Authorization:"Bearer "+CFG.anonKey,"Content-Type":"application/json"};
  for(var k in (opt.headers||{}))h[k]=opt.headers[k];
  return fetch(CFG.supabaseUrl.replace(/\/$/,"")+"/rest/v1/"+path,{method:opt.method||"GET",headers:h,body:opt.body});}
function supaLoad(){
  NET.state="loading";refreshBoards();
  supaFetch("runs?select=nickname,char_name,occupation,province,days,cause,client_id&order=days.desc,created_at.asc&limit=20")
    .then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(a){var me=clientId();NET.rows=a.map(function(x){return {nick:String(x.nickname||""),name:String(x.char_name||""),occ:String(x.occupation||""),province:String(x.province||""),days:+x.days||0,cause:String(x.cause||""),mine:x.client_id===me};});NET.state="on";refreshBoards();})
    .catch(function(){NET.state="off";NET.err="โหลดอันดับไม่ได้";refreshBoards();});
}
function initOnline(){
  if(supaOn()){NET.provider="supa";supaLoad();return;}
  if(!(window.claude&&claude.use)) return;
  NET.provider="claude"; NET.state="loading";
  Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
    NET.db=r[0]; var u=r[1];
    if(!NET.db){NET.state="off";refreshBoards();return;}
    return (u?u.id():Promise.resolve(null)).then(function(id){
      NET.uid=id||null; NET.state="on";
      try{
        NET.unsub=NET.db.collection("board").orderBy("days","desc").limit(20).onSnapshot(function(s){
          NET.rows=s.docs.map(function(d){var x=d.data()||{};return {name:String(x.name||""),occ:String(x.occ||""),province:String(x.province||""),days:+x.days||0,cause:String(x.cause||""),mine:!!NET.uid&&d.id===NET.uid};});
          refreshBoards();
        },function(){NET.state="off";refreshBoards();});
      }catch(e){NET.state="off";}
      refreshBoards();
    });
  }).catch(function(){NET.state="off";refreshBoards();});
}
function onlineBoardHTML(n){
  if(NET.state==="loading"||(NET.state==="on"&&!NET.rows)) return '<p class="note">กำลังโหลดอันดับ…</p>';
  if(NET.state!=="on") return '<p class="note">'+(NET.err?esc(NET.err)+' · ':'')+'อันดับออนไลน์ยังไม่เปิดในหน้านี้ ตอนนี้แสดงเฉพาะสถิติในเครื่อง</p>';
  var rows=NET.rows.slice(0,n||20);
  if(!rows.length) return '<p class="note">ยังไม่มีใครส่งสถิติ ชีวิตแรกที่จบลงจะขึ้นอันดับที่นี่</p>';
  return '<div class="tbl" style="overflow-x:auto"><table class="board"><tr><th>#</th><th>ผู้เล่น · ตัวละคร</th><th>รอด (วัน)</th><th>สาเหตุ</th></tr>'+
    rows.map(function(r,i){return '<tr'+(r.mine?' class="me"':'')+'><td class="num">'+(i+1)+'</td><td>'+(r.nick?'<b>'+esc(r.nick)+'</b> · ':'')+esc(r.name)+' · '+esc(r.occ)+(r.mine?' <b class="you">คุณ</b>':'')+'<br><span class="note">'+esc(r.province)+'</span></td><td class="num">'+r.days+'</td><td>'+esc(r.cause||"–")+'</td></tr>';}).join("")+'</table></div>';
}
function refreshBoards(){
  document.querySelectorAll("[data-online-board]").forEach(function(el){el.innerHTML=onlineBoardHTML(+el.getAttribute("data-online-board")||20);});
  var f=document.getElementById("submitBox"); if(f) f.outerHTML=submitBoxHTML();
  bindSubmit();
}
/* Claude provider: auto-submit own best (unchanged). Supabase provider: player types a nickname and presses send. */
function submitOnline(run){
  if(NET.provider!=="claude"||!NET.db||!NET.uid) return;
  var ref; try{ref=NET.db.collection("board").doc(NET.uid);}catch(e){return;}
  ref.get().then(function(s){var cur=s.exists?(+(s.data()||{}).days||0):-1;if(run.days>cur) return ref.set(run);})
    .then(function(){NET.sent=true;},function(){});
}
function submitBoxHTML(){
  if(NET.provider!=="supa"||!st||(st.phase!=="dead"&&st.phase!=="ending")) return '<div id="submitBox"></div>';
  if(NET.sent) return '<div id="submitBox"><p class="note">ส่งขึ้นอันดับแล้ว</p></div>';
  return '<div id="submitBox" class="row" style="gap:8px;margin-top:6px;align-items:center"><input id="nick" maxlength="20" placeholder="ชื่อเล่นที่จะขึ้นอันดับ" value="'+esc(load("ww3ts.nick.v1","")||"")+'" style="flex:1;min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit"><button class="btn" id="sendRun"'+(NET.sending?' disabled':'')+'>'+(NET.sending?'กำลังส่ง…':'ส่งขึ้นอันดับ')+'</button>'+(NET.err&&NET.state==="on"?'<p class="note" style="width:100%;color:var(--bad)">'+esc(NET.err)+'</p>':'')+'</div>';
}
function bindSubmit(){
  var b=document.getElementById("sendRun"); if(!b||b._bound) return; b._bound=true;
  b.addEventListener("click",function(){
    var nick=(document.getElementById("nick").value||"").trim().slice(0,20);
    if(!nick){NET.err="ใส่ชื่อเล่นก่อนส่ง";refreshBoards();return;}
    save("ww3ts.nick.v1",nick); NET.sending=true; NET.err=""; refreshBoards();
    var body={client_id:clientId(),nickname:nick,char_name:st.char.name,occupation:st.char.occupation,province:st.char.province,days:E.daysSurvived(st),cause:(st.phase==="ending"?"รอดจนจบ · "+D.chapters.endings[st.ending.key].title:causeTh(st.deathCause)),events:st.playEvents||0,play_seconds:Math.round(st.playSec||0),game_version:CFG.gameVersion||""};
    supaFetch("runs",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)})
      .then(function(r){NET.sending=false;if(!r.ok)throw 0;NET.sent=true;st.submitted=true;persist&&persist();supaLoad();})
      .catch(function(){NET.sending=false;NET.err="ส่งไม่สำเร็จ ลองใหม่อีกครั้งในอีกสักครู่";refreshBoards();});
  });
}

function causeTh(k){var m=B.deathCauses||{};return m[k]||m.other||"สุขภาพทรุดลง";}
function petTh(c){var p=(B.character.pets||[]).filter(function(x){return x.key===(c.pet||"none");})[0];return p?p.th:"ไม่มีสัตว์เลี้ยง";}
/* side walk/idle sheets from Blender delivery (director approved option 1, 27 Oct): 8-frame walk, 4-frame idle, facing right.
   Walk is in place; the scene moves the actor at ~184px/s per 433px of sprite height so the feet do not slide. */
var _pre={};
var NPC_CUT={NPC_03:"L",NPC_06:"L",NPC_07:"L",NPC_10:"L",NPC_12:"R",NPC_15:"R",NPC_18:"R"};
function preloadRun(){ if(!st||!st.char) return; var k=sideKey(), pi=E.petSpriteOf(st.char), u=[A.walk[k+"_walk"],A.walk[k+"_idle"],pi&&A.pets[pi.id],A.bg[B.character.tiers[st.char.tier].bg]].concat(Object.keys(B.arcScene||{}).map(function(a){return A.bg[B.arcScene[a]];}));
  u.forEach(function(x){ if(x&&!_pre[x]&&x.indexOf("data:")!==0){_pre[x]=1;var im=new Image();im.src=x;} }); }
function sideKey(){var c=st.char;return c.sex==="หญิง"?"female":("male_"+c.tier);}
function driveWalkIn(){
  var me=document.querySelector(".scene .actor.me.sidewalk.walkin"); if(!me) return;
  var sh=me.querySelector(".wsheet"), scene=me.closest(".scene");
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function toIdle(){sh.classList.remove("walking");sh.classList.add("idle");sh.style.backgroundImage="url("+A.walk[sideKey()+"_idle"]+")";}
  if(reduce||!me.animate){toIdle();return;}
  var h=sh.getBoundingClientRect().height, w=h*168/433, W=scene.getBoundingClientRect().width;
  var d=0.22*W+w*0.6+8, v=h*184/433, dur=Math.max(700,Math.min(3200,d/v*1000));
  var kf=[{transform:"translateX("+(-d)+"px)"},{transform:"translateX(0)"}];
  var an=me.animate(kf,{duration:dur,easing:"linear"});
  document.querySelectorAll(".scene .actor.pet.walkin").forEach(function(p){p.animate(kf,{duration:dur,easing:"linear",delay:0});});
  an.onfinish=toIdle;
}
function playerSprite(){
  var c=st.char; var key=c.sex==="หญิง"?"female":("male_"+c.tier);
  return A.player[key]||null;
}
/* where the scene happens: event's own scene, else its arc's scene, else night place, else home (27 Oct) */
function sceneKey(ev){
  if(ev) return ev.scene||(B.eventScene||{})[ev.id]||(B.arcScene||{})[ev.arc]||null;
  var nr=st.phase==="night"&&st.nightResult;
  if(nr&&nr.place){var act=B.night.actions.filter(function(a){return a.key===nr.key;})[0],pl=act&&act.places&&act.places.filter(function(p){return p.id===nr.place;})[0];return pl&&pl.scene||null;}
  return null;
}

  return '<div class="scene"><div class="bg'+(loc?' loc':'')+'"'+(loc?' data-x="'+(ev?hash(ev.id)%100:50)+'"':'')+' style="background-image:url('+bg+');background-position:'+(loc?(ev?hash(ev.id)%100:50):x)+'% '+(loc?'62%':'50%')+'"></div>'+
    '<div class="tint" style="background:'+tint(hour)+'"></div>'+player+pet+npc+trader+'<div class="vig"></div><div class="foot-band"></div>'+

function stockBarHTML(){var S=B.stock;if(!S)return "";var main=["food","water","meds","mat","elec","fuel","val"],pr=(st.phase==="summary"&&st.summary&&st.summary.produced)||{};return '<button class="stockbar" id="stockOpen" aria-label="คลังของ">'+main.map(function(k){var d=E.itemDef(k),n=(st.stock||{})[k]||0;return '<span class="it'+(n?'':' zero')+'" title="'+esc(d.th)+(pr[k]?' (บ้านผลิตได้ +'+pr[k]+')':'')+'">'+propImg(d.prop)+'<span class="num">'+n+'</span>'+(pr[k]?'<span class="num" style="color:var(--good);font-size:11px">+'+pr[k]+'</span>':'')+'</span>';}).join("")+'<span class="more">คลัง ›</span></button>';}
function buildEffectText(b){var t=[];if(b.gives)t.push(Object.keys(b.gives).map(function(k){return E.itemDef(k).th+' +'+b.gives[k];}).join(", ")+' ทุก '+b.every+' วัน'+(b.delay?' (เริ่มหลัง '+b.delay+' วัน)':''));if(b.daily)t.push(Object.keys(b.daily).map(function(k){return STAT[k].th+' +'+b.daily[k];}).join(", ")+' ทุกวัน');if(b.sleep)t.push('นอนพักได้ '+Object.keys(b.sleep).map(function(k){return STAT[k].th+' +'+b.sleep[k];}).join(", "));if(b.raidMult)t.push('โอกาสถูกปล้นเหลือ '+Math.round(b.raidMult*100)+'%');if(b.riskMult)t.push('ออกค้นหาเสี่ยงน้อยลง '+Math.round((1-b.riskMult)*100)+'%');return t.join(" · ");}
function openStock(){

function openTrader(){

/* chapters + night helpers (27 Oct) */
var NIGHT_HINT={scavenge:"ได้ของ เสี่ยงเจ็บ",guard:"กันขโมย",sleep:"พลังงานฟื้น",share:"สองแม่ลูก"};
function chapTag(){var C=D.chapters;if(!C||!st.chapter)return "";return 'บท '+st.chapter+'/'+C.list.length+' · ';}

  var ci=st.chapterIntro, C=D.chapters; if(!C||!ci||ci.day!==day) return "";

  return '<div class="chap" id="chapIntro" role="button" tabindex="0" title="แตะเพื่ออ่านเต็ม"><div class="chapt"><b>เข้าสู่บทที่ '+ci.n+' · '+esc(ch.title)+'</b><br>'+esc(ch.intro)+(dec&&dec.next[ci.key]?' · '+esc(dec.next[ci.key]):'')+((ci.extra||[]).map(function(l){return ' · '+esc(l);}).join(""))+'</div></div>';
}
function isFinalNight(){var C=D.chapters;if(!C||st.chapter<C.list.length)return false;return !E.availableArcs(st).length;}
function nextDayLabel(){return isFinalNight()?"ดูบทสรุปชีวิต":"เช้าวันที่ "+(st.day+1);}
function nightText(nr){
  var act=(B.night.actions.filter(function(a){return a.key===nr.key;})[0])||{}, pl=act.places&&act.places.filter(function(p){return p.id===nr.place;})[0];
  var o;
  if(nr.key==="travel") o={tag:"เดินทาง",h:"เดินทางข้ามจังหวัด",p:"คุณใช้ทั้งคืนเดินทางจนถึง"+(nr.to||st.char.province)};
  else if(nr.key==="scavenge") o=nr.injury?{tag:"ออกค้นหา · "+pl.th,h:"บาดเจ็บระหว่างทาง",p:"คุณพลาดล้มขณะค้น"+pl.th+" ได้ของกลับมาแค่ครึ่งเดียว"}:{tag:"ออกค้นหา · "+pl.th,h:"กลับมาพร้อมของ",p:"คุณค้น"+pl.th+"จนเกือบสว่าง ได้อาหารและน้ำกลับมา"};
  else if(nr.key==="build"){var bd=E.buildDef(nr.build);o={tag:"สร้างของ",h:"สร้าง"+bd.th+"เสร็จ",p:"คุณใช้ทั้งคืนประกอบ"+bd.th+" ตอนนี้ตั้งอยู่ในบ้านแล้ว ตั้งแต่พรุ่งนี้: "+buildEffectText(bd),img:A.props[bd.prop]};}
  else if(nr.key==="share") o={tag:"แบ่งของให้ต้น",h:"ของไปถึงสองแม่ลูก",p:"คุณแบกข้าวและน้ำไปที่อาคารร้างหลังตลาด แม่ของต้นลุกขึ้นนั่งได้แล้ว"};
  else if(nr.key==="guard") o=nr.repelled?{tag:"เฝ้าบ้าน",h:"ไล่โจรไปได้",p:"ตีสองมีคนมางัดรั้วหลังบ้าน คุณส่งเสียงและส่องไฟ พวกเขาวิ่งหนีไป ของในคลังไม่หาย"}:{tag:"เฝ้าบ้าน",h:"เฝ้าบ้านทั้งคืน",p:"คุณนั่งเฝ้าประตูจนฟ้าสาง ไม่มีใครเข้าใกล้บ้าน"};
  else o={tag:"นอนพัก",h:"นอนพักทั้งคืน",p:"คุณได้นอนเต็มคืน ตื่นมาพร้อมแรงที่กลับมา"};
  if(nr.raid) o.p+=" แต่ระหว่างคืนมีคนงัดเข้ามาขโมยของในคลังไปครึ่งหนึ่ง";
  else if(st.flags&&st.flags.dog&&nr.key!=="guard"&&nr.key!=="travel") o.p+=" หมาที่บ้านนอนเฝ้าประตูทั้งคืน";
  return o;
}
function doNight(k,p){
  E.night(st,k,p);
  plog("night",{note:k+(p?":"+p:"")+(st.nightResult&&st.nightResult.injury?" injury -"+st.nightResult.injury:"")+(st.nightResult&&st.nightResult.raid?" raid":"")});
  if(st.phase==="dead"){cue("death");recordDeath();}else cue(st.nightResult&&(st.nightResult.injury||st.nightResult.raid)?"hurt":"tick");
  persist();render();focusMain();
}

function openSheet(html,isChar){

function recordDeath(){
  if(st.recorded) return; st.recorded=true;
  var b=load(BOARD_KEY,[]);
  var cz=st.phase==="ending"?"รอดจนจบ · "+D.chapters.endings[st.ending.key].title:causeTh(st.deathCause);
  b.push({name:st.char.name,occ:st.char.occupation,province:st.char.province,days:E.daysSurvived(st),cause:cz,at:Date.now()});
  b.sort(function(x,y){return y.days-x.days;}); save(BOARD_KEY,b.slice(0,10));
  submitOnline({name:st.char.name,occ:st.char.occupation,province:st.char.province,days:E.daysSurvived(st),cause:cz,at:Date.now()});
  try{localStorage.removeItem(SAVE_KEY);}catch(e){}
}

/* ---- update notice (director approved 27 Oct): the web build ships version.json; when a newer build is live,
   show a bar "มีอัปเดตใหม่ — แตะเพื่อโหลด". Checks every 5 min and when the app comes back to the screen. Save is in localStorage, so reload keeps progress. */
var UPD={shown:false,dismissed:""};
function updCheck(){
  var mine=window.WW3_BUILD; if(!mine||UPD.shown||!window.fetch||!/^https?:$/.test(location.protocol)) return;
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j||!j.build||j.build===mine||j.build===UPD.dismissed) return;
    UPD.shown=true; var bar=document.createElement("div"); bar.className="updbar"; bar.setAttribute("role","status");
    bar.innerHTML='<span>มีอัปเดตใหม่ของเกม</span><button class="updgo">แตะเพื่อโหลด</button><button class="updx" aria-label="ปิด">✕</button>';
    document.body.appendChild(bar);
    bar.querySelector(".updgo").onclick=function(){ try{persist();}catch(e){}
      var go=function(){location.reload();};
      if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){navigator.serviceWorker.getRegistration().then(function(rg){return rg&&rg.update();}).then(go,go);} else go(); };
    bar.querySelector(".updx").onclick=function(){UPD.dismissed=j.build;UPD.shown=false;bar.remove();};
  }).catch(function(){});
}
setInterval(updCheck,5*60*1000); setTimeout(updCheck,20000);
document.addEventListener("visibilitychange",function(){ if(!document.hidden) updCheck(); });
window.__ww3={get state(){return st;},engine:E,render:function(){render();},snd:SND,mus:MUS,upd:UPD,updCheck:updCheck};
})();
